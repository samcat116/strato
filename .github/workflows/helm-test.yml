name: Helm Chart Tests

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - "helm/**"
      - "control-plane/web/src/lib/control-plane-route-prefixes.json"
      - "deploy/compose/nginx.conf"
      - ".github/scripts/test-control-plane-route-parity.py"
      - ".github/workflows/helm-test.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "helm/**"
      - "control-plane/web/src/lib/control-plane-route-prefixes.json"
      - "deploy/compose/nginx.conf"
      - ".github/scripts/test-control-plane-route-parity.py"
      - ".github/workflows/helm-test.yml"
  workflow_dispatch:

env:
  HELM_VERSION: v3.12.3

# Supersede in-progress runs on new pushes to the same ref.
concurrency:
  group: helm-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Helm Chart Linting
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Add Bitnami repository
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Lint Helm chart
        run: |
          helm lint helm/strato-control-plane/

      - name: Validate chart dependencies
        run: |
          cd helm/strato-control-plane
          helm dependency build

  template-validation:
    runs-on: ubuntu-latest
    name: Template Validation
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Add Bitnami repository
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Build dependencies
        run: |
          cd helm/strato-control-plane
          helm dependency build

      - name: Template with default values
        run: |
          helm template strato-test helm/strato-control-plane/ > /tmp/default-template.yaml
          echo "Default template generated successfully"

      - name: Assert control-plane build identity
        run: |
          if grep -q 'name: STRATO_GIT_SHA' /tmp/default-template.yaml; then
            echo "Default chart must preserve the full SHA baked into the image"
            exit 1
          fi

          git_sha=0123456789abcdef0123456789abcdef01234567
          helm template strato-git-sha helm/strato-control-plane/ \
            --set-string strato.gitSHA="$git_sha" > /tmp/git-sha-template.yaml
          grep -A 1 'name: STRATO_GIT_SHA' /tmp/git-sha-template.yaml \
            | grep -q "value: \"$git_sha\""

      - name: Assert non-overlapping control-plane replacement
        run: |
          python3 - <<'EOF'
          import re

          rendered = open('/tmp/default-template.yaml').read()
          deployments = [
              document
              for document in rendered.split('\n---\n')
              if re.search(r'^kind: Deployment$', document, re.MULTILINE)
              and 'app.kubernetes.io/component: control-plane' in document
          ]
          assert len(deployments) == 1, \
              f"expected one control-plane Deployment, found {len(deployments)}"
          assert re.search(
              r'^  strategy:\n    type: Recreate$',
              deployments[0],
              re.MULTILINE,
          ), "control-plane Deployment must use Recreate for the STR-275 cutover"
          print("Control-plane Deployment replacement is non-overlapping")
          EOF

      - name: Template every checked-in values scenario
        run: |
          for values in helm/strato-control-plane/ci/*.yaml; do
            scenario=$(basename "$values" .yaml)
            helm template "strato-$scenario" helm/strato-control-plane/ \
              -f "$values" > "/tmp/$scenario-template.yaml"
          done
          echo "All checked-in values scenarios generated successfully"

      - name: Assert control-plane route parity
        run: |
          helm template strato-routes helm/strato-control-plane/ \
            --set gateway.enabled=true \
            --set strato.externalHostname=strato.example.test \
            > /tmp/gateway-template.yaml
          python3 .github/scripts/test-control-plane-route-parity.py \
            /tmp/gateway-template.yaml

      - name: Assert Helm notes only recommend supported agent URLs
        run: |
          notes=helm/strato-control-plane/templates/NOTES.txt
          if grep -q 'ws://' "$notes"; then
            echo "❌ Helm notes contain an unsupported plaintext agent URL"
            exit 1
          fi
          grep -q 'wss://{{ include "strato-control-plane.gateway.agentsHost" . }}/agent/ws' "$notes"
          grep -q 'wss://agents.<host>/agent/ws' "$notes"
          grep -q 'TLS passthrough' "$notes"
          grep -q 'agent-mtls port' "$notes"

      - name: Assert no dev secrets in default render
        run: |
          # A bare install must never ship the historical dev credentials;
          # empty values auto-generate strong ones (credentials-secret.yaml).
          for needle in vapor_password strato-dev-key postgres_password; do
            if grep -q "$needle" /tmp/default-template.yaml; then
              echo "❌ Default render contains dev secret: $needle"
              exit 1
            fi
            if grep -q "$(echo -n "$needle" | base64)" /tmp/default-template.yaml; then
              echo "❌ Default render contains base64-encoded dev secret: $needle"
              exit 1
            fi
          done
          echo "✅ No dev secrets in default render"

      - name: Assert generated credentials are consistent
        run: |
          python3 - <<'EOF'
          import base64, re, sys
          r = open('/tmp/default-template.yaml').read()
          pw = base64.b64decode(re.search(r'db-password: "([^"]+)"', r).group(1)).decode()
          assert len(pw) >= 32, "generated credentials too short"
          print("✅ Generated credentials are internally consistent")
          EOF

      - name: Template with production values
        run: |
          helm template strato-prod helm/strato-control-plane/ \
            --set image.repository=strato-control-plane \
            --set image.tag=latest \
            --set strato.logLevel=info \
            --set postgresql.auth.password=secure-password \
            --set resources.limits.cpu=2000m \
            --set resources.limits.memory=2Gi \
            --set networkPolicy.enabled=true \
            --set podDisruptionBudget.enabled=true > /tmp/production-template.yaml
          echo "Production template generated successfully"

      - name: Template with external database
        run: |
          helm template strato-external helm/strato-control-plane/ \
            --set postgresql.enabled=false \
            --set externalDatabase.host=postgres.example.com \
            --set externalDatabase.password=external-db-password > /tmp/external-db-template.yaml
          echo "External database template generated successfully"

      - name: Template with an external monitoring stack
        run: |
          helm template strato-monitoring helm/strato-control-plane/ \
            -f helm/strato-control-plane/ci/external-monitoring-values.yaml \
            --set spire.enabled=true > /tmp/external-monitoring-template.yaml
          echo "External monitoring template generated successfully"

      - name: Assert scrape endpoints survive disabling the bundled Prometheus
        run: |
          python3 - <<'EOF'
          r = open('/tmp/external-monitoring-template.yaml').read()
          # The whole point of prometheusExport: metrics stay scrapeable with
          # opentelemetry.prometheus.enabled=false.
          assert 'kind: ServiceMonitor' in r, "no ServiceMonitor rendered"
          assert 'name: strato-monitoring-strato-control-plane-otel-collector\n' in r
          assert 'name: strato-monitoring-strato-control-plane-spire-server\n' in r
          assert 'exporters: [debug, prometheus]' in r, "collector prometheus exporter missing"
          assert 'prometheus.io/scrape' in r, "scrape annotations missing"
          # ...and the bundled Prometheus StatefulSet/PVC does not come along.
          assert 'strato-monitoring-strato-control-plane-prometheus' not in r, \
              "bundled Prometheus rendered despite enabled=false"
          assert 'prometheusremotewrite' not in r
          # The Issuance panel follows the external URL.
          assert 'http://kube-prometheus-stack-prometheus.monitoring.svc:9090' in r
          print("✅ Scrape endpoints decoupled from the bundled Prometheus")
          EOF

      - name: Template with a split session store
        run: |
          helm template strato-session helm/strato-control-plane/ \
            -f helm/strato-control-plane/ci/session-valkey-values.yaml > /tmp/session-valkey-template.yaml
          echo "Split session-store template generated successfully"

      - name: Assert the session store renders on every workload that needs it
        run: |
          python3 - <<'EOF'
          import re

          split = open('/tmp/session-valkey-template.yaml').read()
          default = open('/tmp/default-template.yaml').read()

          # Sessions and coordination are separate Valkey-backed stores with
          # opposite failure contracts (issue #855). Four template branches carry
          # the split; each is asserted below.
          def env_of(kind):
              """Env var names on the first container spec of `kind`."""
              for doc in split.split('\n---\n'):
                  if re.search(r'^kind: %s$' % kind, doc, re.M):
                      return set(re.findall(r'^\s*- name: (SESSION_VALKEY_\w+)', doc, re.M))
              raise AssertionError("no %s rendered" % kind)

          expected = {'SESSION_VALKEY_HOST', 'SESSION_VALKEY_PORT',
                      'SESSION_VALKEY_DATABASE', 'SESSION_VALKEY_PASSWORD'}

          # 1. The serving workload receives the distinct session endpoint.
          missing = expected - env_of('Deployment')
          assert not missing, "Deployment is missing %s" % sorted(missing)

          # 3. The password Secret the env block's secretKeyRef points at.
          assert 'session-valkey-password:' in split, "session password secret key missing"

          # 4. Egress to the session endpoint's own port. This rule lives outside
          # the NetworkPolicy's egress with/else — inside it, the chart's default
          # egress list would make it dead for every deployment that keeps the
          # default.
          netpol = [d for d in split.split('\n---\n') if re.search(r'^kind: NetworkPolicy$', d, re.M)]
          assert any('port: 6380' in d for d in netpol), "no egress rule for the session Valkey port"

          # The upgrade guarantee: a deployment that never sets sessionValkey.host
          # emits no SESSION_VALKEY_* at all, so sessions keep sharing the
          # coordination endpoint and one client.
          assert 'SESSION_VALKEY' not in default, \
              "default render leaks SESSION_VALKEY_*; sessions must default to the coordination endpoint"

          print("✅ Split session store renders on the serving workload; default render unchanged")
          EOF

      - name: Template with SPIRE enabled
        run: |
          helm template strato-spire helm/strato-control-plane/ \
            --set spire.enabled=true > /tmp/spire-template.yaml
          # Non-default persistence path: this once rendered a duplicate
          # `volumes:` key that clobbered the SPIRE server's config volume.
          helm template strato-spire-eph helm/strato-control-plane/ \
            --set spire.enabled=true \
            --set spire.persistence.enabled=false > /tmp/spire-ephemeral-template.yaml
          echo "SPIRE templates generated successfully"

      - name: Assert SPIRE ships no dev secret and auto-generates a strong one
        run: |
          # A default SPIRE install must never ship the historical hardcoded
          # password; an empty value auto-generates a strong one (spire-secret.yaml).
          # Check the SPIRE secret's value directly rather than substring-matching
          # the whole render: the token "spire_password" legitimately appears as a
          # psql variable name in spire-db-init-job.yaml (the credential itself is
          # injected via env from this secret, never inlined).
          python3 - <<'EOF'
          import base64, re, sys
          r = open('/tmp/spire-template.yaml').read()
          pw = base64.b64decode(re.search(r'database-password: "([^"]+)"', r).group(1)).decode()
          assert pw != "spire_password", "SPIRE secret ships the historical dev password"
          assert len(pw) >= 32, "generated SPIRE database password too short"
          print("✅ SPIRE database password auto-generated and strong")
          EOF

      - name: Assert the Envoy sidecar keeps hybrid post-quantum key exchange
        run: |
          # The Envoy config lives inside a ConfigMap string, so `helm lint` and
          # `helm template` cannot see into it, and the kind-install job runs with
          # SPIRE disabled — Envoy never actually starts in CI. A typo in that
          # block therefore ships silently and the sidecar then refuses to boot
          # with "Failed to initialize ECDH curves", taking the agent mTLS
          # listener down for every Kubernetes deployment. Parse the embedded
          # config as YAML and assert the group is present and preferred.
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'EOF'
          import sys, yaml
          docs = list(yaml.safe_load_all(open('/tmp/spire-template.yaml')))
          cms = [d for d in docs if d and d.get('kind') == 'ConfigMap' and 'envoy.yaml' in (d.get('data') or {})]
          assert len(cms) == 1, f"expected exactly one Envoy ConfigMap, found {len(cms)}"
          cfg = yaml.safe_load(cms[0]['data']['envoy.yaml'])
          listeners = cfg['static_resources']['listeners']
          tls = [
              fc['transport_socket']['typed_config']['common_tls_context']
              for l in listeners for fc in l['filter_chains']
              if 'transport_socket' in fc
          ]
          assert len(tls) == 1, f"expected exactly one TLS-terminating filter chain, found {len(tls)}"
          curves = tls[0]['tls_params']['ecdh_curves']
          assert curves[0] == 'X25519MLKEM768', f"hybrid PQ group is not preferred: {curves}"
          assert 'X25519' in curves, f"classical X25519 fallback missing: {curves}"
          print(f"✅ Envoy sidecar prefers hybrid post-quantum key exchange: {curves}")
          EOF

      - name: Template with Gateway API enabled
        run: |
          # Chart-owned Gateway + GatewayClass + all three routes (HTTPRoute and
          # both passthrough TLSRoutes), with cert-manager shim annotations.
          helm template strato-gw helm/strato-control-plane/ \
            --set gateway.enabled=true \
            --set gateway.create=true \
            --set gateway.gatewayClass.create=true \
            --set strato.externalHostname=strato.example.com \
            --set gateway.tls.certManager.enabled=true \
            --set gateway.tls.certManager.issuerRef.name=letsencrypt-dns \
            --set spire.enabled=true \
            --set spire.controlPlane.enableMTLS=true > /tmp/gateway-template.yaml
          # Routes-only render binding to an operator-provided Gateway.
          helm template strato-gw-bind helm/strato-control-plane/ \
            --set gateway.enabled=true \
            --set gateway.name=infra-gateway \
            --set gateway.namespace=envoy-gateway-system \
            --set strato.externalHostname=strato.example.com > /tmp/gateway-bind-template.yaml
          # create=false must NOT render a Gateway object of its own.
          if grep -qE '^kind: Gateway$' /tmp/gateway-bind-template.yaml; then
            echo "❌ gateway.create=false rendered a Gateway resource"
            exit 1
          fi
          for kind in HTTPRoute TLSRoute; do
            grep -q "kind: $kind" /tmp/gateway-template.yaml || { echo "❌ missing $kind in gateway render"; exit 1; }
          done
          echo "✅ Gateway API templates generated successfully"

      - name: Validate generated YAML
        run: |
          # Parse every document of every render and reject duplicate mapping
          # keys (YAML silently takes the last one — a duplicate `volumes:` key
          # once shipped a SPIRE server that could never start). The previous
          # incarnation of this step used safe_load (single-doc, dup-tolerant)
          # and swallowed failures with `|| echo`, so it could never fail.
          for file in /tmp/*-template.yaml; do
            python3 - "$file" <<'EOF'
          import sys, yaml

          class StrictLoader(yaml.SafeLoader):
              pass

          def no_duplicates(loader, node, deep=False):
              seen = set()
              for key_node, _ in node.value:
                  key = loader.construct_object(key_node, deep=True)
                  if key in seen:
                      raise ValueError(f"duplicate mapping key {key!r} at line {key_node.start_mark.line + 1}")
                  seen.add(key)
              return yaml.SafeLoader.construct_mapping(loader, node, deep)

          StrictLoader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, no_duplicates)
          path = sys.argv[1]
          docs = list(yaml.load_all(open(path), Loader=StrictLoader))
          print(f"✅ {path}: {len(docs)} documents, no duplicate keys")
          EOF
          done

      - name: Upload templates as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helm-templates
          path: /tmp/*-template.yaml

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scanning
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Add Bitnami repository
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Build dependencies
        run: |
          cd helm/strato-control-plane
          helm dependency build

      - name: Generate template for security scan
        run: |
          helm template strato-security helm/strato-control-plane/ \
            --set networkPolicy.enabled=true \
            --set podDisruptionBudget.enabled=true > /tmp/security-template.yaml

      - name: Install Checkov
        # Not present on GitHub-hosted runners; install it explicitly.
        run: pipx install checkov

      - name: Run Checkov security scan
        # --soft-fail keeps findings non-blocking; a missing/broken checkov
        # now surfaces instead of being silently masked by `|| true`.
        run: |
          checkov -f /tmp/security-template.yaml \
            --framework kubernetes \
            --output cli \
            --soft-fail

      - name: Check for hardcoded secrets
        run: |
          # Check for potential hardcoded secrets in templates
          # Look for patterns like 'password: "actual-password"' but exclude
          # proper template usage. (The bracket expression previously used
          # \x27, which grep treats as the literal characters \ x 2 7, not an
          # apostrophe.)
          if grep -r "password.*:.*[\"']" helm/strato-control-plane/templates/ | grep -v "secretKeyRef" | grep -v "valueFrom" | grep -v "{{" | grep -v "#"; then
            echo "⚠️  Potential hardcoded secrets found in templates!"
            exit 1
          else
            echo "✅ No hardcoded secrets found in templates"
          fi
      - name: Validate RBAC permissions
        run: |
          # Check if ServiceAccount has minimal permissions
          if helm template test helm/strato-control-plane/ | grep -A 20 -B 5 "kind: ClusterRole\|kind: Role"; then
            echo "⚠️  Found RBAC roles - please review permissions"
          else
            echo "✅ No additional RBAC permissions found"
          fi
