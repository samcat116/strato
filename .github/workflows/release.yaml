name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  actions: read

# One release at a time per tag; never cancel a mid-publish release run (a
# half-published manifest set is worse than a queued duplicate).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_CONTROL_PLANE: ${{ github.repository }}-control-plane
  IMAGE_NAME_AGENT: ${{ github.repository }}-agent
  IMAGE_NAME_FRONTEND: ${{ github.repository }}-frontend

jobs:
  # Lightweight (changelog + one API call).
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
      # "true" for alpha/beta/rc tags. Published so downstream jobs that must
      # only run for stable releases (bump-homebrew-formula) reuse the one
      # prerelease decision instead of re-deriving it from the tag.
      prerelease: ${{ steps.create_release.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # Generate changelog between tags
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)")
          fi

          # Save to file for multiline output
          echo "$CHANGELOG" > changelog.txt

          # Create release notes
          cat > release_notes.md << EOF
          ## Changes

          $CHANGELOG

          ## Docker Images

          - \`ghcr.io/${{ github.repository }}-control-plane:${GITHUB_REF#refs/tags/}\`
          - \`ghcr.io/${{ github.repository }}-frontend:${GITHUB_REF#refs/tags/}\`
          - \`ghcr.io/${{ github.repository }}-agent:${GITHUB_REF#refs/tags/}\`

          ## Installation

          ### Using Docker Compose

          \`\`\`bash
          gh release download "${GITHUB_REF#refs/tags/}" \
            --repo "${{ github.repository }}" \
            --pattern 'strato-*-compose.tar.gz'
          tar -xzf strato-*-compose.tar.gz
          cd "strato-${GITHUB_REF#refs/tags/v}-compose"
          ./setup.sh
          docker compose up -d
          \`\`\`

          The version-pinned Compose archive is the replacement for the deleted
          standalone \`docker-compose.release.yml\` and \`nginx.conf\` assets.

          ### Manual Installation

          \`\`\`bash
          # Pull the images
          docker pull ghcr.io/${{ github.repository }}-control-plane:${GITHUB_REF#refs/tags/}
          docker pull ghcr.io/${{ github.repository }}-frontend:${GITHUB_REF#refs/tags/}
          docker pull ghcr.io/${{ github.repository }}-agent:${GITHUB_REF#refs/tags/}
          \`\`\`
          EOF

      # gh replaces the archived actions/create-release@v1. The numeric
      # release id is exported for the binary jobs, which upload assets via
      # the raw REST endpoint (the swift build containers have no gh CLI).
      - name: Create Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          PRERELEASE=false
          CREATE_FLAGS=""
          # Anchored to the semver prerelease separator rather than matching the
          # words anywhere in the tag: unanchored, any tag containing "rc" —
          # v1.2.3-a<rc>h-fix — reads as a prerelease, and since STR-47 that
          # decision also silently skips the Homebrew tap bump.
          case "$TAG" in
            *-alpha*|*-beta*|*-rc*) PRERELEASE=true; CREATE_FLAGS="--prerelease" ;;
          esac
          gh release create "$TAG" --title "Release $TAG" --notes-file release_notes.md $CREATE_FLAGS
          echo "release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  # Compile the release binaries that the container images copy in, mirroring
  # main-build.yaml's prebuilt split: amd64 builds on the swift-runners-strato
  # ARC scale set (its runner image bakes in the Swift 6.3.2 toolchain, so the
  # build runs directly on the pod — no dind, no toolchain install); arm64 runs
  # on the GitHub-hosted ubuntu-24.04-arm runner but INSIDE the swift:6.3.2-noble
  # container (not the runner's newer preinstalled Swift). Both must be 6.3.2:
  # the Dockerfiles copy the Swift runtime .so files into the final images from
  # swift:6.3.2-noble, so a binary linked against a different Swift (the hosted
  # arm64 runner ships 6.3.3) would run against 6.3.2 runtime libs — and Swift on
  # Linux has no stable-ABI guarantee across versions. Pinning the container
  # keeps build and runtime lockstep. build-image-digests below just copies
  # these binaries, so the Docker steps stay light on GitHub-hosted runners.
  #
  # No build cache is configured here: releases are infrequent tag pushes where
  # a cold compile is acceptable, and main-build.yaml deliberately keeps the
  # repo under GitHub's 10GB actions/cache budget — a per-release Swift .build
  # cache would evict the caches main builds depend on. (`build-swift-binaries`
  # below still produces the statically-linked release-asset tarballs; those
  # are separate from these jemalloc-linked binaries.)
  build-swift-release:
    name: Build Swift Release (${{ matrix.arch }})
    needs: create-release
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'swift-runners-strato' }}
    # arm64 pins the Swift toolchain to the container the Dockerfiles source
    # runtime libs from; amd64's ARC runner image already bakes in 6.3.2, so it
    # runs container-less on the pod (empty string = no job container).
    container: ${{ matrix.arch == 'arm64' && 'swift:6.3.2-noble' || '' }}
    # Backstop for a hung build: the default 360-minute timeout would pin an
    # ARC pool slot (amd64) for six hours. Release builds run cold by design,
    # so allow well over the ~30-minute worst case.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # libjemalloc-dev: the control-plane binary links -ljemalloc.
      # unzip: setup-bun needs it to extract its download.
      # The ARC pod runs as a non-root user with passwordless sudo; guard in
      # case a runner has no sudo binary.
      - name: Install build dependencies
        run: |
          SUDO=""
          command -v sudo >/dev/null && SUDO=sudo
          $SUDO apt-get update
          $SUDO apt-get install -y libjemalloc-dev unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: control-plane/web
        run: bun install --frozen-lockfile

      - name: Build and deploy frontend
        working-directory: control-plane/web
        run: bun run build:deploy

      - name: Build Control Plane Release Binary
        working-directory: control-plane
        run: |
          swift build -c release --product App -Xlinker -ljemalloc
          BIN="$(swift build -c release --show-bin-path)"
          # Create artifact directory structure
          mkdir -p ../artifacts/control-plane/bin
          mkdir -p ../artifacts/control-plane/resources
          # Copy binary
          cp "$BIN/App" ../artifacts/control-plane/bin/
          # Copy swift-backtrace (try multiple possible locations)
          if [ -f "/usr/lib/swift/linux/swift-backtrace-static" ]; then
            cp "/usr/lib/swift/linux/swift-backtrace-static" ../artifacts/control-plane/bin/
          elif [ -f "/usr/libexec/swift/linux/swift-backtrace-static" ]; then
            cp "/usr/libexec/swift/linux/swift-backtrace-static" ../artifacts/control-plane/bin/
          else
            echo "Warning: swift-backtrace-static not found, skipping"
          fi
          # Copy resources
          find -L "$BIN/" -regex '.*\.resources$' -exec cp -Ra {} ../artifacts/control-plane/resources/ \; || true
          # Copy application resources
          [ -d Resources ] && cp -R Resources ../artifacts/control-plane/ || true

      - name: Build Agent Release Binary
        working-directory: agent
        run: |
          swift build -c release --product StratoAgent -Xlinker -ljemalloc
          BIN="$(swift build -c release --show-bin-path)"
          mkdir -p ../artifacts/agent/bin
          mkdir -p ../artifacts/agent/resources
          cp "$BIN/StratoAgent" ../artifacts/agent/bin/
          # Copy swift-backtrace (try multiple possible locations)
          if [ -f "/usr/lib/swift/linux/swift-backtrace-static" ]; then
            cp "/usr/lib/swift/linux/swift-backtrace-static" ../artifacts/agent/bin/
          elif [ -f "/usr/libexec/swift/linux/swift-backtrace-static" ]; then
            cp "/usr/libexec/swift/linux/swift-backtrace-static" ../artifacts/agent/bin/
          else
            echo "Warning: swift-backtrace-static not found, skipping"
          fi
          # Copy resources
          find -L "$BIN/" -regex '.*\.resources$' -exec cp -Ra {} ../artifacts/agent/resources/ \; || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swift-binaries-${{ matrix.arch }}
          path: artifacts/
          retention-days: 1

  # Phase 1 — assemble each image on a GitHub-hosted runner (amd64 on
  # ubuntu-latest, arm64 on ubuntu-24.04-arm) from the prebuilt binaries above,
  # and push each arch by DIGEST ONLY (no tag). The Swift images just copy a
  # binary (nothing compiles in-Docker), so these stay lightweight. Publishing
  # the semver-tagged manifests happens in phase 2, so nothing here is
  # consumable yet: an untagged digest is invisible to taggers until
  # publish-manifests stitches the per-arch digests into a multi-arch manifest
  # list.
  #
  # Phase 1 is two jobs, mirroring main-build.yaml: the Swift images below wait
  # on the release binaries, while the frontend (which consumes no Swift
  # artifacts) builds in its own job immediately, overlapping the Swift
  # compile. The publish barrier still needs both.
  #
  # `provenance: false` suppresses buildx's default SBOM/provenance attestation,
  # which was pushed as an `unknown/unknown` manifest and showed up as a bogus
  # architecture on the GHCR package page.
  build-image-digests:
    name: Build Digest (${{ matrix.image }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: build-swift-release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: control-plane, arch: amd64, context: ., file: ./control-plane/Dockerfile, prebuilt: artifacts/control-plane }
          - { image: control-plane, arch: arm64, context: ., file: ./control-plane/Dockerfile, prebuilt: artifacts/control-plane }
          - { image: agent, arch: amd64, context: ., file: ./agent/Dockerfile, prebuilt: artifacts/agent }
          - { image: agent, arch: arm64, context: ., file: ./agent/Dockerfile, prebuilt: artifacts/agent }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No continue-on-error here: with PREBUILT_ARTIFACTS set, the Dockerfile
      # hard-fails on missing artifacts anyway ("no artifacts found"), so
      # tolerating a failed download only moves the error somewhere confusing.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: swift-binaries-${{ matrix.arch }}
          path: artifacts/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only descriptive OCI labels are attached here; the release tags
      # (type=ref + the three semver patterns) are applied in phase 2 by
      # imagetools, which stamps them onto the merged manifest list.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }}

      # No gha cache for these images: they just copy a prebuilt binary, so
      # their layers are cheap to rebuild and a cache would only add churn
      # against the 10GB repo budget (see main-build.yaml).
      #
      # build-args: both images get PREBUILT_ARTIFACTS and bake the release
      # tag as build identity (STRATO_VERSION/STRATO_GIT_SHA) — surfaced on
      # /health/* by the control-plane, reported in registration and
      # `--version` by the agent.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PREBUILT_ARTIFACTS=${{ matrix.prebuilt }}
            STRATO_VERSION=${{ github.ref_name }}
            STRATO_GIT_SHA=${{ github.sha }}

      # Hand the digest to the publish job via an artifact. The filename is the
      # digest hex (the `sha256:` prefix is stripped — colons are fragile in
      # artifact paths); contents are irrelevant.
      - name: Export digest
        run: |
          mkdir -p /tmp/digest
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digest/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digest/*
          retention-days: 1
          if-no-files-found: error

  # Frontend digests — independent of the Swift binaries; starts immediately.
  # cache-from maps to the registry cache main-build writes (frontend-x64 /
  # frontend-arm64 — main-build names the amd64 arch "x64"). No cache-to: a
  # release builds the same source main already cached, so writing would only
  # overwrite a warm cache with an identical one.
  build-frontend-digest:
    name: Build Digest (frontend, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-frontend

      # The frontend bakes the release tag into the client bundle (the sidebar
      # version label) — same build-identity rationale as the control-plane.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./control-plane/web
          file: ./control-plane/web/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }}-frontend,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}-frontend:buildcache-${{ matrix.arch == 'amd64' && 'x64' || matrix.arch }}
          build-args: |
            STRATO_VERSION=${{ github.ref_name }}
            STRATO_GIT_SHA=${{ github.sha }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digest
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digest/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-frontend-${{ matrix.arch }}
          path: /tmp/digest/*
          retention-days: 1
          if-no-files-found: error

  # Phase 2 — publish barrier. Needing both phase-1 jobs succeeds only if
  # EVERY leg (all images, both arches) passed, so we never publish a tag for a
  # release whose full image set wasn't built. The multi-arch manifests — and
  # every semver tag — are created here and only here, so the phase-1 digests
  # stay invisible until this runs. Tag creation runs as ordered steps
  # (control-plane → agent → frontend). Each image is re-run through
  # docker/metadata-action to reproduce the same tag set (type=ref plus the
  # three semver patterns) that phase 1 deliberately did NOT apply.
  publish-manifests:
    name: Publish Multi-Arch Manifests
    needs: [build-image-digests, build-frontend-digest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*

      - name: Extract metadata for control plane image
        id: meta-control-plane
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CONTROL_PLANE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Extract metadata for agent image
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_AGENT }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Extract metadata for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # `imagetools create` builds a fresh manifest list from the per-arch
      # digests and pushes it under every tag metadata-action computed. Ordered
      # control-plane → agent → frontend: a failed step stops the job before the
      # next, and the frontend — which shares a version with the control-plane
      # in the compose deployment — publishes last. The `docker/metadata-action`
      # `tags` output is newline-separated fully-qualified refs; turn each into
      # a `-t` flag.
      - name: Publish control-plane manifest
        env:
          META_TAGS: ${{ steps.meta-control-plane.outputs.tags }}
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CONTROL_PLANE }}"
          TAG_ARGS=""
          while IFS= read -r t; do
            [ -n "$t" ] && TAG_ARGS="$TAG_ARGS -t $t"
          done <<< "$META_TAGS"
          DIGESTS=$(for f in /tmp/digests/digest-control-plane-*/*; do printf '%s@sha256:%s ' "$REF" "$(basename "$f")"; done)
          docker buildx imagetools create $TAG_ARGS $DIGESTS
          docker buildx imagetools inspect "${REF}:${GITHUB_REF#refs/tags/}"

      - name: Publish agent manifest
        env:
          META_TAGS: ${{ steps.meta-agent.outputs.tags }}
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_AGENT }}"
          TAG_ARGS=""
          while IFS= read -r t; do
            [ -n "$t" ] && TAG_ARGS="$TAG_ARGS -t $t"
          done <<< "$META_TAGS"
          DIGESTS=$(for f in /tmp/digests/digest-agent-*/*; do printf '%s@sha256:%s ' "$REF" "$(basename "$f")"; done)
          docker buildx imagetools create $TAG_ARGS $DIGESTS
          docker buildx imagetools inspect "${REF}:${GITHUB_REF#refs/tags/}"

      - name: Publish frontend manifest
        env:
          META_TAGS: ${{ steps.meta-frontend.outputs.tags }}
        run: |
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}"
          TAG_ARGS=""
          while IFS= read -r t; do
            [ -n "$t" ] && TAG_ARGS="$TAG_ARGS -t $t"
          done <<< "$META_TAGS"
          DIGESTS=$(for f in /tmp/digests/digest-frontend-*/*; do printf '%s@sha256:%s ' "$REF" "$(basename "$f")"; done)
          docker buildx imagetools create $TAG_ARGS $DIGESTS
          docker buildx imagetools inspect "${REF}:${GITHUB_REF#refs/tags/}"

  build-swift-binaries:
    runs-on: ${{ matrix.os }}
    needs: create-release
    # Both Linux legs pin the Swift toolchain via the swift:6.3.2-noble
    # container (the hosted runners' preinstalled Swift is newer); macOS runs
    # container-less (empty string = no job container).
    container: ${{ matrix.container || '' }}
    # Backstop for a hung cold build (default would be 360 minutes).
    timeout-minutes: 90
    strategy:
      # The three legs produce independent release assets; letting one leg's
      # failure cancel the others just means a rerun rebuilds everything
      # instead of the one leg that failed.
      fail-fast: false
      matrix:
        include:
          # Both Linux legs build on GitHub-hosted runners inside the pinned
          # swift:6.3.2-noble container: the same compiler everywhere, with no
          # dependence on any host's swiftly state (a stale in-use 6.2.1
          # toolchain on the old static self-hosted runner is what failed the
          # v0.1.0 release — its release-mode compiler crashes on FluentKit).
          # --static-swift-stdlib makes the container choice irrelevant at
          # runtime, so the pin is about identical language/compiler behavior,
          # not ABI lockstep.
          - os: ubuntu-24.04
            asset_name: strato-linux-x86_64
            container: swift:6.3.2-noble
          # linux-arm64 (issue #431): install.sh derives strato-linux-arm64
          # from uname on aarch64 hosts, so this asset must exist.
          - os: ubuntu-24.04-arm
            asset_name: strato-linux-arm64
            container: swift:6.3.2-noble
          # macos-latest runners are Apple Silicon (arm64) — this asset was
          # previously mislabeled strato-macos-x86_64. The macOS leg builds
          # with the runner's Xcode toolchain rather than the 6.3.2 pin used
          # everywhere else: that drift is intentional (the pinned 6.3.2
          # toolchain cannot compile the agent's NIOEmbedded dependency on
          # macOS; newer Xcode Swift can), and these standalone binaries link
          # the OS-provided runtime, so there is no lockstep requirement with
          # the swift:6.3.2-noble image runtimes.
          - os: macos-latest
            asset_name: strato-macos-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The asset upload below is raw curl; make sure the container has it
      # (the macOS leg always does).
      - name: Install container dependencies
        if: matrix.container
        run: |
          command -v curl >/dev/null || { apt-get update && apt-get install -y curl; }

      # The tarball binaries run outside any container image, so the image-env
      # STRATO_VERSION/STRATO_GIT_SHA injection can't reach them. Compile the
      # release identity into the agent binary instead by overwriting the
      # checked-in CompiledBuildInfo stub (nil in git → "dev" fallback).
      - name: Bake agent build identity
        run: |
          cat > agent/Sources/StratoAgent/CompiledBuildInfo.swift <<EOF
          // Generated by release.yaml for the release-tarball build; the
          // checked-in stub carries nil values.
          enum CompiledBuildInfo {
              static let version: String? = "${GITHUB_REF_NAME}"
              static let gitSHA: String? = "${GITHUB_SHA}"
          }
          EOF

      # Same treatment for the CLI so `strato --version` reports the release.
      - name: Bake CLI build identity
        run: |
          cat > cli/Sources/StratoCLI/CompiledBuildInfo.swift <<EOF
          // Generated by release.yaml for the release-tarball build; the
          // checked-in stub carries nil values.
          enum CompiledBuildInfo {
              static let version: String? = "${GITHUB_REF_NAME}"
              static let gitSHA: String? = "${GITHUB_SHA}"
          }
          EOF

      - name: Build Swift binaries
        run: |
          # On Linux, statically link the Swift stdlib so the release binaries
          # run on hosts without a Swift toolchain (the install.sh flow drops
          # them onto bare hypervisors). macOS links the OS-provided runtime,
          # where the flag does not apply.
          STATIC=""
          case "${{ matrix.asset_name }}" in
            strato-linux-*) STATIC="--static-swift-stdlib" ;;
          esac

          # Each build names its product, matching the other release-mode build
          # sites (control-plane/Dockerfile, agent/Dockerfile, main-build.yaml,
          # and the container job above). Without it SwiftPM builds every
          # non-test target in the root package, including ones that belong to
          # no product — and control-plane's AppTestSupport is exactly that: a
          # plain library target holding the test fixtures, which `@testable
          # import`s App. Testability is only enabled in debug, so an unscoped
          # release build fails on it with "module 'App' was not compiled for
          # testing". Nothing else catches this: PR CI only ever builds debug,
          # and this job runs on tags.
          #
          # Build control plane
          cd control-plane
          swift build -c release --product App $STATIC
          cd ..

          # Build agent
          cd agent
          swift build -c release --product StratoAgent $STATIC
          cd ..

          # Build CLI
          cd cli
          swift build -c release --product strato $STATIC
          cd ..

      - name: Package binaries
        run: |
          mkdir -p release
          cp control-plane/.build/release/App release/strato-control-plane
          cp agent/.build/release/StratoAgent release/strato-agent
          cp cli/.build/release/strato release/strato

          # Strip before archiving (STR-153). A release build keeps its debug
          # info inside the binary, and it dominates the asset: the CLI alone
          # measures 139.5 MB -> 78.3 MB on linux-arm64 (35.5 -> 25.9 MiB
          # gzipped on its own) and 41.1 MB -> 11.8 MB on macos-arm64 (7.2 ->
          # 3.7 MiB). Full strip rather than `--strip-debug`, which would keep
          # .symtab: that leaves 4.4 MiB gzipped on the table for the CLI
          # alone, and nothing here consumes the symbols. install.sh's systemd
          # unit sets no SWIFT_BACKTRACE, so the Swift backtracer stays at its
          # enable=tty default and never symbolicates anything into the
          # journal, and no crash reporter ships backtraces off the node. The
          # container images DO enable the backtracer with images=all, but
          # they are built from their own binaries in the jobs above — which
          # this step does not touch — so they keep full symbols.
          command -v strip >/dev/null 2>&1 || { echo "strip not found on this runner" >&2; exit 1; }
          for f in release/strato-control-plane release/strato-agent release/strato; do
            before=$(wc -c < "$f")
            strip "$f"
            # Measured before the macOS re-sign below, so the numbers report
            # the strip itself rather than strip minus a few KB of signature.
            after=$(wc -c < "$f")
            case "${{ matrix.asset_name }}" in
              strato-macos-*)
                # strip rewrites the Mach-O, and an Apple Silicon binary whose
                # signature no longer matches its contents is SIGKILLed on
                # exec. Current cctools strip re-signs on its own, but that is
                # toolchain behavior on a runner image we don't pin; re-sign
                # ad hoc unconditionally, which is what the linker gave these
                # binaries in the first place (no Developer ID, no notarizing).
                codesign --force --sign - "$f"
                ;;
            esac
            echo "stripped ${f##*/}: ${before} -> ${after} bytes"
          done
          # Smoke-test the two binaries whose --version short-circuits in
          # ArgumentParser before any config or service handling, so a strip
          # that broke an executable — or, on macOS, its signature — fails the
          # release here rather than on someone's node. The agent is the one
          # that matters: its self-update probes a staged binary with
          # --version before swapping it in, but install.sh executes nothing
          # before starting the unit, so a fresh install has no other guard.
          # Not strato-control-plane: the Vapor executable falls through to
          # `serve` and would go looking for Postgres.
          release/strato-agent --version
          release/strato --version

          # Checksum for install.sh (and the agent update flow) to verify the
          # download. Written with a bare filename, since install.sh verifies
          # with `cd <dir> && sha256sum -c <asset>.sha256`.
          checksum() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" > "$1.sha256"
            else
              shasum -a 256 "$1" > "$1.sha256"
            fi
          }

          tar czf ${{ matrix.asset_name }}.tar.gz -C release strato-control-plane strato-agent strato
          checksum ${{ matrix.asset_name }}.tar.gz

          # CLI-only asset alongside the bundle (STR-45), for distribution
          # channels that install onto a laptop — the Homebrew tap, `curl | sh`,
          # a manual download — where dropping a Vapor server and a hypervisor
          # node agent next to the CLI is wrong. Same stripped `strato` binary
          # as the bundle; this is packaging only. The bundle keeps its name and
          # contents because publish-agent-manifest and the agent self-update
          # path depend on them.
          #
          # Derived from asset_name rather than carried as a second matrix field
          # so the two names cannot drift: strato-linux-arm64 ->
          # strato-cli-linux-arm64.
          ASSET_NAME="${{ matrix.asset_name }}"
          CLI_ASSET="strato-cli-${ASSET_NAME#strato-}"
          tar czf "${CLI_ASSET}.tar.gz" -C release strato
          checksum "${CLI_ASSET}.tar.gz"

      # Raw REST upload rather than `gh release upload`: the swift build
      # containers have no gh CLI, and curl exists everywhere. This
      # also replaces the archived actions/upload-release-asset@v1.
      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          # Recomputed from the matrix rather than handed over from the
          # packaging step: it is a pure function of asset_name, and every
          # other name in this job is likewise read straight off the matrix.
          # One formula, no cross-step channel to get out of sync.
          ASSET_NAME="${{ matrix.asset_name }}"
          CLI_ASSET="strato-cli-${ASSET_NAME#strato-}"
          for f in "${{ matrix.asset_name }}.tar.gz" "${{ matrix.asset_name }}.tar.gz.sha256" \
                   "${CLI_ASSET}.tar.gz" "${CLI_ASSET}.tar.gz.sha256"; do
            case "$f" in
              *.sha256) ct="text/plain" ;;
              *) ct="application/gzip" ;;
            esac
            curl -sSf -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: $ct" \
              --data-binary "@$f" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${f}" >/dev/null
            echo "Uploaded $f"
          done

  # Machine-readable pointer to this release's binaries: version, git SHA, and
  # per-platform tarball URL/checksum/size (issue #431). The control plane
  # consumes it — via the stable
  # releases/latest/download/agent-manifest.json URL — to learn the newest
  # agent version and hand each agent a download for its platform; the
  # update flow verifies the sha256 before swapping binaries. Publishing
  # happens only after EVERY tarball leg succeeded, so the manifest never
  # references an asset that failed to upload. Checksums come from the
  # .sha256 sidecars the build legs already computed — no need to re-download
  # the tarballs themselves here.
  publish-agent-manifest:
    runs-on: ubuntu-latest
    needs: build-swift-binaries
    env:
      # Combined bundle tarballs only. What keeps the CLI-only assets
      # (strato-cli-<os>-<arch>.tar.gz, STR-45) out of the manifest — and out
      # of agents' update path — is the `(linux|macos)` alternation anchored
      # directly after `strato-`: `cli` is not an os, so those names never
      # match and can never be parsed as os=cli. The arch alternation is
      # likewise spelled out rather than left as a `[a-z0-9_]+` class, pinning
      # the pattern to the platform vocabulary install.sh derives from `uname`.
      # Narrowing that class trades a false positive for a false negative — an
      # arch outside the pair would upload fine and just never reach the
      # manifest — so it is only safe because the build step below asserts the
      # complement: any bundle-shaped asset this pattern does not select fails
      # the release. Adding a matrix leg without updating the pattern is
      # therefore loud, not silent. Also excludes the
      # strato-<version>-source.tar.gz archive.
      BUNDLE_ASSET_PATTERN: '^strato-(linux|macos)-(x86_64|arm64)\.tar\.gz$'
    steps:
      # Pin the selection down against a fixture rather than trusting the
      # pattern by inspection: this is the one place a newly added release
      # asset could quietly land in the manifest and be handed to agents as an
      # update. Runs before the manifest build so a regression fails cheaply.
      #
      # Two limits worth knowing before editing the pattern. This step runs it
      # under the runner's jq (Oniguruma); the manifest build runs the same
      # string under `gh api --jq`, which is gojq on Go's regexp — identical
      # for anchors, alternation, and escaped literals, divergent for lookahead
      # and backreferences, so keep the pattern in the common subset. And the
      # fixture is a hand-maintained literal, so it only catches a pattern that
      # stopped matching these names; a genuinely new asset name is caught by
      # the complement assertion against the live release below.
      - name: Verify the asset pattern selects bundles only
        run: |
          selected="$(jq -rn '
            ["strato-linux-x86_64.tar.gz",
             "strato-linux-arm64.tar.gz",
             "strato-macos-arm64.tar.gz",
             "strato-cli-linux-x86_64.tar.gz",
             "strato-cli-linux-arm64.tar.gz",
             "strato-cli-macos-arm64.tar.gz",
             "strato-1.2.3-source.tar.gz",
             "strato-1.2.3-compose.tar.gz",
             "agent-manifest.json",
             "install.sh"]
            | map(select(test($ENV.BUNDLE_ASSET_PATTERN))) | join(" ")')"
          expected="strato-linux-x86_64.tar.gz strato-linux-arm64.tar.gz strato-macos-arm64.tar.gz"
          [ "$selected" = "$expected" ] || {
            echo "asset pattern regressed: selected [$selected], want [$expected]" >&2
            exit 1
          }

      - name: Build and upload agent-manifest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh gets its repo context from the env.
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"

          # Combined bundle tarballs only (strato-<os>-<arch>.tar.gz); see
          # BUNDLE_ASSET_PATTERN above for what the pattern keeps out.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[]
                  | select(.name | test($ENV.BUNDLE_ASSET_PATTERN))
                  | [.name, .browser_download_url, (.size | tostring)] | @tsv' \
            > assets.tsv
          [ -s assets.tsv ] || { echo "no strato-<os>-<arch>.tar.gz assets on $TAG" >&2; exit 1; }

          # Non-emptiness only proves *some* bundle matched, which every
          # interesting regression survives: a matrix leg added without
          # updating BUNDLE_ASSET_PATTERN, a leg that uploaded under an
          # unexpected name, a partial upload. Assert the complement too — a
          # strato-*.tar.gz asset the pattern did not select is a pattern that
          # fell behind the build matrix, not an asset to skip silently. The
          # deliberate non-bundles are subtracted by name: the CLI-only assets
          # (STR-45), source archive, and canonical Compose deployment archive.
          # Checked against the live release rather than a fixture, so it needs
          # no maintenance when a leg is added — it just fails until the
          # pattern catches up.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[].name
                  | select(startswith("strato-") and endswith(".tar.gz"))
                  | select(test($ENV.BUNDLE_ASSET_PATTERN) | not)
                  | select((startswith("strato-cli-")
                            or test("-(source|compose)\\.tar\\.gz$")) | not)' \
            > unmatched.txt
          if [ -s unmatched.txt ]; then
            echo "bundle-shaped assets missing from the manifest: $(tr '\n' ' ' < unmatched.txt)" >&2
            echo "update BUNDLE_ASSET_PATTERN (and the fixture above) to cover them" >&2
            exit 1
          fi

          # Pulls the strato-cli-* sidecars too; harmless, since each entry
          # below reads the one sidecar named for its asset.
          mkdir sidecars
          gh release download "$TAG" --pattern 'strato-*.tar.gz.sha256' --dir sidecars

          entries="[]"
          while IFS=$'\t' read -r name url size; do
            platform="${name#strato-}"; platform="${platform%.tar.gz}"
            os="${platform%%-*}"; arch="${platform#*-}"
            sha256="$(awk '{print $1}' "sidecars/${name}.sha256")"
            [ -n "$sha256" ] || { echo "missing checksum sidecar for $name" >&2; exit 1; }
            entries="$(jq --arg os "$os" --arg arch "$arch" --arg name "$name" \
                          --arg url "$url" --arg sha "$sha256" --argjson size "$size" \
              '. + [{os: $os, arch: $arch, asset: $name, url: $url, sha256: $sha,
                     size: $size, agentBinaryPath: "strato-agent"}]' <<< "$entries")"
          done < assets.tsv

          jq -n --arg version "$TAG" --arg sha "$GITHUB_SHA" --argjson assets "$entries" \
            '{schemaVersion: 1, version: $version, gitSHA: $sha, assets: $assets}' \
            > agent-manifest.json
          cat agent-manifest.json
          # --clobber so a re-run of this job replaces the manifest instead of
          # failing on the existing asset.
          gh release upload "$TAG" agent-manifest.json --clobber

  # Point the Homebrew tap at this release (STR-47). The tap is its own repo —
  # a formula's `url` only cares which release produced the asset, not which
  # repo the source lives in — so the CLI stays in this monorepo.
  #
  # `needs: build-swift-binaries` is the correctness gate: that job succeeds
  # only after EVERY leg uploaded its tarball and sidecar, so the formula can
  # never point at an asset that failed to upload. Only the CLI-only assets
  # (strato-cli-<os>-<arch>.tar.gz, STR-45) are referenced — a `brew install`
  # onto a laptop has no use for a Vapor server and a node agent.
  #
  # Requires a HOMEBREW_TAP_TOKEN secret: GITHUB_TOKEN is scoped to this
  # repository and cannot write to stratocloud/homebrew-strato. Use a
  # fine-grained PAT limited to that one repo with Contents: read and write.
  bump-homebrew-formula:
    name: Bump Homebrew Formula
    # macos-latest, not ubuntu-latest: GitHub removed Homebrew from the
    # ubuntu-24.04 runner image, so the smoke test below has no `brew` on
    # Linux (this job's first-ever run, v0.1.1, failed exactly there). macOS
    # runners ship brew preinstalled, and the smoke test then exercises the
    # macos-arm64 leg — the asset most brew users install. Everything else in
    # the job (gh, git, sed/awk/ruby in the scripts) is on the macOS image
    # too, and both scripts are written to stay Mac-runnable.
    runs-on: macos-latest
    needs: [create-release, build-swift-binaries]
    # Prereleases keep the tap on the last stable version: `brew install`
    # should never hand someone an rc. Reuses create-release's decision rather
    # than re-matching the tag here, so the two cannot disagree.
    if: needs.create-release.outputs.prerelease != 'true'
    # Everything this job writes goes through TAP_TOKEN; GITHUB_TOKEN is only
    # used to read this release's sidecars.
    permissions:
      contents: read
    env:
      TAP_REPO: stratocloud/homebrew-strato
    steps:
      # Fail before touching the release rather than half-way through: a
      # missing/expired token is a repo-settings problem, and skipping quietly
      # would leave the tap silently pinned to an older version.
      - name: Require the tap token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          [ -n "$TAP_TOKEN" ] || {
            echo "HOMEBREW_TAP_TOKEN is not set." >&2
            echo "Create a fine-grained PAT with Contents: read and write on ${TAP_REPO}" >&2
            echo "and store it as the HOMEBREW_TAP_TOKEN repository secret." >&2
            exit 1
          }

      - name: Checkout code
        uses: actions/checkout@v4

      # Checksums come from the sidecars the build legs already computed, same
      # as publish-agent-manifest — no need to re-download the tarballs to
      # hash them.
      - name: Download CLI checksum sidecars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir sidecars
          gh release download "$GITHUB_REF_NAME" \
            --pattern 'strato-cli-*.tar.gz.sha256' --dir sidecars

      # The template carries the whole formula (see .github/homebrew/); the
      # script only fills in the per-release urls and checksums. Same script
      # build.yaml runs on PRs that touch the template, so what is validated
      # pre-merge is what runs here.
      - name: Render the formula
        run: |
          .github/scripts/render-homebrew-formula.sh \
            "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" sidecars strato.rb
          cat strato.rb

      # Every leg's url<->sha pairing, against the bytes GitHub actually serves
      # — a checksum/asset mismatch is precisely the failure this job can
      # introduce, and the smoke test below can only install the runner's own
      # leg. Same script build.yaml runs on PRs. See it for why it re-reads the
      # sha out of the rendered formula rather than the sidecar.
      - name: Verify every leg against the release
        run: |
          .github/scripts/verify-homebrew-assets.sh \
            strato.rb "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"

      # Install and test the rendered formula before publishing it. The step
      # above proves every leg's checksum; this one proves the formula installs
      # and the binary runs. Same script build.yaml runs on PRs.
      #
      # Runs BEFORE the push, so the job fails closed: a bad formula never
      # reaches the tap.
      - name: Smoke-test the formula
        run: |
          .github/scripts/smoke-test-homebrew-formula.sh \
            strato.rb "$TAP_REPO" "$GITHUB_REF_NAME"

      # The script owns the clone/guard/commit/push and its retries; see it for
      # the two no-op outcomes (re-run, backport) it treats as success.
      - name: Push the formula to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          .github/scripts/push-homebrew-formula.sh \
            "$TAP_REPO" strato.rb "${GITHUB_REF_NAME#v}" \
            "${GITHUB_REPOSITORY}@${GITHUB_SHA}"

  # Lightweight (git archives + uploads). Everything is staged
  # first and uploaded in a single `gh release upload` at the end.
  upload-source-assets:
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The archive filename must match the upload below exactly — an earlier
      # version of this workflow created `strato-1.2.3-source.tar.gz` but tried
      # to upload `strato-v1.2.3-source.tar.gz` (github.ref_name keeps the v).
      - name: Create source archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="strato-${VERSION}/" HEAD > "strato-${VERSION}-source.tar.gz"
          git archive --format=zip --prefix="strato-${VERSION}/" HEAD > "strato-${VERSION}-source.zip"

      # Package the supported single-host deployment as one coherent unit. The
      # release copy defaults every Strato image to this immutable tag while
      # retaining STRATO_VERSION as an explicit operator override.
      - name: Create and validate Compose deployment archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIRECTORY="strato-${VERSION}-compose"
          git archive --format=tar --prefix="${DIRECTORY}/" HEAD:deploy/compose | tar -xf -

          # The Compose interpolation defaults and both ways of creating .env
          # must select the images built by this tagged workflow.
          sed -i "s/STRATO_VERSION:-main/STRATO_VERSION:-${GITHUB_REF_NAME}/g" \
            "${DIRECTORY}/docker-compose.yml"
          sed -i "s/^STRATO_VERSION=main$/STRATO_VERSION=${GITHUB_REF_NAME}/" \
            "${DIRECTORY}/.env.example" "${DIRECTORY}/setup.sh"

          (cd "${DIRECTORY}" && ./setup.sh)
          docker compose -f "${DIRECTORY}/docker-compose.yml" \
            --env-file "${DIRECTORY}/.env" config --quiet
          rm "${DIRECTORY}/.env"
          tar -czf "strato-${VERSION}-compose.tar.gz" "${DIRECTORY}"

      # Asset names are the file basenames (deploy/agent/install.sh uploads
      # as install.sh, which is what the docs point users at).
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" \
            "strato-${VERSION}-source.tar.gz" \
            "strato-${VERSION}-source.zip" \
            "strato-${VERSION}-compose.tar.gz" \
            deploy/agent/install.sh
