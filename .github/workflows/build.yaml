name: PR Validation

# PRs are a COMPILE CHECK ONLY — nothing here runs `swift test`, and the test
# targets are not even built (no `--build-tests`). The project has no customers
# and no deployments yet, so PR turnaround was traded for that safety
# deliberately: the control-plane suite alone was 342s of a 530s job, and its
# test targets dominated the remaining compile. Running the suite before you
# merge is a human responsibility now — see CLAUDE.md.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read
  pull-requests: read # dorny/paths-filter reads changed files via the PR API

# Cancel any in-progress run for the same PR when a new commit is pushed,
# so stale runs don't tie up Swift runner capacity.
concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which parts of the repo changed so we can skip heavy jobs on
  # e.g. docs-only PRs. Jobs are gated with `if:` (not workflow-level
  # `on.paths`) so a skipped job still reports as a passing check — this
  # keeps them safe to use as required status checks in branch protection.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      cp_backend: ${{ steps.filter.outputs.cp_backend }}
      agent: ${{ steps.filter.outputs.agent }}
      shared: ${{ steps.filter.outputs.shared }}
      cli: ${{ steps.filter.outputs.cli }}
      api_client: ${{ steps.filter.outputs.api_client }}
      openapi_spec: ${{ steps.filter.outputs.openapi_spec }}
      firecracker: ${{ steps.filter.outputs.firecracker }}
      install_script: ${{ steps.filter.outputs.install_script }}
      compose_scripts: ${{ steps.filter.outputs.compose_scripts }}
      homebrew: ${{ steps.filter.outputs.homebrew }}
      workflow: ${{ steps.filter.outputs.workflow }}
      ci_scripts: ${{ steps.filter.outputs.ci_scripts }}
      docker_web: ${{ steps.filter.outputs.docker_web }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `every`: a changed file matches a filter only if it matches ALL of
          # that filter's patterns, which is what makes the `!` exclusions
          # actually take effect. (With the default `some`, a file matching any
          # single positive pattern matches the filter and negations are
          # ignored — so `!control-plane/web/**` would be a no-op.) OR across
          # directories is therefore expressed in each job's `if:` rather than
          # inside a single filter.
          predicate-quantifier: "every"
          filters: |
            web:
              - 'control-plane/web/**'
            cp_backend:
              - 'control-plane/**'
              - '!control-plane/web/**'
            agent:
              - 'agent/**'
            shared:
              - 'shared/**'
            cli:
              - 'cli/**'
            # The generated Swift client tracks the spec, which lives in the
            # control plane — a spec-only change still has to rebuild it.
            api_client:
              - 'clients/swift/**'
            # The spec on its own. Consumers of the generated client (the CLI,
            # issue #779) need to rebuild when it changes, but not for every
            # unrelated control-plane source edit that `cp_backend` matches.
            openapi_spec:
              - 'control-plane/Sources/App/openapi.yaml'
            firecracker:
              - 'SwiftFirecracker/**'
            # The node install script and its shell-level tests.
            install_script:
              - 'deploy/agent/**'
            # The compose-side E2E setup scripts, linted by the same job as
            # install.sh. A separate filter, not a second pattern under
            # `install_script`: with `predicate-quantifier: every` a file has to
            # match ALL of a filter's patterns, and nothing is under both
            # deploy/agent/ and deploy/compose/ — so pairing them made the
            # filter unmatchable rather than broader, silently skipping the job
            # for every PR that only touched a script. Same trap `ci_scripts`
            # documents below. OR across the two lives in the job's `if:`.
            # `**/*.sh` rather than `*.sh` so deploy/compose/tests/ counts too,
            # and still a single pattern because of the `every` trap above. Kept
            # to .sh instead of borrowing `deploy/agent/**`'s shape: this
            # directory is mostly compose files, nginx.conf and spiffe/ config,
            # none of which this job looks at.
            compose_scripts:
              - 'deploy/compose/**/*.sh'
            # The Homebrew formula template. Its render/push scripts live under
            # .github/scripts, which `ci_scripts` already covers — the job below
            # gates on both.
            homebrew:
              - '.github/homebrew/**'
            workflow:
              - '.github/workflows/build.yaml'
            # A separate filter, not another pattern under `workflow`: with
            # `predicate-quantifier: every` a file would have to match BOTH
            # patterns to match the filter, so adding this there would make
            # `workflow` unmatchable rather than broader. The two scripts are
            # load-bearing for the Swift jobs — swift-build.sh wraps every
            # build and claim-build-scratch.sh decides whether it is warm — so
            # they gate the same jobs `workflow` does.
            ci_scripts:
              - '.github/scripts/**'
            docker_web:
              - 'control-plane/web/Dockerfile'

  swift-format:
    name: Swift Format Lint
    needs: changes
    # SwiftFirecracker/ is vendored and deliberately not linted, so
    # firecracker-only changes don't trigger this job.
    if: needs.changes.outputs.cp_backend == 'true' || needs.changes.outputs.agent == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.api_client == 'true' || needs.changes.outputs.workflow == 'true'
    # Lightweight formatting check — runs on GitHub-hosted runners to keep the
    # Swift runner pool free for the heavy compile jobs. `swift format`
    # ships with the toolchain, so no extra tooling is needed.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: vapor/swiftly-action@v0.2
        with:
          toolchain: "6.3.2"

      - name: Lint Swift formatting
        # --strict makes any lint finding a non-zero exit. The .swift-format
        # config at the repo root is picked up automatically via --recursive.
        run: |
          swift format lint --strict --recursive --parallel \
            control-plane/Sources control-plane/Tests \
            agent/Sources agent/Tests \
            shared/Sources shared/Tests \
            cli/Sources cli/Tests \
            clients/swift/Sources clients/swift/Tests

  install-script:
    name: Shell Scripts
    needs: changes
    if: needs.changes.outputs.install_script == 'true' || needs.changes.outputs.compose_scripts == 'true' || needs.changes.outputs.workflow == 'true'
    # These provision hypervisor hosts, edit /etc/libvirt/qemu.conf in place, and
    # `rm -rf` VM state as root; their helpers are only reachable by running
    # them, and nothing else in CI touches shell. Cheap enough to keep honest.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check syntax
        run: bash -n deploy/agent/install.sh deploy/compose/*.sh deploy/*/tests/*.sh

      - name: Lint with shellcheck
        # Warnings only: install.sh predates this job, and style findings should
        # not gate a node-provisioning fix.
        run: shellcheck --severity=warning deploy/agent/install.sh deploy/compose/*.sh deploy/*/tests/*.sh

      - name: Test script helpers
        # A glob, not a list: these suites exist because the helpers they cover
        # `rm -rf` VM state and rewrite root-owned config, and a new one added
        # beside them should not need this file edited to actually run.
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(deploy/*/tests/*-test.sh)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "no test suites matched deploy/*/tests/*-test.sh" >&2
            exit 1
          fi
          for suite in "${suites[@]}"; do
            echo "== $suite"
            bash "$suite"
          done

  homebrew-formula:
    name: Homebrew Formula Template
    needs: changes
    if: needs.changes.outputs.homebrew == 'true' || needs.changes.outputs.ci_scripts == 'true' || needs.changes.outputs.workflow == 'true'
    # The Homebrew formula is the one release artifact nothing here compiles:
    # release.yaml renders and syntax-checks it inside the release run, which is
    # 30-90 minutes of Swift builds after the tag went public. Render it against
    # fixture checksums so a template typo fails a PR instead of the last job of
    # a release.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check syntax
        run: |
          bash -n .github/scripts/render-homebrew-formula.sh
          bash -n .github/scripts/push-homebrew-formula.sh

      - name: Lint with shellcheck
        run: |
          shellcheck --severity=warning \
            .github/scripts/render-homebrew-formula.sh \
            .github/scripts/push-homebrew-formula.sh

      # Same script the release runs, so this validates the real rendering
      # rather than a copy of it. The script checks for leftover placeholders
      # and runs `ruby -c` itself.
      - name: Render the formula against fixture checksums
        run: |
          mkdir -p /tmp/sidecars
          for platform in macos-arm64 linux-x86_64 linux-arm64; do
            sha="$(printf 'fixture-%s' "$platform" | sha256sum | awk '{print $1}')"
            printf '%s  strato-cli-%s.tar.gz\n' "$sha" "$platform" \
              > "/tmp/sidecars/strato-cli-${platform}.tar.gz.sha256"
          done
          .github/scripts/render-homebrew-formula.sh \
            v1.2.3 "$GITHUB_REPOSITORY" /tmp/sidecars /tmp/strato.rb
          cat /tmp/strato.rb

      # push-homebrew-formula.sh's downgrade guard parses the version back out
      # of whatever formula it finds in the tap. That coupling is invisible from
      # either file on its own: reformatting the template's version line would
      # leave the guard silently never firing, so a backport tag could quietly
      # downgrade the public install path. Assert the two still agree.
      - name: Check the version line stays parseable by the push script
        run: |
          parsed="$(sed -n 's/^  version "\(.*\)"$/\1/p' /tmp/strato.rb)"
          [ "$parsed" = "1.2.3" ] || {
            echo "::error::push-homebrew-formula.sh cannot parse the version out of the rendered formula (got '${parsed}')"
            exit 1
          }

  lint-and-build-frontend:
    name: Frontend Lint & Build
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.cp_backend == 'true' || needs.changes.outputs.workflow == 'true'
    # Lightweight Bun job — runs on GitHub-hosted runners to keep the
    # Swift runner pool free for the heavy compile jobs.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: control-plane/web
        run: bun install --frozen-lockfile

      # `src/types/openapi.ts` is generated from the spec and checked in, so
      # editors and CI see the same types. Regenerating must be a no-op.
      - name: Check generated API types are current
        working-directory: control-plane/web
        run: |
          bun run generate:api-types
          git diff --exit-code -- src/types/openapi.ts \
            || { echo "::error::src/types/openapi.ts is stale — run 'bun run generate:api-types' in control-plane/web"; exit 1; }

      - name: Run linting
        working-directory: control-plane/web
        run: bun run lint

      - name: Build frontend
        working-directory: control-plane/web
        run: bun run build

  openapi-validate:
    name: OpenAPI Spec Validation
    needs: changes
    if: needs.changes.outputs.cp_backend == 'true' || needs.changes.outputs.workflow == 'true'
    # Lightweight validity check of the spec-first OpenAPI document (issue
    # #557). The swift-openapi-generator build plugin is the authoritative
    # validator (it fails the Swift build on an invalid spec); this job gives
    # fast feedback without the multi-minute Swift build. Runs on a
    # GitHub-hosted runner to keep the Swift runner pool free.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Lint OpenAPI document
        run: bunx @redocly/cli@1 lint control-plane/Sources/App/openapi.yaml

  # The two Swift compile jobs below run concurrently on the ARC scale set.
  # Each claims its own slot from a persistent pool of warm build trees (see
  # the comment on the claim step) so two jobs never write the same tree.
  #
  # ARC (actions-runner-controller) runner scale set. Scale-set runners
  # match on exactly one label — the installation name — so do not add
  # `self-hosted` or arch labels here.
  #
  # Jobs run directly on the runner pod: the scale set's runner image bakes in
  # the Swift 6.3.2 toolchain (and git, which SwiftPM needs). They used to run
  # in a `container: swift:6.3.2-noble` job container, but that pulled the
  # multi-GB Swift image through dind on every job. vapor/swiftly-action is
  # still not an option on ARC pods ($USER is unset, so it sources
  # /home//.local/.../env.sh) — a toolchain bump means rebuilding the runner
  # image together with the Dockerfiles.
  build-swift-packages:
    name: Build Swift Packages
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.api_client == 'true' || needs.changes.outputs.cp_backend == 'true' || needs.changes.outputs.firecracker == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.ci_scripts == 'true'
    runs-on: swift-runners-strato
    # Backstop for a hung build: the default 360-minute timeout would pin a
    # scarce runner-pool slot for six hours.
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Build state lives in a scratch dir on a persistent hostPath instead of
      # actions/cache: the GitHub cache never helped here — PR-scoped saves
      # are unreadable by sibling PRs and nothing on main saves the key, so
      # every run paid a ~5 minute 1.4GB upload for a restore that always
      # missed. A pod-local dir under RUNNER_TOOL_CACHE was no better:
      # /home/runner/_work is an emptyDir and every job gets a fresh pod, so it
      # started empty every time.
      #
      # The build tree is claimed by the "Claim build scratch slot" step below
      # and exported as BUILD_SCRATCH_ROOT. A single shared tree would not work
      # — SwiftPM locks a scratch directory exclusively, so concurrent jobs
      # would serialize — so the homelab role provisions a POOL of
      # interchangeable slots and each job flocks one for its duration. The pool
      # is sized above the number of runner pods the scheduler admits, so a job
      # never waits; if every slot is somehow busy the claim degrades to the old
      # pod-local cold path rather than queueing. Never assume
      # BUILD_SCRATCH_ROOT is warm or even shared: it is whichever of those two
      # the claim step resolved to.
      #
      # The SwiftPM shared cache (git mirrors, compiled manifests, binary
      # artifacts) lives on a hostPath — /cache/swiftpm — mounted into every
      # runner pod from the (single-node) runner host, provisioned by the
      # github_runner Ansible role in samcat116/homelab (ghr_swiftpm_cache_*).
      # The "Resolve SwiftPM shared cache path" step below probes that mount and
      # exports SWIFTPM_CACHE_PATH: it uses /cache/swiftpm when it is present and
      # writable, and otherwise falls back to a pod-local (cold) directory. That
      # guard matters because SwiftPM does NOT create a missing cache root on its
      # own — pointing --cache-path at an unwritable /cache/swiftpm fails the
      # build outright ("error: invalid access to /cache/swiftpm"), so the mount
      # being absent must degrade to cold rather than break the run. The two
      # mounts are separate on purpose: the SwiftPM cache is built for
      # concurrent multi-process access and is shared by every pod at once,
      # while a scratch tree takes an exclusive lock and so has to be claimed
      # one job at a time.
      #
      # Runner pods request and cap 4 CPU each, which is why the builds below
      # pass a matching `-j 4`: SwiftPM sizes its own parallelism from the
      # host's core count, not the cgroup quota, so without it a pod spawns 16
      # compile jobs inside a 4-core budget and thrashes.
      #
      # Each job prunes only the scratch dirs inside the slot it claimed —
      # sibling jobs hold other slots on the same volume, so wiping anything
      # above the claimed slot would delete an in-flight build tree.
      #
      # This prune is load-bearing now that the trees persist: it is what keeps
      # a slot from growing without bound across the many branches that pass
      # through it, and it doubles as the periodic cold rebuild that catches a
      # tree only incremental builds can still link.
      #
      # --force-resolved-versions builds exactly what Package.resolved pins and
      # skips re-resolution. With a cold cache the win is small (it avoids the
      # remote branch checks that the branch-pinned deps — swift-scim and
      # webauthn-swift at main, swift-qemu at main, swift-toml at master — force
      # on every unforced resolve), but it also makes CI build the pinned graph
      # rather than silently re-resolving. NOTE that makes a Package.swift change
      # with an uncommitted Package.resolved a build failure instead of a silent
      # re-resolve — intended, but a behavior change for anyone who forgets.
      # Claims one slot from the "packages" pool and exports BUILD_SCRATCH_ROOT.
      # Separate pool from the control-plane job: the two build disjoint
      # component sets, so sharing a pool would have each of them repeatedly
      # landing on a slot warmed for the other.
      - name: Claim build scratch slot
        run: bash .github/scripts/claim-build-scratch.sh packages

      # The shared/ and firecracker/ dirs are orphaned — those packages no
      # longer build standalone (the agent build compiles both). Remove any a
      # previous run left behind in this slot, then prune what is still live.
      - name: Prune build scratch dirs if oversized
        run: |
          rm -rf "$BUILD_SCRATCH_ROOT/shared" "$BUILD_SCRATCH_ROOT/firecracker"
          for scratch in "$BUILD_SCRATCH_ROOT/agent" "$BUILD_SCRATCH_ROOT/cli" "$BUILD_SCRATCH_ROOT/api-client"; do
            if [ -d "$scratch" ]; then
              size_kb=$(du -sk "$scratch" | cut -f1)
              if [ "$size_kb" -gt $((10 * 1024 * 1024)) ]; then
                echo "$scratch is $((size_kb / 1024 / 1024))GB (>10GB); wiping for a cold rebuild"
                rm -rf "$scratch"
              fi
            fi
          done

      # Probe the shared SwiftPM cache hostPath and export SWIFTPM_CACHE_PATH.
      # SwiftPM will not create a missing cache root itself — an unwritable
      # /cache/swiftpm makes every `swift build` fail with "invalid access" — so
      # when the homelab-provisioned mount is absent we fall back to a pod-local
      # (cold) directory instead. Written to $GITHUB_ENV so the build steps
      # below pick it up.
      - name: Resolve SwiftPM shared cache path
        run: |
          shared=/cache/swiftpm
          if mkdir -p "$shared" 2>/dev/null && [ -w "$shared" ]; then
            echo "using shared SwiftPM cache at $shared"
            echo "SWIFTPM_CACHE_PATH=$shared" >> "$GITHUB_ENV"
          else
            fallback="$RUNNER_TOOL_CACHE/swiftpm-cache"
            mkdir -p "$fallback"
            echo "shared cache $shared unavailable; falling back to pod-local $fallback (cold)"
            echo "SWIFTPM_CACHE_PATH=$fallback" >> "$GITHUB_ENV"
          fi

      # There is no standalone shared/ or SwiftFirecracker/ build step: both are
      # `.package(path:)` dependencies of the agent (and shared/ of the control
      # plane too), so this step already compiles every one of their targets
      # that anything consumes. They only ever built separately so their test
      # targets had somewhere to run, and nothing runs tests here now.
      #
      # Each package's step is gated on the paths that affect it: the job as a
      # whole also runs for spec-only changes (which rebuild the API client), and
      # those should not pay for an agent build.
      #
      # `!cancelled()` rather than plain `if:` so a broken package still lets the
      # others report — one red step should not hide the state of the rest.
      - name: Build Agent
        if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.agent == 'true' || needs.changes.outputs.firecracker == 'true' || needs.changes.outputs.workflow == 'true' }}
        working-directory: agent
        run: bash "$GITHUB_WORKSPACE/.github/scripts/swift-build.sh" "$BUILD_SCRATCH_ROOT/agent" -j 4 --cache-path "$SWIFTPM_CACHE_PATH" --force-resolved-versions

      # Gated on the API client and the spec too (issue #779): the CLI is built
      # against the generated `StratoAPIClient`, so a breaking change to
      # `control-plane/Sources/App/openapi.yaml` has to fail the CLI build and
      # not just the client's. `openapi_spec` rather than `cp_backend`: only the
      # spec can break this build, and the CLI now runs the generator plugin
      # over a 15k-line document — no reason to charge every control-plane PR
      # for it.
      - name: Build CLI
        if: ${{ !cancelled() && (needs.changes.outputs.cli == 'true' || needs.changes.outputs.api_client == 'true' || needs.changes.outputs.openapi_spec == 'true' || needs.changes.outputs.workflow == 'true') }}
        working-directory: cli
        run: bash "$GITHUB_WORKSPACE/.github/scripts/swift-build.sh" "$BUILD_SCRATCH_ROOT/cli" -j 4 --cache-path "$SWIFTPM_CACHE_PATH" --force-resolved-versions

      # The generated API client (issue #583). Its openapi.yaml is a symlink to
      # the control plane's, so a spec change that breaks generation fails here
      # rather than in a downstream consumer.
      - name: Build Swift API Client
        if: ${{ !cancelled() && (needs.changes.outputs.api_client == 'true' || needs.changes.outputs.cp_backend == 'true' || needs.changes.outputs.workflow == 'true') }}
        working-directory: clients/swift
        run: bash "$GITHUB_WORKSPACE/.github/scripts/swift-build.sh" "$BUILD_SCRATCH_ROOT/api-client" -j 4 --cache-path "$SWIFTPM_CACHE_PATH" --force-resolved-versions

      # The flock holder is a detached process, so the lock would also be
      # released when the ephemeral pod exits. Release it explicitly anyway:
      # that invariant belongs to how the runners are deployed, not to this
      # workflow, and a slot leaked to a 24h sleep would cost a pool slot.
      - name: Release build scratch slot
        if: always()
        run: kill "$BUILD_SCRATCH_HOLDER_PID" 2>/dev/null || true

  # Control-plane compile check. No Postgres, no cvc5, no test run: the suite
  # that needed them does not run on PRs anymore.
  build-control-plane:
    name: Build Control Plane
    needs: changes
    if: needs.changes.outputs.cp_backend == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.workflow == 'true' || needs.changes.outputs.ci_scripts == 'true'
    runs-on: swift-runners-strato
    # Backstop for a hung build (see the packages job above).
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Own pool, not just an own directory: this job and the packages job build
      # disjoint component sets, so sharing one pool would have each of them
      # repeatedly claiming a slot warmed for the other. See the claim step in
      # the packages job for how slots work.
      - name: Claim build scratch slot
        run: bash .github/scripts/claim-build-scratch.sh control-plane

      # Prune only inside the claimed slot — sibling jobs hold other slots on
      # the same volume, so reaching above it would delete an in-flight tree.
      # The control-plane-postgres dir is orphaned (its job merged into this
      # one); remove it if an older run left one behind in this slot.
      - name: Prune build scratch dir if oversized
        run: |
          rm -rf "$BUILD_SCRATCH_ROOT/control-plane-postgres"
          scratch="$BUILD_SCRATCH_ROOT/control-plane"
          if [ -d "$scratch" ]; then
            size_kb=$(du -sk "$scratch" | cut -f1)
            if [ "$size_kb" -gt $((10 * 1024 * 1024)) ]; then
              echo "$scratch is $((size_kb / 1024 / 1024))GB (>10GB); wiping for a cold rebuild"
              rm -rf "$scratch"
            fi
          fi

      # See the identical step in the packages job: probe the shared cache mount
      # and fall back to a pod-local (cold) directory when it is absent, so a
      # missing /cache/swiftpm degrades instead of failing the build.
      - name: Resolve SwiftPM shared cache path
        run: |
          shared=/cache/swiftpm
          if mkdir -p "$shared" 2>/dev/null && [ -w "$shared" ]; then
            echo "using shared SwiftPM cache at $shared"
            echo "SWIFTPM_CACHE_PATH=$shared" >> "$GITHUB_ENV"
          else
            fallback="$RUNNER_TOOL_CACHE/swiftpm-cache"
            mkdir -p "$fallback"
            echo "shared cache $shared unavailable; falling back to pod-local $fallback (cold)"
            echo "SWIFTPM_CACHE_PATH=$fallback" >> "$GITHUB_ENV"
          fi

      - name: Build Control Plane
        working-directory: control-plane
        run: bash "$GITHUB_WORKSPACE/.github/scripts/swift-build.sh" "$BUILD_SCRATCH_ROOT/control-plane" -j 4 --cache-path "$SWIFTPM_CACHE_PATH" --force-resolved-versions

      # The detached flock holder dies with the pod, but a leaked one would park
      # a pool slot on a 24h sleep.
      - name: Release build scratch slot
        if: always()
        run: kill "$BUILD_SCRATCH_HOLDER_PID" 2>/dev/null || true

  # The one thing the deleted macOS agent job was actually gating. Everything
  # else in that job (the QEMU brew deps, the .build cache, the agent build and
  # test) was `continue-on-error` and could not fail — NIOEmbedded, which the
  # Darwin-only NIOTransportServices pulls in, does not compile under the pinned
  # 6.3.2 on macOS. This step was the exception, and it guards an invariant
  # Linux cannot see: the manifest gates Linux-only products with
  # `.when(platforms:)` rather than `#if os(Linux)`, so resolving on macOS must
  # produce byte-identical pins. If someone reintroduces a host-conditional
  # dependency declaration, macOS silently drops pins (swift-ovn, say) from
  # Package.resolved and only this diff notices.
  #
  # It compiles nothing — checkout, toolchain, resolve, diff — and lands in
  # ~90s, of which the toolchain .pkg is 60. That is roughly the length of the
  # Swift compile jobs it runs beside, so it costs no wall clock on the PRs it
  # runs for, and it is gated to the packages whose resolution it covers.
  macos-resolved-drift:
    name: Package.resolved macOS Drift Check
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.firecracker == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Install the toolchain by dropping the swift.org release .pkg directly.
      # vapor/swiftly-action's macOS path runs a Linux-only (apt/dnf/yum)
      # dependency installer and aborts; and `swiftly install` itself currently
      # crashes (Abort trap: 6) on the macOS runner. A direct .pkg install
      # avoids both and pins the same toolchain the Linux jobs use. Selecting it
      # via TOOLCHAINS (rather than PATH) lets xcrun resolve the macOS SDK.
      # The pin is not incidental: Package.swift declares
      # swift-tools-version:6.2, so the runner's stock Xcode Swift may be too
      # old to even parse the manifest.
      - name: Install Swift 6.3.2 toolchain
        run: |
          set -euxo pipefail
          pkg="$RUNNER_TEMP/swift-6.3.2-osx.pkg"
          curl -fsSL "https://download.swift.org/swift-6.3.2-release/xcode/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE-osx.pkg" -o "$pkg"
          sudo installer -pkg "$pkg" -target /
          toolchain="$(ls -d /Library/Developer/Toolchains/swift-6.3.2-RELEASE.xctoolchain 2>/dev/null || ls -dt /Library/Developer/Toolchains/*.xctoolchain | head -1)"
          echo "TOOLCHAINS=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$toolchain/Info.plist")" >> "$GITHUB_ENV"

      - name: Check Package.resolved does not drift on macOS
        working-directory: agent
        run: |
          swift --version
          swift package resolve
          git diff --exit-code Package.resolved \
            || { echo "::error::agent/Package.resolved differs when resolved on macOS — someone reintroduced a host-conditional dependency declaration"; exit 1; }

  # The only image still checked on PRs. The control-plane and agent image
  # checks were dropped: they compile Swift from source in-image (up to an hour
  # with no usable cache), and main-build's build-image-digests rebuilds both on
  # every push to main anyway, so Dockerfile breakage still surfaces — just
  # post-merge. This one stays because it compiles no Swift, caps at 20 minutes,
  # reads a warm GHCR cache, and only fires on its own Dockerfile.
  # `cache-to` is deliberately omitted: PR-scoped buildkit caches are unreadable
  # by sibling PRs and would only thrash the 10GB repo cache quota.
  docker-web:
    name: Docker Build Check (Frontend)
    needs: changes
    if: needs.changes.outputs.docker_web == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./control-plane/web
          file: ./control-plane/web/Dockerfile
          push: false
          platforms: linux/amd64
          # Anonymous read of the public GHCR cache main-build writes; needs no
          # registry login and works for fork PRs, which can't read gha caches.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-frontend:buildcache-x64
