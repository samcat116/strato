version: 2
updates:
  - package-ecosystem: "swift"
    directories:
      - "/SwiftFirecracker"
      - "/agent"
      - "/cli"
      - "/clients/swift"
      - "/control-plane"
      - "/shared"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "swift"
    assignees:
      - "samcat116"
    # The SwiftProtobuf runtime must match the pinned protoc-gen-swift that
    # produced shared/Sources/StratoShared/Generated (scripts/agent-protocol.sh
    # enforces this). Bump the runtime, generator, and generated output together.
    ignore:
      - dependency-name: "github.com/apple/swift-protobuf"
  # Explicit ecosystems route security updates to the matching lockfile updater.
  # A zero version-update limit keeps JavaScript updates security-only.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "bun"
    directory: "/control-plane/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
