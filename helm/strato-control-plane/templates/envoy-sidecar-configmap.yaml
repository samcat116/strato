{{- if and .Values.spire.enabled .Values.spire.envoy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "strato-control-plane.fullname" . }}-envoy-sidecar
  labels:
    {{- include "strato-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-sidecar
data:
  envoy.yaml: |
    node:
      id: {{ include "strato-control-plane.fullname" . }}
      cluster: strato-control-plane

    static_resources:
      listeners:
        # Agent WebSocket listener with mTLS
        - name: agent_mtls_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: {{ .Values.spire.envoy.agentPort }}
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    # Offer hybrid post-quantum key exchange first — see
                    # spire.envoy.tlsParams in values.yaml for why, and for the
                    # Envoy >= v1.39.0 floor X25519MLKEM768 depends on.
                    tls_params:
                      tls_minimum_protocol_version: {{ .Values.spire.envoy.tlsParams.minimumProtocolVersion }}
                      ecdh_curves:
                        {{- toYaml .Values.spire.envoy.tlsParams.ecdhCurves | nindent 24 }}
                    # Server certificate from SPIRE via SDS
                    tls_certificate_sds_secret_configs:
                      - name: "spiffe://{{ .Values.spire.trustDomain }}/control-plane"
                        sds_config:
                          resource_api_version: V3
                          api_config_source:
                            api_type: GRPC
                            transport_api_version: V3
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: spire_agent
                    # Trust bundle for validating client (agent) certificates.
                    # "ALL" rather than a single "spiffe://<td>" name: it asks
                    # the SPIRE agent's SDS for a SPIFFECertValidator carrying
                    # every trust domain's bundle keyed by domain, so a client
                    # is checked against the roots of its *own* domain instead
                    # of one fixed bundle. With per-org trust domains (issue
                    # #600) agents attest in `org-<id>.{{ .Values.spire.trustDomain }}`
                    # while the control plane stays in the platform domain, and
                    # a single-bundle validation context would reject all of
                    # them. It keeps per-domain separation: this is not a union
                    # of roots that any CA could satisfy.
                    validation_context_sds_secret_config:
                      name: "ALL"
                      sds_config:
                        resource_api_version: V3
                        api_config_source:
                          api_type: GRPC
                          transport_api_version: V3
                          grpc_services:
                            - envoy_grpc:
                                cluster_name: spire_agent
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: agent_mtls
                    codec_type: AUTO
                    upgrade_configs:
                      - upgrade_type: websocket
                    # Forward client certificate details to upstream. The chain
                    # (leaf included) lets the control plane independently
                    # re-verify the certificate against the SPIRE trust bundle
                    # instead of trusting the URI assertion alone.
                    forward_client_cert_details: SANITIZE_SET
                    set_current_client_cert_details:
                      uri: true
                      cert: true
                      chain: true
                      dns: false
                      subject: true
                    route_config:
                      name: agent_route
                      virtual_hosts:
                        - name: control_plane
                          domains: ["*"]
                          routes:
                            # Image/artifact downloads (issue #493): agents
                            # fetch base-image bytes with their SVID as the
                            # client cert; the control plane re-verifies the
                            # forwarded identity (XFCC). The per-route RBAC
                            # restricts these to agent identities — mTLS alone
                            # only proves trust-domain membership. Timeout 0:
                            # image bodies stream for longer than any fixed
                            # budget.
                            - match:
                                safe_regex:
                                  regex: "^/api/projects/[^/]+/images/[^/]+/download$"
                              route:
                                cluster: control_plane_local
                                timeout: 0s
                              typed_per_filter_config:
                                envoy.filters.http.rbac:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                                  rbac:
                                    rules:
                                      action: ALLOW
                                      policies:
                                        agents-only:
                                          permissions:
                                            - any: true
                                          principals:
                                            - authenticated:
                                                principal_name:
                                                  safe_regex:
                                                    # Single-quoted: YAML does no escape processing
                                                    # there, so the backslashes regexQuoteMeta emits
                                                    # reach RE2 intact.
                                                    #
                                                    # Lowercased to match what is actually in an SVID:
                                                    # SPIFFE trust domain names are lowercase, and
                                                    # OrgTrustDomain.trustDomain(forOrganization:) lowercases
                                                    # the whole derived domain for exactly that reason. A
                                                    # mixed-case spire.trustDomain would otherwise render an
                                                    # org alternative that matches no SVID at all — and only
                                                    # the /ingest/* routes would break, since the platform
                                                    # alternative keeps working.
                                                    #
                                                    # Optional org- prefix rather than a two-branch
                                                    # alternation: spelling the trust domain twice
                                                    # pushes the compiled RE2 program past Envoy's
                                                    # default 100-instruction error threshold once the
                                                    # domain is long enough (dev.stratocloud.app hit
                                                    # 106), and Envoy refuses to start.
                                                    regex: 'spiffe://(org-[0-9a-f]{16}\.)?{{ regexQuoteMeta (lower .Values.spire.trustDomain) }}/agent/.+'
                            # Sandbox snapshot artifact transfer (issue #428):
                            # agents PUT exported checkpoint artifacts during an
                            # export and GET them back for cross-agent
                            # restore/fork, authenticated by their SVID exactly
                            # like image downloads. Timeout 0: memory files are
                            # guest-RAM-sized and stream past any fixed budget.
                            - match:
                                safe_regex:
                                  regex: "^/api/sandboxes/[^/]+/snapshots/[^/]+/artifacts/[^/]+$"
                              route:
                                cluster: control_plane_local
                                timeout: 0s
                              typed_per_filter_config:
                                envoy.filters.http.rbac:
                                  "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                                  rbac:
                                    rules:
                                      action: ALLOW
                                      policies:
                                        agents-only:
                                          permissions:
                                            - any: true
                                          principals:
                                            - authenticated:
                                                principal_name:
                                                  safe_regex:
                                                    # Single-quoted: YAML does no escape processing
                                                    # there, so the backslashes regexQuoteMeta emits
                                                    # reach RE2 intact.
                                                    #
                                                    # Lowercased to match what is actually in an SVID:
                                                    # SPIFFE trust domain names are lowercase, and
                                                    # OrgTrustDomain.trustDomain(forOrganization:) lowercases
                                                    # the whole derived domain for exactly that reason. A
                                                    # mixed-case spire.trustDomain would otherwise render an
                                                    # org alternative that matches no SVID at all — and only
                                                    # the /ingest/* routes would break, since the platform
                                                    # alternative keeps working.
                                                    #
                                                    # Optional org- prefix rather than a two-branch
                                                    # alternation: spelling the trust domain twice
                                                    # pushes the compiled RE2 program past Envoy's
                                                    # default 100-instruction error threshold once the
                                                    # domain is long enough (dev.stratocloud.app hit
                                                    # 106), and Envoy refuses to start.
                                                    regex: 'spiffe://(org-[0-9a-f]{16}\.)?{{ regexQuoteMeta (lower .Values.spire.trustDomain) }}/agent/.+'
                            # The agent control channel: the WebSocket at
                            # /agent/ws and the desired-state long-poll at
                            # /agent/desired-state (STR-146). Both are
                            # long-lived by design, hence no route timeout.
                            #
                            # `timeout: 0s` is the route timeout only. The
                            # connection manager's stream_idle_timeout (5 min by
                            # default, unset here) still applies to a stream
                            # with no bytes flowing — exactly what a parked poll
                            # is. The 45s hold window in
                            # AgentDesiredStateController sits well under it;
                            # raising that would need an explicit per-route
                            # idle_timeout here.
                            - match:
                                prefix: "/agent/"
                              route:
                                cluster: control_plane_local
                                timeout: 0s
                            - match:
                                prefix: "/"
                              route:
                                cluster: control_plane_local
                    http_filters:
                      # No listener-level rules: everything is allowed unless a
                      # route overrides via typed_per_filter_config (the image
                      # download route above). Control-plane routes keep their
                      # existing model — the control plane re-verifies the
                      # forwarded client cert (XFCC) itself.
                      #
                      # Those overrides match the principal name by regex
                      # rather than by a single-trust-domain prefix, because
                      # with per-org trust domains (issue #600) an agent's SVID
                      # reads spiffe://org-<16 hex>.<td>/agent/<name> — while
                      # platform-domain agents enrolled before the cutover keep
                      # spiffe://<td>/agent/<name>, so both alternatives have
                      # to be admitted. Envoy string matchers are full matches,
                      # hence the trailing `/agent/.+` rather than a bare
                      # prefix: a domain merely *ending* in the trust domain,
                      # or a path that only starts with /agent/, does not
                      # match. The trust domain is regex-escaped so its dots
                      # cannot act as wildcards.
                      #
                      # Note the shape: because the catch-all "/" route carries
                      # no RBAC, a path that misses a guarded route's matcher is
                      # allowed through, not denied. For the image download that
                      # is deliberate but not load-bearing — the control plane
                      # independently re-verifies the XFCC identity and requires
                      # an agent SVID before serving bytes, so this RBAC is
                      # defense in depth, not the gate. Do not remove the
                      # in-handler check on the strength of this config.
                      - name: envoy.filters.http.rbac
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

        # Health check listener (no TLS)
        - name: health_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: {{ .Values.spire.envoy.healthPort }}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: health
                    codec_type: AUTO
                    route_config:
                      name: health_route
                      virtual_hosts:
                        - name: health
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/health"
                              route:
                                cluster: control_plane_local
                            - match:
                                prefix: "/ready"
                              direct_response:
                                status: 200
                                body:
                                  inline_string: "OK"
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        # Local control plane (upstream)
        - name: control_plane_local
          connect_timeout: 5s
          type: STATIC
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: control_plane_local
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: {{ .Values.service.port }}

        # SPIRE Agent for SDS (Secret Discovery Service)
        - name: spire_agent
          connect_timeout: 5s
          type: STATIC
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: spire_agent
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe:
                          path: {{ .Values.spire.envoy.spireAgentSocketPath }}

    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: {{ .Values.spire.envoy.adminPort }}
{{- end }}
