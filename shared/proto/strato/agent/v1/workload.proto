    ErrorMessage error_message = 15;
    ConsoleConnectMessage console_connect_message = 16;
    ConsoleDisconnectMessage console_disconnect_message = 17;
    ConsoleDataMessage console_data_message = 18;
    ConsoleConnectedMessage console_connected_message = 19;
    ConsoleDisconnectedMessage console_disconnected_message = 20;
    VMLogMessage vm_log_message = 21;
    GuestExecStartMessage guest_exec_start_message = 22;
    GuestExecRecordedStateMessage guest_exec_recorded_state_message = 23;
    GuestExecRecordedAckMessage guest_exec_recorded_ack_message = 24;
    GuestExecStartedMessage guest_exec_started_message = 25;
    GuestExecInputMessage guest_exec_input_message = 26;
    GuestExecOutputMessage guest_exec_output_message = 27;
    GuestExecResizeMessage guest_exec_resize_message = 28;
    GuestExecExitMessage guest_exec_exit_message = 29;
    GuestExecCloseMessage guest_exec_close_message = 30;
    GuestExecClosedMessage guest_exec_closed_message = 31;
    SandboxLogMessage sandbox_log_message = 32;
    DesiredStateMessage desired_state_message = 33;
    ObservedStateReport observed_state_report = 34;
  }
}

