    OIDCGroupMapping:
      type: object
      description: >-
        Maps one value of the provider's groups claim to a Strato group. Groups
        named here are IdP-managed: membership is reconciled on every login.
      required: [claimValue, groupID]
      properties:
        claimValue:
          type: string
          description: The claim value as emitted by the IdP (a name, or an object id).
        groupID:
          type: string
          format: uuid
          description: The Strato group; must belong to the provider's organization.

    OIDCRoleMapping:
      type: object
      description: >-
        Maps one value of the provider's groups claim to a Strato role bound on
        the organization node. When a login token carries the claim value, the
        user's org role is reconciled to this role. The role must be bindable at
        the org (platform-owned, or owned by the org or one of its ancestors).
      required: [claimValue, roleID]
      properties:
        claimValue:
          type: string
          description: The claim value as emitted by the IdP.
        roleID:
          type: string
          format: uuid
          description: The role to bind on the organization node.

    OIDCProviderConfig:
      type: object
      description: >-
        A configured OIDC identity provider. The client secret is never
        returned. Claim-mapping fields are omitted for non-admin readers.
      required: [name, clientID, scopes, enabled, useNonce]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        clientID:
          type: string
        discoveryURL:
          type: string
        issuer:
          type: string
          description: Discovered issuer; ID tokens are rejected unless they match it.
        authorizationEndpoint:
          type: string
        tokenEndpoint:
          type: string
        userinfoEndpoint:
          type: string
        jwksURI:
          type: string
        endSessionEndpoint:
          type: string
        scopes:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        useNonce:
          type: boolean
          description: Whether to mint and verify a nonce (disable for IdPs that drop it).
        groupsClaim:
          type: string
          description: Admin-only. The claim carrying group values.
        groupMappings:
          type: array
          description: Admin-only.
          items:
            $ref: "#/components/schemas/OIDCGroupMapping"
        adminClaimValues:
          type: array
          description: Admin-only. Claim values that grant the organization admin role.
          items:
            type: string
        roleMappings:
          type: array
          description: >-
            Admin-only. Claim values mapped to org-scoped roles bound on login.
          items:
            $ref: "#/components/schemas/OIDCRoleMapping"
        defaultRoleID:
          type: string
          format: uuid
          nullable: true
          description: >-
            Admin-only. Canonical organization role id for newly provisioned
            users when no claim matches. Null or omission creates bare membership.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateOIDCProviderRequest:
      type: object
      description: >-
        Either `discoveryURL` or all of `authorizationEndpoint`, `tokenEndpoint`
        and `jwksURI` must be supplied.
      required: [name, clientID, clientSecret]
      properties:
        name:
          type: string
          description: Unique within the organization.
        clientID:
          type: string
        clientSecret:
          type: string
          description: Stored encrypted; never returned.
        discoveryURL:
          type: string
        authorizationEndpoint:
          type: string
        tokenEndpoint:
          type: string
        userinfoEndpoint:
          type: string
        jwksURI:
          type: string
        endSessionEndpoint:
          type: string
        scopes:
          type: array
          description: Defaults to `["openid", "profile", "email"]`.
          items:
            type: string
        enabled:
          type: boolean
          default: true
        useNonce:
          type: boolean
          default: true
        groupsClaim:
          type: string
        groupMappings:
          type: array
          items:
            $ref: "#/components/schemas/OIDCGroupMapping"
        adminClaimValues:
          type: array
          items:
            type: string
        roleMappings:
          type: array
          items:
            $ref: "#/components/schemas/OIDCRoleMapping"
        defaultRoleID:
          type: string
          format: uuid
          nullable: true
          description: >-
            Canonical role id returned by `GET /api/iam/roles/bindable` for the
            organization. Null or omission creates bare membership.

    UpdateOIDCProviderRequest:
      type: object
      description: >-
        Every field is optional. Omitted URL fields keep their stored value; an
        empty string clears them.
      properties:
        name:
          type: string
        clientID:
          type: string
        clientSecret:
          type: string
        discoveryURL:
          type: string
        authorizationEndpoint:
          type: string
        tokenEndpoint:
          type: string
        userinfoEndpoint:
          type: string
        jwksURI:
          type: string
        endSessionEndpoint:
          type: string
        scopes:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        useNonce:
          type: boolean
        groupsClaim:
          type: string
        groupMappings:
          type: array
          items:
            $ref: "#/components/schemas/OIDCGroupMapping"
        adminClaimValues:
          type: array
          items:
            type: string
        roleMappings:
          type: array
          items:
            $ref: "#/components/schemas/OIDCRoleMapping"
        defaultRoleID:
          type: string
          format: uuid
          nullable: true
          description: >-
            Canonical role id returned by `GET /api/iam/roles/bindable` for the
            organization. Null selects bare membership.

    OIDCProviderTestResult:
      type: object
      description: The outcome of a provider configuration test.
      required: [valid, message]
      properties:
        valid:
          type: boolean
        message:
          type: string

    OIDCProviderPublicSummary:
