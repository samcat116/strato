        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/security-groups/{securityGroupId}/rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/SecurityGroupID"
      - $ref: "#/components/parameters/SecurityGroupRuleID"
    delete:
      operationId: deleteSecurityGroupRule
      summary: Delete a rule from a security group
      tags: [Security Groups]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/security-groups/{securityGroupId}/attach:
    parameters:
      - $ref: "#/components/parameters/SecurityGroupID"
    post:
      operationId: attachSecurityGroup
      summary: Attach a security group to a VM NIC
      description: >-
        Requires `attach` on the group and `update` on the VM. Refused with
        `400` when the two belong to different projects — the status every
        cross-project refusal answers with.


        A `vmId` this caller cannot reach is answered `404`, whether no such VM
        exists or the caller merely lacks `update` on it: the two are
        deliberately indistinguishable, so the endpoint cannot be used to probe
        which VM ids exist. `403` on this endpoint therefore refers to the
        security group, never to the VM. A `sandboxId` still separates the two —
        `404` absent, `403` forbidden.
      tags: [Security Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachSecurityGroupRequest"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/security-groups/{securityGroupId}/detach:
    parameters:
      - $ref: "#/components/parameters/SecurityGroupID"
    post:
      operationId: detachSecurityGroup
      summary: Detach a security group from a VM NIC
      description: >-
        Refused when it would leave the NIC with no security group — every
        NIC keeps at least one.


        Resolves the target the same way attach does: a `vmId` this caller
        cannot reach is answered `404` whether no such VM exists or the caller
        merely lacks `update` on it, so the two are indistinguishable and the
        endpoint cannot be used to probe which VM ids exist. `403` therefore
        refers to the security group, never to the VM; a `sandboxId` still
        separates the two.
      tags: [Security Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachSecurityGroupRequest"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/dns-zones:
    get:
      operationId: listDNSZones
      summary: List DNS zones
      tags: [DNS]
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - $ref: "#/components/parameters/ListLimitQuery"
        - $ref: "#/components/parameters/ListOffsetQuery"
      responses:
        "200":
          description: A page of the visible DNS zones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSZoneListPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createDNSZone
      summary: Create a DNS zone
      description: >-
        Zone names are validated as fully-qualified domain names but are not
        constrained to `.internal`, and are unique per project rather than
        globally — two tenants may both serve `corp.example.com` internally.
      tags: [DNS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDNSZoneRequest"
      responses:
        "200":
          description: The created zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSZone"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/dns-zones/{zoneId}:
    parameters:
      - $ref: "#/components/parameters/DNSZoneID"
    get:
      operationId: getDNSZone
      summary: Get a DNS zone
      tags: [DNS]
      responses:
        "200":
          description: The zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSZone"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateDNSZone
      summary: Update a DNS zone's name or description
      description: >-
        Renaming a zone moves every record in it, derived and authored alike.
      tags: [DNS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDNSZoneRequest"
      responses:
        "200":
          description: The updated zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSZone"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteDNSZone
      summary: Delete a DNS zone
      description: >-
        Refused while any network is attached; detach first, so losing
        resolution is always an explicit act. Records cascade with the zone.
      tags: [DNS]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/dns-zones/{zoneId}/recordset:
    parameters:
      - $ref: "#/components/parameters/DNSZoneID"
    get:
      operationId: getDNSZoneRecordSet
      summary: Get a zone's effective record set
      description: >-
        The zone's contents as **derived ∪ authored**, computed on demand and
        never stored — exactly what a realization driver consumes. Derived
        entries come from the hostnames and IPAM allocations of VMs on
        networks whose primary zone is this one, plus the matching PTRs.
      tags: [DNS]
      responses:
        "200":
          description: The assembled record set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssembledDNSZone"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/dns-zones/{zoneId}/records:
    parameters:
      - $ref: "#/components/parameters/DNSZoneID"
    get:
      operationId: listDNSRecords
      summary: List a zone's authored records
      tags: [DNS]
      parameters:
        - $ref: "#/components/parameters/ListLimitQuery"
        - $ref: "#/components/parameters/ListOffsetQuery"
      responses:
        "200":
          description: A page of the zone's authored records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSRecordListPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createDNSRecord
      summary: Author a record in a zone
      description: >-
        Refused with `409` when the record would collide with one derived from
        a VM, or would break CNAME's exclusivity rule — a shadowed record is
        rejected at write time rather than silently never answered. Also `409`
        when `ttl` or `view` disagrees with the record set this joins: those
        belong to the whole RRset (RFC 2181 §5.2), not to individual records.
      tags: [DNS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDNSRecordRequest"
      responses:
        "200":
          description: The created record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSRecord"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/dns-zones/{zoneId}/records/{recordId}:
    parameters:
      - $ref: "#/components/parameters/DNSZoneID"
      - $ref: "#/components/parameters/DNSRecordID"
    get:
      operationId: getDNSRecord
      summary: Get an authored record
      tags: [DNS]
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSRecord"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateDNSRecord
      summary: Update an authored record's value, TTL, or view
      tags: [DNS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDNSRecordRequest"
      responses:
        "200":
          description: The updated record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSRecord"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteDNSRecord
      summary: Delete an authored record
      tags: [DNS]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/dns-zones/{zoneId}/networks:
    parameters:
      - $ref: "#/components/parameters/DNSZoneID"
    post:
      operationId: attachDNSZoneToNetwork
      summary: Attach a zone to a logical network
      description: >-
        "VMs on this network can resolve this zone." Idempotent. Pass
        `primary: true` to also make it the zone the network's VMs
        auto-register into; that is refused when the VMs already on the
        network would collide in it. Requires `attach` on the zone and
        `update` on the network, and is refused with `400` when the two belong
        to different projects — the status every cross-project refusal answers
        with.
      tags: [DNS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachDNSZoneRequest"
      responses:
        "200":
          description: The zone, with its updated attachments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DNSZone"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/dns-zones/{zoneId}/networks/{networkId}:
    parameters:
      - $ref: "#/components/parameters/DNSZoneID"
      - $ref: "#/components/parameters/DNSZoneNetworkID"
    delete:
      operationId: detachDNSZoneFromNetwork
      summary: Detach a zone from a logical network
      description: >-
        Refused while this zone is the network's primary — clear the network's
        primary zone first, so its VMs' derived records are never stranded.
        Resolves the network the same way attach does: requires `update` on it,
        and is refused with `400` when the zone and the network belong to
        different projects — the status every cross-project refusal answers
        with.
      tags: [DNS]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/users:
    get:
      operationId: listUsers
      summary: List users
      description: >-
        Filtered per row on `user:read`: a system admin gets every account in
        the deployment, anyone else gets only their own. Not an error for a
        non-admin — a one-element list, not a 403.
      tags: [Users]
      parameters:
        - $ref: "#/components/parameters/ListLimitQuery"
        - $ref: "#/components/parameters/ListOffsetQuery"
      responses:
        "200":
          description: A page of the visible user accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: adminCreateUser
      summary: Create an invited user
      description: >-
        System-admin only. Creates a `local` account with no credential and mints
        a one-time passkey-claim token. Passkeys are device-bound, so the invitee
        finishes enrollment themselves via the returned claim link
        (`/auth/claim/*`). The token is returned exactly once.
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateUserRequest"
      responses:
        "200":
          description: The created account plus its one-time claim invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCreateUserResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/users/register:
    post:
      operationId: selfRegisterUser
      summary: Self-register an account
      description: >-
        Public. Creates the account row only; the caller must immediately enroll
        a passkey via `/auth/register/begin` + `/auth/register/finish` from the
        same browser session, which is bound to this account as a one-shot
        enrollment grant. The first account created in a deployment becomes a
        system admin.


        Returns 403 when the operator has disabled self-registration
        (`SELF_REGISTRATION_ENABLED=false`), except while the deployment has no
        users at all — the first account can always be created.
      tags: [Users]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelfRegisterUserRequest"
      responses:
        "200":
          description: The newly created account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/public/registration:
    get:
      operationId: getRegistrationPolicy
      summary: Whether accounts may be self-created
      description: >-
        Unauthenticated login-page surface: reports whether
        `/api/users/register` is currently accepting accounts, so the sign-in
        screen knows whether to offer account creation. `selfRegistrationEnabled`
        already accounts for bootstrap, so clients can render on it directly.
      tags: [Users]
      security: []
      responses:
        "200":
          description: The effective registration policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationPolicy"
  /api/users/{userID}:
    parameters:
      - $ref: "#/components/parameters/UserIDPath"
    get:
      operationId: getUser
      summary: Get a user
      description: Callers may only read their own account unless they are a system admin.
      tags: [Users]
      responses:
        "200":
          description: The user account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateUser
      summary: Update a user
      description: >-
        Callers may only modify their own account unless they are a system admin.
        SCIM-provisioned accounts are owned by the identity provider and reject
        edits to username/displayName/email with `403`.
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The updated user account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteUser
      summary: Delete a user
      description: Callers may only delete their own account unless they are a system admin.
      tags: [Users]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/users/me/passkeys:
    get:
      operationId: listMyPasskeys
      summary: List my passkeys
      description: Credentials belonging to the authenticated user, oldest first.
      tags: [Authentication]
      responses:
        "200":
          description: The caller's enrolled passkeys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PasskeySummary"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/users/me/passkeys/begin:
    post:
      operationId: beginAddPasskey
      summary: Begin adding a passkey
      description: >-
        Issues a WebAuthn creation challenge in the `add_passkey` namespace for
        the signed-in account. Requires a browser session — API keys and CLI
        tokens are rejected with `403`. Capped at 20 passkeys per account (`409`).
      tags: [Authentication]
      responses:
        "200":
          description: WebAuthn credential creation options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyRegistrationBeginResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/users/me/passkeys/finish:
    post:
      operationId: finishAddPasskey
      summary: Finish adding a passkey
      description: >-
        Verifies the authenticator response and enrolls the credential on the
        signed-in account. Requires a browser session.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPasskeyFinishRequest"
      responses:
        "200":
          description: The newly enrolled passkey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeySummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/users/me/passkeys/{credentialID}:
    parameters:
      - $ref: "#/components/parameters/PasskeyCredentialID"
    patch:
      operationId: renameMyPasskey
      summary: Rename a passkey
      description: >-
        Sets the user-visible label (max 64 chars); an empty or omitted name
        clears it back to the client-rendered default. Requires a browser session.
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenamePasskeyRequest"
      responses:
        "200":
          description: The updated passkey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeySummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteMyPasskey
      summary: Delete a passkey
      description: >-
        Requires a browser session. The last remaining passkey may only be
        removed by an account that can still sign in another way (a linked OIDC
        provider); otherwise the request is rejected with `409`.
      tags: [Authentication]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /auth/register/begin:
    post:
      operationId: beginPasskeyRegistration
      summary: Begin passkey registration
      description: >-
        Public, but authorization is enforced in-handler: the challenge is only
        issued to the browser session that just created the account via
        `POST /api/users/register`, or to a session already authenticated as that
        user. Unknown usernames, admin-invited accounts, and accounts that already
        have a passkey all fail with `403`.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegistrationBeginRequest"
      responses:
        "200":
          description: WebAuthn credential creation options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyRegistrationBeginResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/register/finish:
    post:
      operationId: finishPasskeyRegistration
      summary: Finish passkey registration
      description: >-
        Verifies the authenticator response, enrolls the credential, and logs the
        account in (sets the session cookie).
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyRegistrationFinishRequest"
      responses:
        "200":
          description: The enrolled credential and the now signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyRegistrationFinishResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/login/begin:
    post:
      operationId: beginPasskeyAuthentication
      summary: Begin passkey login
      description: >-
        Public. An unknown username yields a stable decoy credential rather than
        an error, so this endpoint is not a username-enumeration oracle. Omit
        `username` for a discoverable-credential (usernameless) ceremony.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyAuthenticationBeginRequest"
      responses:
        "200":
          description: WebAuthn credential request options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyAuthenticationBeginResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
  /auth/login/finish:
    post:
      operationId: finishPasskeyAuthentication
      summary: Finish passkey login
      description: Verifies the assertion and establishes the session cookie.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyAuthenticationFinishRequest"
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyAuthenticationFinishResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: >-
        Destroys the whole session (including any stored OIDC ID token). Succeeds
        even when no session is present. When the session was established through
        an OIDC provider that advertises an `end_session_endpoint`, `sloUrl`
        carries the IdP logout URL the frontend should navigate to.
      tags: [Authentication]
      security: []
      responses:
        "200":
          description: The session was destroyed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
  /auth/session:
    get:
      operationId: getCurrentSession
      summary: Get the current session
      description: Returns the authenticated user, or `401` when no session is present.
      tags: [Authentication]
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/claim/{token}:
    parameters:
      - $ref: "#/components/parameters/AccountClaimTokenPath"
    get:
      operationId: getAccountClaimInfo
      summary: Describe a passkey-claim invitation
      description: >-
        Public. Lets the claim page greet the invitee. An unknown token is `404`;
        a known-but-unusable token is reported through the
        `valid`/`expired`/`alreadyClaimed` flags rather than an error.
      tags: [Authentication]
      security: []
      responses:
        "200":
          description: The invitation's target account and usability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimInfoResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/claim/begin:
    post:
      operationId: beginAccountClaim
      summary: Begin claiming an invited account
      description: >-
        Public, authorized by the one-time claim token instead of a session. The
        challenge is stored in the `claim` namespace so it cannot be redeemed
        through `/auth/register/finish`.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimBeginRequest"
      responses:
        "200":
          description: WebAuthn credential creation options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyRegistrationBeginResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The invitation has expired or was already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/claim/finish:
    post:
      operationId: finishAccountClaim
      summary: Finish claiming an invited account
      description: >-
        Public. Consumes the one-time claim token and enrolls the credential in a
        single transaction, then logs the account in. Two holders of the same
        invite finishing concurrently: exactly one wins, the loser gets `410`.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimFinishRequest"
      responses:
        "200":
          description: The enrolled credential and the now signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyRegistrationFinishResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: The invitation or the passkey request has expired, or was already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/api-keys:
    get:
      operationId: listAPIKeys
      summary: List my API keys
      description: The authenticated user's own keys, newest first. Secrets are never returned.
      tags: [API Keys]
      responses:
        "200":
          description: The caller's API keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKeySummary"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createAPIKey
      summary: Create an API key
      description: >-
        Mints a key for the authenticated user; the full secret is returned once
        and never again. Scopes default to `["read", "write"]`. A user may hold at
        most 10 keys.
      tags: [API Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "200":
          description: The created key, including its one-time plaintext secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAPIKeyResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/api-keys/{apiKeyID}:
    parameters:
      - $ref: "#/components/parameters/APIKeyID"
    get:
      operationId: getAPIKey
      summary: Get an API key
      description: Scoped to the caller's own keys; another user's key is indistinguishable from a missing one.
      tags: [API Keys]
      responses:
        "200":
          description: The API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeySummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateAPIKey
      summary: Update an API key
      description: Rename, re-scope, or deactivate one of the caller's own keys.
      tags: [API Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAPIKeyRequest"
      responses:
        "200":
          description: The updated API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeySummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteAPIKey
      summary: Delete an API key
      tags: [API Keys]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /oauth/device_authorization:
    post:
      operationId: oauthDeviceAuthorization
      summary: Start a device authorization (RFC 8628)
      description: >-
        Public. Issues a device code plus a short user code for the `strato` CLI
        to display. Requests expire after 15 minutes. Accepts form-encoded or JSON
        bodies; the response uses OAuth snake_case field names.
      tags: [Authentication]
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/DeviceAuthorizationRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceAuthorizationRequest"
      responses:
        "200":
          description: The device and user codes plus the verification URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorizationResponse"
        "400":
          description: An OAuth error (e.g. `invalid_scope`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"
  /oauth/token:
    post:
      operationId: oauthToken
      summary: Exchange or refresh a CLI token
      description: >-
        Public. Supports `grant_type=urn:ietf:params:oauth:grant-type:device_code`
        (redeem an approved device code, single use) and `grant_type=refresh_token`
        (rotating refresh; replay of a rotated token revokes the session). While
        the user has not yet approved, polling returns `400` with
        `authorization_pending`, or `slow_down` if polled faster than `interval`.
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthTokenRequest"
      responses:
        "200":
          description: A newly minted access/refresh token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
        "400":
          description: >-
            An OAuth error: `invalid_request`, `invalid_grant`,
            `unsupported_grant_type`, `authorization_pending`, `slow_down`,
            `access_denied`, or `expired_token`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthErrorResponse"
  /oauth/revoke:
    post:
      operationId: oauthRevoke
      summary: Revoke a CLI token (RFC 7009)
      description: >-
        Public. Revokes the CLI session identified by an access or refresh token.
        Always returns `200`, even for unknown or malformed input, so callers
        cannot probe which tokens exist.
      tags: [Authentication]
      security: []
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthRevokeRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthRevokeRequest"
      responses:
        "200":
          description: The request was accepted (no body).
  /api/oauth/device/{userCode}:
    parameters:
      - $ref: "#/components/parameters/DeviceUserCode"
    get:
      operationId: getPendingDeviceAuthorization
      summary: Look up a pending device authorization
      description: >-
        Session-authenticated. Backs the `/activate` approval page. Unknown,
        already-decided, or expired codes return `404`.
      tags: [Authentication]
      responses:
        "200":
          description: The pending authorization awaiting approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingDeviceAuthorization"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/oauth/device/{userCode}/approve:
    parameters:
      - $ref: "#/components/parameters/DeviceUserCode"
    post:
      operationId: approveDeviceAuthorization
      summary: Approve a device authorization
      description: >-
        Binds the pending authorization to the signed-in user so the CLI can
        redeem it. The approver may narrow what the client asked for — never
        widen it — which is where a CLI login stops being all-or-nothing.
      tags: [Authentication]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveDeviceAuthorizationRequest"
      responses:
        "200":
          description: The authorization was approved (no body).
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The requested restriction is broader than the one the client asked for.
        "404": { $ref: "#/components/responses/NotFound" }
  /api/oauth/device/{userCode}/deny:
    parameters:
      - $ref: "#/components/parameters/DeviceUserCode"
    post:
      operationId: denyDeviceAuthorization
      summary: Deny a device authorization
      tags: [Authentication]
      responses:
        "200":
          description: The authorization was denied (no body).
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/oauth/sessions:
    get:
      operationId: listCLISessions
      summary: List my CLI sessions
      description: Active (non-revoked, non-expired) CLI sessions for the authenticated user, newest first.
      tags: [Authentication]
      responses:
        "200":
          description: The caller's CLI sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CLISessionSummary"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/oauth/sessions/{sessionID}:
    parameters:
      - $ref: "#/components/parameters/CLISessionID"
    delete:
      operationId: revokeCLISession
      summary: Revoke a CLI session
      tags: [Authentication]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/organizations:
    get:
      operationId: listOrganizations
      summary: List the caller's organizations
      description: Returns every organization the authenticated user is a member of, each annotated with the caller's role.
      tags: [Organizations]
      responses:
        "200":
          description: The caller's organizations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationDetail"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createOrganization
      summary: Create an organization
      description: >-
        Creates the organization, makes the caller an admin, and provisions a
        first project named "Default Project" beneath it — a starting point, not
        a default: every create names the project it lands in, and nothing
        resolves a project by that name. Organization names are globally unique.
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "200":
          description: The created organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/organizations/all:
    get:
      operationId: listAllOrganizations
      summary: List every organization (system admin)
      description: >-
        System-admin only. Unlike `GET /api/organizations`, results are not
        scoped to the caller's memberships, and `userRole` is always null.
      tags: [Organizations]
      responses:
        "200":
          description: Every organization, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationDetail"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/organizations/{organizationID}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      operationId: getOrganization
      summary: Get an organization
      description: Requires membership. `userRole` is null for a system admin who is not a member.
      tags: [Organizations]
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateOrganization
      summary: Update an organization
      description: Organization admins only. Only `name` and `description` are mutable.
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: The updated organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteOrganization
      summary: Delete an organization
      description: >-
        Organization admins only. Cascades to the organization's folders and
        projects and revokes their role bindings. The seeded "Default
        Organization" cannot be deleted (400).


        Refuses with 409 when any of those projects still contains a VM or
        sandbox. This changed with STR-98: the cascade previously hard-deleted
        those VM rows, leaving guests running on agents with no record of them
        — and, before the same change, an agent tore such a workload down on
        the next sync for being unlisted. Delete or move the workloads first.
      tags: [Organizations]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/organizations/{organizationID}/switch:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    post:
      operationId: switchOrganization
      summary: Switch the caller's current organization
      description: Sets the authenticated user's current organization. Requires membership; system admins may switch to any organization.
      tags: [Organizations]
      responses:
        "200":
          description: The current organization was switched. No response body.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/organizations/{organizationID}/members:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      operationId: listOrganizationMembers
      summary: List organization members
      description: Visible to any member of the organization.
      tags: [Organizations]
      responses:
        "200":
          description: The organization's members and their roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationMember"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: addOrganizationMember
      summary: Add a member to an organization
      description: >-
        Organization admins only. The target user is looked up by email and must
        already exist; adding an existing member returns 409.
        Analyzed against the tier-2 guardrails in force on the node: the
        grant is never refused over one — ceilings subtract at evaluation —
        but every ceiling that narrows it comes back in `ceilings`, naming
        the guardrail, who set it, and which of the role's actions it takes
        back.
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOrganizationMemberRequest"
      responses:
        "201":
          description: The member was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAMGrantWriteResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/organizations/{organizationID}/members/{userID}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/MemberUserID"
    delete:
      operationId: removeOrganizationMember
      summary: Remove a member from an organization
      description: Organization admins only. Removing the last remaining admin is rejected with 400.
      tags: [Organizations]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateOrganizationMemberRole
      summary: Change a member's organization role
      description: >-
        Organization admins only. Demoting the last remaining admin is rejected
        with 400.
        Analyzed against the tier-2 guardrails in force on the node: the
        grant is never refused over one — ceilings subtract at evaluation —
        but every ceiling that narrows it comes back in `ceilings`, naming
        the guardrail, who set it, and which of the role's actions it takes
        back.
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationMemberRoleRequest"
      responses:
        "200":
          description: The role was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAMGrantWriteResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/organizations/{organizationID}/ous:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      operationId: listFolders
      summary: List top-level folders
      description: >-
        Returns only folders with no parent folder, sorted by name. Folders are
        named `OrganizationalUnit` on the wire and in the database; the
        user-facing term is "folder".
      tags: [Folders]
      responses:
        "200":
          description: The organization's top-level folders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FolderDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createFolder
      summary: Create a folder
      description: >-
        Organization admins only. Pass `parentOuId` to nest the folder;
        otherwise it is created at the top level. Names must be unique within
        the parent scope.
      tags: [Folders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "200":
          description: The created folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/organizations/{organizationID}/ous/{ouID}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/FolderID"
    get:
      operationId: getFolder
      summary: Get a folder
      tags: [Folders]
      responses:
        "200":
          description: The folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateFolder
      summary: Update a folder
      description: Organization admins only. Only `name` and `description` are mutable.
      tags: [Folders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFolderRequest"
      responses:
        "200":
          description: The updated folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteFolder
      summary: Delete a folder
      description: >-
        Organization admins only. The folder must be empty: child folders or
        projects beneath it are rejected with 409.
      tags: [Folders]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/organizations/{organizationID}/ous/{ouID}/tree:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/FolderID"
    get:
      operationId: getFolderTree
      summary: Get a folder subtree
      description: Returns the folder and every descendant folder, recursively, with per-folder project counts.
      tags: [Folders]
      responses:
        "200":
          description: The folder subtree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderTreeNode"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/organizations/{organizationID}/ous/{ouID}/move:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/FolderID"
    post:
      operationId: moveFolder
      summary: Move a folder
      description: >-
        Organization admins only. Reparents the folder (a null `newParentOuId`
        moves it to the top level) and rewrites the materialized paths and
        depths of every descendant. Moving a folder into its own descendant is
        rejected with 400.
      tags: [Folders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFolderRequest"
      responses:
        "200":
          description: The moved folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/organizations/{organizationID}/ous/{ouID}/ous:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/FolderID"
    get:
      operationId: listChildFolders
      summary: List a folder's immediate children
      tags: [Folders]
      responses:
        "200":
          description: The folder's direct child folders, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FolderDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createChildFolder
      summary: Create a child folder
      description: >-
        Organization admins only. The parent is taken from the path; any
        `parentOuId` in the body is ignored. Names must be unique within the
        parent.
      tags: [Folders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequest"
      responses:
        "200":
          description: The created child folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/organizations/{organizationID}/ous/{ouID}/members:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/FolderID"
    get:
      operationId: listFolderMembers
      summary: List a folder's user and group role grants
      description: >-
        Requires `iam:readPolicy` on the folder. Folder grants are stored as
        role bindings and nothing else — there is no membership mirror table —
        so `role` is always a role id.
      tags: [Folders]
      responses:
        "200":
          description: The folder's role grants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderMembers"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: grantFolderMember
      summary: Grant a user a role on a folder
      description: >-
        Requires `iam:setPolicy` on the folder. Identify the user by `userID`
        or `userEmail`.
        The grant inherits down every folder, project, and resource beneath
        the folder, and keeps applying to projects added later.
        A principal may hold at most one role per folder; use `PATCH` to
        change it.
        A user outside the folder's organization can be granted a role, but
        only by a caller who also holds `iam:grantExternal` on the folder;
        such cross-org grants are recorded with a distinct
        `iam.cross_org_grant` audit event.
        Analyzed against the tier-2 guardrails in force on the node: the
        grant is never refused over one — ceilings subtract at evaluation —
        but every ceiling that narrows it comes back in `ceilings`, naming
        the guardrail, who set it, and which of the role's actions it takes
        back.
      tags: [Folders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantFolderMemberRequest"
      responses:
        "201":
          description: The role was granted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAMGrantWriteResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/organizations/{organizationID}/ous/{ouID}/members/{userID}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/FolderID"
      - name: userID
        in: path
        required: true
        description: The user's id.
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateFolderMemberRole
      summary: Change a user's role on a folder
      description: >-
        Requires `iam:setPolicy` on the folder. Replaces the user's grant on
        this folder; returns an empty body.
        Changing an organization-external user's role is a new cross-org
        grant: it requires `iam:grantExternal` on the folder and is recorded
        with a distinct `iam.cross_org_grant` audit event.
        Analyzed against the tier-2 guardrails in force on the node: the
        grant is never refused over one — ceilings subtract at evaluation —
        but every ceiling that narrows it comes back in `ceilings`, naming
        the guardrail, who set it, and which of the role's actions it takes
        back.
      tags: [Folders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFolderMemberRoleRequest"
      responses:
        "200":
          description: The role was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAMGrantWriteResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: revokeFolderMember
      summary: Revoke a user's role on a folder
      description: >-
        Requires `iam:setPolicy` on the folder. Revoking an
        organization-external user's grant is recorded with a distinct
        `iam.cross_org_revoke` audit event.
      tags: [Folders]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/organizations/{organizationID}/ous/{ouID}/groups:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/FolderID"
    post:
      operationId: grantFolderGroup
      summary: Grant a group a role on a folder
      description: >-
        Requires `iam:setPolicy` on the folder.
        A group from another organization can be granted a role, but only by
        a caller who also holds `iam:grantExternal` on the folder; such
        cross-org grants are recorded with a distinct `iam.cross_org_grant`
        audit event.
        Analyzed against the tier-2 guardrails in force on the node: the
        grant is never refused over one — ceilings subtract at evaluation —
        but every ceiling that narrows it comes back in `ceilings`, naming
        the guardrail, who set it, and which of the role's actions it takes
        back.
      tags: [Folders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantFolderGroupRequest"
      responses:
        "201":
          description: The role was granted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAMGrantWriteResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/organizations/{organizationID}/ous/{ouID}/groups/{groupID}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/FolderID"
      - $ref: "#/components/parameters/GroupID"
    delete:
      operationId: revokeFolderGroup
      summary: Revoke a group's role on a folder
      description: >-
        Requires `iam:setPolicy` on the folder. Revoking an
        organization-external group's grant is recorded with a distinct
        `iam.cross_org_revoke` audit event.
      tags: [Folders]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/organizations/{organizationID}/groups:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      operationId: listGroups
      summary: List groups
      description: Returns every group in the organization, sorted by name, with member counts.
      tags: [Groups]
      responses:
        "200":
          description: The organization's groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createGroup
      summary: Create a group
      description: Organization admins only. Group names must be unique within the organization.
      tags: [Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "200":
          description: The created group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/organizations/{organizationID}/groups/{groupID}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/GroupID"
    get:
      operationId: getGroup
      summary: Get a group
      tags: [Groups]
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateGroup
      summary: Update a group
      description: Organization admins only. Only `name` and `description` are mutable.
      tags: [Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupRequest"
      responses:
        "200":
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteGroup
      summary: Delete a group
      description: Organization admins only. Memberships are removed along with the group.
      tags: [Groups]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/organizations/{organizationID}/groups/{groupID}/members:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/GroupID"
    get:
      operationId: listGroupMembers
      summary: List group members
      tags: [Groups]
      responses:
        "200":
          description: The group's members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMember"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: addGroupMembers
      summary: Add members to a group
      description: >-
        Organization admins only. Users that are not members of the owning
        organization are skipped rather than failing the request, so a 200 does
        not guarantee every id in `userIds` was added.
      tags: [Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMembershipChangeRequest"
      responses:
        "200":
          description: The membership changes were applied. No response body.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeGroupMembers
      summary: Remove members from a group
      description: Organization admins only. Removals are idempotent — ids that are not members are ignored.
      tags: [Groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMembershipChangeRequest"
      responses:
        "200":
          description: The membership changes were applied. No response body.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/organizations/{organizationID}/groups/{groupID}/members/{userID}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/GroupID"
      - $ref: "#/components/parameters/MemberUserID"
    delete:
      operationId: removeGroupMember
      summary: Remove one member from a group
      description: Organization admins only. Idempotent — removing a non-member still returns 200.
      tags: [Groups]
      responses:
        "200":
          description: The member was removed. No response body.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/organizations/{organizationID}/hierarchy:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      operationId: getOrganizationHierarchy
      summary: Get the full organization hierarchy
      description: >-
        Returns the organization with its folders, projects, VMs, and quotas
        nested as a tree, plus aggregate statistics. Requires membership.
      tags: [Organizations]
      responses:
        "200":
          description: The full hierarchy tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationHierarchy"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/organizations/{organizationID}/resources:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      operationId: listOrganizationResources
      summary: List every resource in an organization
      description: >-
        Flat (not nested) listing of every folder, project, VM, and quota under
        the organization, with rollup counts grouped by environment, status, and
        project.
      tags: [Organizations]
      responses:
        "200":
          description: The organization's resources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResources"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/organizations/{organizationID}/resources/summary:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
    get:
      operationId: getOrganizationResourceSummary
      summary: Get an organization's resource usage and quota compliance
      description: >-
        Usage totals and hierarchy statistics cover the rows the caller may
        read. A quota appears only when the caller holds `quota:read` at the
        org, folder, or project it hangs on: its figures are measured over
        everything beneath that node, so an organization-scoped quota describes
        the whole organization.
      tags: [Organizations]
      responses:
        "200":
          description: Aggregate usage, per-quota compliance, and hierarchy statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationResourceSummary"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/organizations/{organizationID}/search:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/HierarchySearchQuery"
      - $ref: "#/components/parameters/HierarchyEntityTypeQuery"
    get:
      operationId: searchOrganizationHierarchy
      summary: Search within one organization's hierarchy
      tags: [Organizations]
      responses:
        "200":
          description: Matching hierarchy entities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HierarchySearchResults"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/organizations/{organizationID}/path/{entityType}/{entityID}:
    parameters:
      - $ref: "#/components/parameters/OrganizationID"
      - $ref: "#/components/parameters/HierarchyEntityType"
      - $ref: "#/components/parameters/HierarchyEntityID"
    get:
      operationId: getHierarchyEntityPath
      summary: Resolve an entity's breadcrumb path
      description: >-
        Returns the ordered ancestor chain (organization → folders → project →
        resource) for the entity, reduced to the components the caller may read.
        A component the caller cannot read is omitted rather than refused, so a
        project readable inside an unreadable folder comes back directly under
        the organization; a caller who can read none of the chain gets the
        organization alone.
      tags: [Organizations]
      responses:
        "200":
          description: The entity's path components.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityPath"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/hierarchy/search:
    parameters:
      - $ref: "#/components/parameters/HierarchySearchQuery"
      - $ref: "#/components/parameters/HierarchyEntityTypeQuery"
    get:
      operationId: searchHierarchyGlobally
      summary: Search across every organization the caller belongs to
      description: >-
        `organizationId` in the response is always null. A caller with no
        organization memberships receives an empty result set.
      tags: [Organizations]
      responses:
        "200":
          description: Matching hierarchy entities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HierarchySearchResults"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/hierarchy/validate:
    get:
      operationId: validateHierarchy
      summary: Report hierarchy integrity issues
      description: >-
        System-admin only. Scans every organization for materialized `path` /
        `depth` values that disagree with the relational parent chain, for
        parent cycles, and for folders and projects whose parent row is
        missing. The relational links are the source of truth; the paths are
        the derived copy that can drift.
      tags: [Organizations]
      responses:
        "200":
          description: The validation report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HierarchyValidationReport"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/hierarchy/repair:
    post:
      operationId: repairHierarchy
      summary: Repair hierarchy integrity issues
      description: >-
        System-admin only. Applies the requested repairs and reports what was
        fixed and what remains. Only `repairOptions.rebuildPaths` does anything
        today: it rewrites the drifted `path` / `depth` of the folders and
        projects `validate` reports as `broken_path`.
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HierarchyRepairRequest"
      responses:
        "200":
          description: The repair report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HierarchyRepairReport"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/projects:
    get:
      operationId: listProjects
      summary: List the caller's projects
      description: >-
        Every project in the organizations the caller belongs to, including
        projects nested under folders (organizational units), sorted by name.
      tags: [Projects]
      responses:
        "200":
          description: The caller's projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSummary"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/projects/{projectID}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: getProject
      summary: Get a project
      description: Includes the project's resource quotas alongside its VM count.
      tags: [Projects]
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateProject
      summary: Update a project
      description: >-
        Requires project admin. Removing an environment that VMs or sandboxes
        still use is rejected with `409`.
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
