openapi: 3.0.3
info:
  title: Strato Control Plane API
  version: 1.0.0
  license:
    name: FSL-1.1-MIT
    url: https://github.com/samcat116/strato/blob/main/LICENSE
  description: |
    The Strato control plane owns the JSON API, database, scheduler, and
    authorization for the Strato private cloud platform. This document is the
    spec-first source of truth for that API (swift-openapi-generator, issue
    #557).

    ## Authentication

    Every operation requires authentication unless it declares `security: []`.
    Two schemes are accepted interchangeably:

    - `bearerAuth` — an API key (`Authorization: Bearer <key>`) minted via
      `POST /api/api-keys`. A key acts *on behalf of* its owner and may carry a
      **restriction** — an action list and an optional subtree — so its
      effective permission is the owner's role bindings intersected with it.
      The intersection is evaluated by the same Cedar evaluator that decides
      every other request, so a restriction refusal is an ordinary logged
      decision and organization guardrails ceiling credentials for free. The
      same header also accepts a **SPIFFE JWT-SVID**, when the deployment
      enables it, authenticating a registered service account or workload
      rather than a user (see below).
    - `cookieAuth` — the `vapor-session` cookie set after a WebAuthn/passkey
      login.

    ### Workload credentials (JWT-SVID)

    Where enabled (`SPIFFE_JWT_SVID_AUTH_ENABLED`), a registered workload may
    present a short-lived SPIFFE JWT-SVID on the same `Authorization: Bearer`
    header. The token must be signed by the trust domain's current JWT
    authorities and name this control plane in its `aud` claim; its `sub`
    SPIFFE ID is looked up in the workload registry, and access is decided by
    the resulting principal's role bindings. No claim in the token grants
    anything.

    Two classes of endpoint remain user-only and answer `403` for a workload
    credential: the self-scoped identity plane (`/api/api-keys`,
    `/api/users/me`, `/api/oauth`) and the asynchronous mutation endpoints,
    whose operation records name a user as the initiator.

    Per-object access is additionally enforced by the control plane's Cedar
    policy evaluator; a caller who is authenticated but not authorized
    receives `403`.

    ## Asynchronous mutations

    VM, sandbox, volume and snapshot lifecycle mutations
    (create/start/stop/restart/delete, VM pause/resume, snapshot capture and
    delete, snapshot export) are **asynchronous**: they persist a desired-state
    change and return `202 Accepted`.

    Most of them — everything with a generation to converge on — answer with
    `{resource, targetGeneration, mutationId}`. Refetch the resource and read
    its `conditions`: done is `converged` with
    `observedGeneration >= targetGeneration`; failed is
    `degraded.sinceGeneration == targetGeneration`, carrying the agent's
    reason. The two are **mutually exclusive** — a failure recorded at the
    target generation makes `converged` false — so exactly one of them ever
    answers and you never have to break a tie. Overlapping mutations are accepted rather than refused — desired
    state is level-triggered, so the last write wins and the agent converges on
    it. They are serialized on the resource, so each one's change is applied on
    top of the last rather than overwriting it with a stale snapshot: if you
    issue `stop` while a `pause` is in flight, both are recorded and the stop's
    `targetGeneration` is the higher one.

    **Deletion** is the one case where the resource cannot answer for itself:
    once the row is removed, polling it returns a `404` indistinguishable from
    never-existed and not-authorized. Poll
    `GET /api/operations/{operationID}` with the delete's `mutationId`
    instead; it reports `succeeded` from the record the deletion left behind.

    Image mutations are synchronous at the API layer: they return the
    resource immediately (often in a transitional `status` such as `pending` or
    `creating`) and converge in the background.

    ## Errors

    Errors use Vapor's standard envelope: a JSON object with a boolean `error`
    flag and a human-readable `reason` (see the `Error` schema).

    ## Out of scope

    The agent control channel under `/agent/` is intentionally **not** modeled
    as OpenAPI operations: it is authenticated by SPIFFE SVID over the Envoy
    mTLS listener rather than by session or API key, and its consumers are
    agents built from `shared/`, not clients generated from this spec.
    WebSocket endpoints are likewise out of scope — OpenAPI 3.0 cannot express
    an upgrade. Both are documented here as prose:

    - `GET /agent/ws` — agent reconciliation channel (SPIFFE mTLS).
    - `GET /agent/desired-state` — the desired-state long-poll (SPIFFE mTLS).
      Returns `200` with a `MessageEnvelope` wrapping a `DesiredStateMessage`
      and an `ETag`, or `304` when the agent's `If-None-Match` still matches
      after the server's hold window. See `docs/architecture/wire-protocol.md`.
    - `POST /agent/vms/{vmID}/jwt-svid` — placement-checked guest JWT-SVID
      issuance for the hosting agent (SPIFFE mTLS).
    - `GET /api/vms/{vmID}/console` — VM serial console (WebSocket).
    - `POST /api/vms/{vmID}/console/vnc` + `GET
      /api/vms/{vmID}/console/vnc/{sessionID}/attach` — VM graphics console
      (WebSocket attach). The POST mints a single-use session and returns
      `{ sessionId, websocketPath, expiresAt }`; the attach relays RFB as
      binary frames after one `{"type":"ready"}` text frame. Listed here with
      its WebSocket half because the two are one exchange — the POST exists
      only to give the upgrade's pre-flight failures real status codes.
    - `POST /api/sandboxes/{sandboxID}/exec` + `GET
      /api/sandboxes/{sandboxID}/exec/{sessionID}/attach` — sandbox exec
      (WebSocket attach).

    Everything else the control plane serves is described here. A route-drift
    test (`AppPlatformTests/OpenAPISpecDriftTests`) boots the app and enforces
    both directions — no registered route may go undocumented, and no operation
    may describe a route that does not exist.

    ## The SCIM data plane

    The SCIM 2.0 surface under `/organizations/{organizationID}/scim/v2` is
    registered in Vapor as a catch-all and dispatched internally by
    SwiftSCIM's request processor. This document describes the concrete
    resource endpoints that processor actually serves (`/Users`, `/Groups`,
    `/ServiceProviderConfig`, `/ResourceTypes`, `/Schemas`) rather than the
    catch-all, so generated clients can call them; the drift test understands
    the catch-all registration and matches these operations against it.

    SCIM requests authenticate with an org-scoped `scim_` bearer token
    (`scimBearerAuth`), never a user session, and use the RFC 7644 error
    format rather than the platform `Error` envelope.
servers:
  - url: /
    description: Same origin as the control plane

tags:
  - name: Health
    description: Liveness and readiness probes.
  - name: Documentation
    description: The served OpenAPI document and its viewer.
  - name: Virtual Machines
    description: >-
      VM lifecycle. Mutations are asynchronous (202 + a generation to converge
      on).
  - name: Operations
    description: >-
      A read-only view of asynchronous resource mutations, synthesized from the
      mutation's audit record and the resource's conditions. The supported way
      to follow a **delete**; for everything else, refetch the resource.
  - name: Sandboxes
    description: OCI-image Firecracker microVMs. Mutations are asynchronous.
  - name: Sandbox Snapshots
    description: Sandbox checkpoint/restore.
  - name: VM Snapshots
    description: >-
      Full-VM checkpoints: guest memory, device state, and disks captured at one
      instant. Distinct from volume snapshots, which are disk-only.
  - name: Images
    description: VM/sandbox base images and their per-hypervisor artifacts.
  - name: Volumes
    description: Persistent block volumes and their snapshots.
  - name: Networks
    description: Logical (SDN) networks.
  - name: Floating IPs
    description: External address pools and VM NIC attachments.
  - name: DNS
    description: >-
      Internal name resolution: project-owned zones, their attachment to
      logical networks, and user-authored records. A zone's effective contents
      are derived (VM hostname → allocated addresses, plus PTR) ∪ authored,
      assembled on demand and never stored.
  - name: Logs
    description: Loki-backed VM console and sandbox workload log queries.
  - name: Users
    description: User accounts and their passkey credentials.
  - name: Authentication
    description: WebAuthn/passkey login, account claim, and OAuth device flow.
  - name: API Keys
    description: Programmatic credentials, optionally restricted to an action set or a subtree.
  - name: Organizations
    description: Top-level tenants and their memberships.
  - name: Folders
    description: >-
      Nested containers between an organization and its projects. Named
      `OrganizationalUnit` (`ous`) on the wire; the wire rename lands with the
      Cedar cutover.
  - name: Groups
    description: Named sets of users, optionally SCIM-provisioned, used to grant access.
  - name: Projects
    description: Project CRUD, members, group grants, and registry pull secrets.
  - name: Quotas
    description: Resource quotas attached at organization, folder, or project level.
  - name: Agents
    description: Hypervisor node registration, enrollment, and fleet actions.
  - name: Sites
    description: Physical or logical groupings of agents.
  - name: Workload Identity
    description: SPIFFE/SPIRE registration entries, trust bundles, and federation.
  - name: Service Accounts
    description: >-
      Machine principals (issue #491): project-scoped service accounts and the
      workload registry mapping SPIFFE identities to registered principals.
  - name: IAM
    description: >-
      Canonical action checks, guardrails, and decision logs.
  - name: Audit
    description: Audit event history.
  - name: OIDC
    description: Per-organization OIDC identity providers and the login flow.
  - name: SCIM
    description: SCIM 2.0 user/group provisioning and its org-scoped tokens.
  - name: Shared Signals
    description: >-
      Shared Signals Framework (SSF) streams and the RFC 8935 push-delivery
      receiver.
  - name: Webhooks
    description: >-
      User-managed webhook subscriptions to typed platform events, with
      signed, outbox-backed delivery and per-subscription delivery history.

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /health:
    get:
      operationId: health
      summary: Health check
      description: Overall control-plane health, including build identity.
      tags: [Health]
      security: []
      responses:
        "200":
          description: The service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/ready:
    get:
      operationId: readiness
      summary: Readiness probe
      description: Whether the service is ready to accept traffic (dependencies reachable).
      tags: [Health]
      security: []
      responses:
        "200":
          description: The service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: The service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/live:
    get:
      operationId: liveness
      summary: Liveness probe
      description: Whether the process is alive.
      tags: [Health]
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/openapi.yaml:
    get:
      operationId: openapiDocument
      summary: This OpenAPI document
      description: Serves this specification as YAML.
      tags: [Documentation]
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string
  /api/docs:
    get:
      operationId: apiDocsViewer
      summary: API documentation viewer
      description: An HTML page that renders this specification with Swagger UI.
      tags: [Documentation]
      security: []
      responses:
        "200":
          description: The documentation viewer page.
          content:
            text/html:
              schema:
                type: string

  /api/vms:
    get:
      operationId: listVMs
      summary: List virtual machines
      description: >-
        Returns a page of the VMs the caller can read, newest first, optionally
        scoped to one organization.
      tags: [Virtual Machines]
      parameters:
        - $ref: "#/components/parameters/OrganizationIdQuery"
        - $ref: "#/components/parameters/ListLimitQuery"
        - $ref: "#/components/parameters/ListOffsetQuery"
      responses:
        "200":
          description: A page of the visible virtual machines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMListPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createVM
      summary: Create a virtual machine
      description: >-
        Records the VM and returns it with the generation it is converging on;
        refetch it until its `conditions` report `converged`.
        `networkId`/`networkName` and `securityGroupIds` are
        resolved within the VM's own project: one naming something outside it
        is reported as `404`, not as a distinct cross-project refusal, since
        ids are opaque and names are per-project — confirming that one exists
        elsewhere would disclose another tenant's resources.
      tags: [Virtual Machines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVMRequest"
      responses:
        "202": { $ref: "#/components/responses/AcceptedVMMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/vms/{vmID}:
    parameters:
      - $ref: "#/components/parameters/VMID"
    get:
      operationId: getVM
      summary: Get a virtual machine
      tags: [Virtual Machines]
      responses:
        "200":
          description: The virtual machine.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateVM
      summary: Update a virtual machine
      description: >-
        Updates `name`/`description`, and `cpu`/`memory` (issue #568). vCPU
        growth and memory changes on a *running* VM are applied online within
        the `maxCpu`/`maxMemory` ceilings it was started with and answer `202`
        with a `resize` operation. A vCPU shrink from confirmed live sizing is
        rejected because live vCPU unplug is not supported. A smaller target may
        supersede a pending growth request; the agent refuses convergence if the
        live count has already grown past it. A sizing change to a stopped VM
        (which may also raise those ceilings, since the next boot re-spawns the
        VM) and a metadata-only update answer `200`.
      tags: [Virtual Machines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVMRequest"
      responses:
        "200":
          description: The updated virtual machine.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMDetail"
        "202": { $ref: "#/components/responses/AcceptedVMMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: >-
            The requested size exceeds the ceilings the running VM was started
            with, its agent is too old to resize online, or the request would
            reduce a running VM's confirmed live vCPU count. Stop the VM before
            reducing vCPUs; otherwise restart it to raise its online-resize ceiling.
    delete:
      operationId: deleteVM
      summary: Delete a virtual machine
      description: >-
        Sets desired state to absent. The row survives until every finalizer
        clears, so poll `GET /api/operations/{operationID}` with the returned
        `mutationId` rather than the VM: once the VM is gone, a `404` on it is
        indistinguishable from never-existed and not-authorized.
      tags: [Virtual Machines]
      responses:
        "202": { $ref: "#/components/responses/AcceptedVMMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/vms/{vmID}/start:
    parameters:
      - $ref: "#/components/parameters/VMID"
    post:
      operationId: startVM
      summary: Start a virtual machine
      tags: [Virtual Machines]
      responses:
        "202": { $ref: "#/components/responses/AcceptedVMMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/vms/{vmID}/interfaces:
    parameters:
      - $ref: "#/components/parameters/VMID"
    get:
      operationId: listVMNetworkInterfaces
      summary: List a virtual machine's network interfaces
      tags: [Virtual Machines]
      responses:
        "200":
          description: Interfaces ordered by their stable slot.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NetworkInterface"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: attachVMNetworkInterface
      summary: Attach a network interface to a virtual machine
      description: >-
        QEMU only. The VM retains at most eight interface rows, including
        pending and failed operations. The returned operation settles after
        the agent reports the interface in its durable manifest.
      tags: [Virtual Machines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVMNetworkInterfaceRequest"
      responses:
        "202": { $ref: "#/components/responses/AcceptedVMMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/vms/{vmID}/interfaces/{interfaceID}:
    parameters:
      - $ref: "#/components/parameters/VMID"
      - $ref: "#/components/parameters/InterfaceID"
    delete:
      operationId: detachVMNetworkInterface
      summary: Detach a network interface from a virtual machine
      description: >-
        The interface, its addresses, security groups, and floating IP remain
        visible until a settled agent report confirms that it is absent.
      tags: [Virtual Machines]
      responses:
        "202": { $ref: "#/components/responses/AcceptedVMMutation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/vms/{vmID}/interfaces/{interfaceID}/retry:
    parameters:
      - $ref: "#/components/parameters/VMID"
      - $ref: "#/components/parameters/InterfaceID"
    post:
      operationId: retryVMNetworkInterfaceMutation
      summary: Retry a failed network-interface mutation
      tags: [Virtual Machines]
      responses:
        "202": { $ref: "#/components/responses/AcceptedVMMutation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/vms/{vmID}/stop:
    parameters:
      - $ref: "#/components/parameters/VMID"
    post:
      operationId: stopVM
      summary: Stop a virtual machine
      tags: [Virtual Machines]
      responses:
        "202": { $ref: "#/components/responses/AcceptedVMMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/vms/{vmID}/restart:
    parameters:
      - $ref: "#/components/parameters/VMID"
    post:
      operationId: restartVM
      summary: Restart a virtual machine
      description: >-
        Restarts the guest in place. A reboot starts and ends `running`, so it
        rides the desired-state sync as a monotonic nonce the agent applies once
        rather than as a command — a dropped connection costs latency, not the
        restart. Asynchronous — refetch the VM.
      tags: [Virtual Machines]
      responses:
        "202": { $ref: "#/components/responses/AcceptedVMMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/vms/{vmID}/pause:
    parameters:
      - $ref: "#/components/parameters/VMID"
    post:
      operationId: pauseVM
      summary: Pause a virtual machine
      tags: [Virtual Machines]
      responses:
        "202": { $ref: "#/components/responses/AcceptedVMMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/vms/{vmID}/resume:
    parameters:
      - $ref: "#/components/parameters/VMID"
    post:
      operationId: resumeVM
      summary: Resume a paused virtual machine
      tags: [Virtual Machines]
      responses:
        "202": { $ref: "#/components/responses/AcceptedVMMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/vms/{vmID}/status:
    parameters:
      - $ref: "#/components/parameters/VMID"
    get:
      operationId: getVMStatus
      summary: Get a virtual machine's observed status
      description: Returns the last observed state from the database (no agent round-trip).
      tags: [Virtual Machines]
      responses:
        "200":
          description: The virtual machine.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMDetail"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/vms/{vmID}/operations:
    parameters:
      - $ref: "#/components/parameters/VMID"
      - $ref: "#/components/parameters/LimitQuery"
    get:
      operationId: listVMOperations
      summary: List a virtual machine's operations
      description: Newest first.
      tags: [Virtual Machines]
      responses:
        "200":
          description: The virtual machine's operations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceOperation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/vms/{vmID}/snapshots:
    parameters:
      - $ref: "#/components/parameters/VMID"
    get:
      operationId: listVMSnapshots
      summary: List a virtual machine's checkpoints
      tags: [VM Snapshots]
      parameters:
        - $ref: "#/components/parameters/ListLimitQuery"
        - $ref: "#/components/parameters/ListOffsetQuery"
      responses:
        "200":
          description: A page of the VM's checkpoints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMSnapshotListPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createVMSnapshot
      summary: Checkpoint a virtual machine
      description: >-
        Captures guest memory, device state, and disks at one instant. The VM
        must be running or paused, and keeps running. The request body is
        optional. Asynchronous — refetch the checkpoint until its `conditions`
        converge.
      tags: [VM Snapshots]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVMSnapshotRequest"
      responses:
        "202": { $ref: "#/components/responses/AcceptedVMSnapshotMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/vms/{vmID}/snapshots/{snapshotID}:
    parameters:
      - $ref: "#/components/parameters/VMID"
      - $ref: "#/components/parameters/VMSnapshotID"
    delete:
      operationId: deleteVMSnapshot
      summary: Delete a virtual machine checkpoint
      description: >-
        Asynchronous. The record survives until the owning agent confirms the
        checkpoint's bytes are gone, so poll
        `GET /api/operations/{mutationId}` — a delete's success is the
        checkpoint's absence, which a `404` on the checkpoint itself cannot
        distinguish from never-existed.
      tags: [VM Snapshots]
      responses:
        "202": { $ref: "#/components/responses/AcceptedVMSnapshotMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/vms/{vmID}/snapshots/{snapshotID}/restore:
    parameters:
      - $ref: "#/components/parameters/VMID"
      - $ref: "#/components/parameters/VMSnapshotID"
    post:
      operationId: restoreVMSnapshot
      summary: Restore a virtual machine from a checkpoint
      description: >-
        Loads the captured memory and device state back into the VM and resumes
        it. The checkpoint lives inside the VM's disks, so this only works on
        the agent that took it. Asynchronous — refetch the VM and read its
        `conditions`.
      tags: [VM Snapshots]
      responses:
        "202": { $ref: "#/components/responses/AcceptedVMMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/operations/{operationID}:
    parameters:
      - $ref: "#/components/parameters/OperationID"
    get:
      operationId: getOperation
      summary: Get an operation
      description: >-
        Poll this until `status` is terminal (`succeeded` or `failed`). Answers
        for the `mutationId` any `202` returned.
      tags: [Operations]
      responses:
        "200":
          description: The operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceOperation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

