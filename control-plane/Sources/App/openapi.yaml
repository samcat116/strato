    QuotaComplianceDetail:
      type: object
      required: [used, limit, percentage]
      properties:
        used:
          type: integer
        limit:
          type: integer
        percentage:
          type: number
          format: double

    HierarchySearchResults:
      type: object
      required: [query, results, totalResults]
      properties:
        query:
          type: string
        organizationId:
          type: string
          format: uuid
          nullable: true
          description: The organization searched, or null for a global search.
        results:
          type: array
          items:
            $ref: "#/components/schemas/HierarchySearchResult"
        totalResults:
          type: integer

    HierarchySearchResult:
      type: object
      required: [id, name, type, path, description]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        path:
          type: string
        description:
          type: string
        parentId:
          type: string
          format: uuid
          nullable: true
        parentType:
          type: string
          nullable: true

    EntityPath:
      type: object
      required: [entityId, entityType, organizationId, pathComponents]
      properties:
        entityId:
          type: string
          format: uuid
        entityType:
          type: string
        organizationId:
          type: string
          format: uuid
        pathComponents:
          type: array
          description: Ordered ancestors, outermost first.
          items:
            $ref: "#/components/schemas/EntityPathComponent"

    EntityPathComponent:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string

    HierarchyValidationReport:
      type: object
      required: [isValid, issues, summary]
      properties:
        isValid:
          type: boolean
        issues:
          type: array
          items:
            $ref: "#/components/schemas/HierarchyIssue"
        summary:
          type: object
          required: [totalIssues, criticalIssues, warningIssues, infoIssues]
          properties:
            totalIssues:
              type: integer
            criticalIssues:
              type: integer
            warningIssues:
              type: integer
            infoIssues:
              type: integer

    HierarchyIssue:
      type: object
      required: [id, type, severity, entityType, entityId, entityName, description, autoRepairable]
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The id of the entity the issue is about. An entity carries at most
            one issue, so this is stable across calls and can be replayed into
            `HierarchyRepairRequest.specificIssues`.
        type:
          type: string
          enum: [circular_reference, broken_path, orphaned_resource, quota_violation]
        severity:
          type: string
          enum: [critical, warning, info]
        entityType:
          type: string
          enum: [ou, project, vm, quota]
        entityId:
          type: string
          format: uuid
        entityName:
          type: string
        description:
          type: string
        suggestedFix:
          type: string
          nullable: true
        autoRepairable:
          type: boolean

    HierarchyRepairRequest:
      type: object
      description: Every field is optional and defaults to off, so one repair can be requested on its own.
      properties:
        repairAll:
          type: boolean
          description: Repair every issue the scan finds. Defaults to false; omit it and name `specificIssues` instead.
        specificIssues:
          type: array
          nullable: true
          description: Issue ids to repair when `repairAll` is false.
          items:
            type: string
            format: uuid
        repairOptions:
          type: object
          description: Which repairs to apply. Every option defaults to false, so an omitted one is not attempted.
          properties:
            fixCircularReferences:
              type: boolean
              description: Not implemented; a cycle is reported but never repaired. Defaults to false.
            rebuildPaths:
              type: boolean
              description: >-
                Rewrite the drifted `path` / `depth` of folders and projects
                reported as `broken_path`. Defaults to false.
            removeOrphanedResources:
              type: boolean
              description: Not implemented. Defaults to false.
            adjustQuotas:
              type: boolean
              description: Not implemented. Defaults to false.
            createMissingDefaults:
              type: boolean
              description: Not implemented. Defaults to false.

    HierarchyRepairReport:
      type: object
      required: [success, repairedIssues, remainingIssues, summary]
      properties:
        success:
          type: boolean
          description: >-
            True when the tree carries no issues at all afterwards — not merely
            that the requested repairs applied. A request that asked for nothing,
            or one that leaves an unrepairable issue such as a parent cycle
            standing, reports false with the detail in `remainingIssues`.
        repairedIssues:
          type: array
          items:
            type: object
            required: [issueId, issueType, action, details]
            properties:
              issueId:
                type: string
                format: uuid
              issueType:
                type: string
              action:
                type: string
              details:
                type: string
        remainingIssues:
          type: array
          items:
            $ref: "#/components/schemas/HierarchyIssue"
        summary:
          type: string
    ProjectSummary:
      type: object
      description: >-
        A project in the organization hierarchy. Exactly one of
        `organizationId` / `organizationalUnitId` is set, naming the immediate
        parent.
      required: [id, name, description, path, defaultEnvironment, environments]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        organizationId:
          type: string
          format: uuid
          nullable: true
          description: Set when the project hangs directly off an organization.
        organizationalUnitId:
          type: string
          format: uuid
          nullable: true
          description: Set when the project hangs off a folder (organizational unit).
        path:
          type: string
          description: Materialized hierarchy path.
        defaultEnvironment:
          type: string
        environments:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        vmCount:
          type: integer
          nullable: true

    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/ProjectSummary"
        - type: object
          description: A project, optionally with its attached resource quotas.
          properties:
            quotas:
              type: array
              nullable: true
              description: Present on single-project reads; omitted from list responses.
              items:
                $ref: "#/components/schemas/ResourceQuota"

    CreateProjectRequest:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string
        organizationalUnitId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Must be omitted when creating directly in an organization; the
            folder-scoped endpoint takes the folder from the path.
        defaultEnvironment:
          type: string
          description: Defaults to `development`; must appear in `environments`.
        environments:
          type: array
          description: Defaults to the standard environment set.
          items:
            type: string

    UpdateProjectRequest:
      type: object
      description: Every field is optional; omitted fields are left unchanged.
      properties:
        name:
          type: string
        description:
          type: string
        defaultEnvironment:
          type: string
        environments:
          type: array
          items:
            type: string

    TransferProjectRequest:
      type: object
      description: >-
        The destination. Supply `organizationalUnitId` to move into a folder, or
        `organizationId` to move directly under an organization.
      properties:
        organizationId:
          type: string
          format: uuid
          nullable: true
        organizationalUnitId:
          type: string
          format: uuid
          nullable: true

    ProjectEnvironmentRequest:
      type: object
      required: [environment]
      properties:
        environment:
          type: string

    ProjectStats:
      type: object
      required: [totalVMs, vmsByEnvironment, resourceUsage]
      properties:
        totalVMs:
          type: integer
        vmsByEnvironment:
          type: object
          additionalProperties:
            type: integer
        resourceUsage:
          $ref: "#/components/schemas/ProjectResourceUsage"

    ProjectResourceUsage:
      type: object
      description: Aggregate resources consumed by the project's VMs.
      required: [totalVCPUs, totalMemoryGB, totalStorageGB, totalVMs]
      properties:
        totalVCPUs:
          type: integer
        totalMemoryGB:
          type: number
          format: double
        totalStorageGB:
          type: number
          format: double
        totalVMs:
          type: integer

    ProjectPath:
      type: object
      required: [projectId, path, components]
      properties:
        projectId:
          type: string
          format: uuid
        path:
          type: string
        components:
          type: array
          items:
            $ref: "#/components/schemas/ProjectPathComponent"

    ProjectPathComponent:
      type: object
      description: One named ancestor (or the project itself) in the hierarchy path.
      required: [id, name, type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [organization, organizational_unit, project]

    ProjectMembers:
      type: object
      description: A project's user role grants and group role grants.
      required: [users, groups]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/ProjectGroupGrant"

    ProjectMember:
      type: object
      required: [username, displayName, email, role, roleDisplayName, external]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
        role:
          type: string
          format: uuid
          description: The role's canonical `iam_roles` id.
        roleDisplayName:
          type: string
          description: The role's display name.
        joinedAt:
          type: string
          format: date-time
        external:
          type: boolean
          description: >-
            The user is not a member of the project's organization — a
            cross-org grant, which UIs should render prominently.

    ProjectGroupGrant:
      type: object
      required: [name, role, roleDisplayName, external]
      properties:
        groupId:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          format: uuid
          description: The role's canonical `iam_roles` id.
        roleDisplayName:
          type: string
          description: The role's display name.
        grantedAt:
          type: string
          format: date-time
        external:
          type: boolean
          description: >-
            The group belongs to another organization — a cross-org grant,
            which UIs should render prominently.

    ProjectMemberRoleInput:
      type: string
      format: uuid
      description: >-
        The canonical id of a role returned by
        `GET /api/iam/roles/bindable` for the project.

    GrantProjectMemberRequest:
      type: object
      description: Identify the user by `userID` or `userEmail`; supply exactly one.
      required: [role]
      properties:
        userEmail:
          type: string
        userID:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ProjectMemberRoleInput"

    UpdateProjectMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/ProjectMemberRoleInput"

    GrantProjectGroupRequest:
      type: object
      required: [groupID, role]
      properties:
        groupID:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ProjectMemberRoleInput"

    SeededRoleName:
      type: string
      description: A seeded IAM role. Each role implies the ones below it.
      enum: [viewer, operator, editor, admin]

    ServiceAccount:
      type: object
      description: >-
        A project-scoped machine principal (issue #491). Workloads
        authenticate as it via registered SPIFFE identities; its access is
        exactly its role bindings.
      required: [id, name, description, projectId, projectRoles]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        projectId:
          type: string
          format: uuid
        projectRoles:
          type: array
          description: >-
            The seeded roles the account holds on its project (normally zero
            or one). Custom-role bindings are omitted here; the who-can API
            reports them.
          items:
            $ref: "#/components/schemas/SeededRoleName"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateServiceAccountRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Unique within the project. 1-128 characters.
        description:
          type: string

    UpdateServiceAccountRequest:
      type: object
      properties:
        description:
          type: string

    SetSeededRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/SeededRoleName"

    WorkloadRegistration:
      type: object
      description: >-
        One workload-registry row: a SPIFFE identity and the principal it
        names. The SPIFFE ID is a lookup key only — nothing is ever parsed
        out of an SVID.
      required: [id, spiffeId, kind]
      properties:
        id:
          type: string
          format: uuid
        spiffeId:
          type: string
          description: The full SPIFFE URI, unique across the registry.
        kind:
          type: string
          enum: [agent, service_account, workload]
        agentName:
          type: string
          description: For `agent` registrations, the agent's name.
        serviceAccountId:
          type: string
          format: uuid
          description: For `service_account` registrations, the account.
        organizationId:
          type: string
          format: uuid
          description: >-
            For `workload` registrations, the organization the registration
            is scoped to (administrative scoping only — it grants nothing).
        vmId:
          type: string
          format: uuid
          description: >-
            For a VM's instance-identity registration, the VM it names. The row
            is created with the VM and cascade-deleted with it. Absent on every
            agent and service-account registration.
        displayName:
          type: string
          description: >-
            Operator-facing label. For a VM's instance identity this is the VM's
            **current** name, read from the VM rather than stored, so it cannot
            show a name a rename has already invalidated.
        createdAt:
          type: string
          format: date-time

    WorkloadRegistrationListPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkloadRegistration"
        total:
          type: integer
          description: Total matching items, ignoring `limit`/`offset`.
        limit:
          type: integer
        offset:
          type: integer

    CreateServiceAccountRegistrationRequest:
      type: object
      required: [spiffeId]
      properties:
        spiffeId:
          type: string
          description: A SPIFFE URI (`spiffe://<trust-domain>/<path>`).

    CreateWorkloadRegistrationRequest:
      type: object
      required: [spiffeId, organizationId]
      properties:
        spiffeId:
          type: string
          description: A SPIFFE URI (`spiffe://<trust-domain>/<path>`).
        organizationId:
          type: string
          format: uuid
        displayName:
          type: string

    RegistryPullSecret:
      type: object
      description: >-
        A project's credential for a private OCI registry. The secret value is
        write-only and never appears in a response.
      required: [registry, username]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        registry:
          type: string
          description: Normalized registry host, e.g. `ghcr.io`.
        username:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateRegistryPullSecretRequest:
      type: object
      required: [registry, username, secret]
      properties:
        registry:
          type: string
          description: Registry host, e.g. `ghcr.io`. Normalized before storage.
        username:
          type: string
        secret:
          type: string
          description: Write-only; encrypted at rest.

    UpdateRegistryPullSecretRequest:
      type: object
      description: Omitted fields keep their stored value.
      properties:
        username:
          type: string
        secret:
          type: string
          description: Write-only replacement secret.

    ResourceQuota:
      type: object
      description: >-
        A resource limit attached at one level of the hierarchy. `entityType` /
        `entityId` name the scope; `environment` narrows a project quota to one
        deployment environment.
      required: [name, entityType, entityId, isEnabled, limits, usage, utilization]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        entityType:
          type: string
          description: >-
            The scope the quota attaches to. `unknown` indicates a scopeless
            (corrupt) row, which only system admins may read or mutate.
          enum: [organization, ou, project, unknown]
        entityId:
          type: string
          format: uuid
        environment:
          type: string
          nullable: true
        isEnabled:
          type: boolean
        limits:
          $ref: "#/components/schemas/ResourceQuotaLimits"
        usage:
          $ref: "#/components/schemas/ResourceQuotaUsage"
        utilization:
          $ref: "#/components/schemas/ResourceQuotaUtilization"
        createdAt:
          type: string
          format: date-time

    ResourceQuotaLimits:
      type: object
      required: [maxVCPUs, maxMemoryGB, maxStorageGB, maxVMs, maxSandboxes, maxNetworks]
      properties:
        maxVCPUs:
          type: integer
        maxMemoryGB:
          type: number
          format: double
        maxStorageGB:
          type: number
          format: double
        maxVMs:
          type: integer
        maxSandboxes:
          type: integer
        maxVolumes:
          type: integer
          nullable: true
          description: >-
            Volume count limit. Null means no count limit — unlike the VM and
            sandbox limits, this one is optional, because `maxStorageGB` is the
            ceiling that protects the host.
        maxNetworks:
          type: integer
          description: >-
            Project-wide network count limit. It is not applied when this quota
            has an environment.

    ResourceQuotaUsage:
      type: object
      description: Reservations the control plane holds against the quota.
      required: [reservedVCPUs, reservedMemoryGB, reservedStorageGB, vmCount, sandboxCount, networkCount]
      properties:
        reservedVCPUs:
          type: integer
        reservedMemoryGB:
          type: number
          format: double
        reservedStorageGB:
          type: number
          format: double
        vmCount:
          type: integer
        sandboxCount:
          type: integer
        volumeCount:
          type: integer
        networkCount:
          type: integer
          description: >-
            Project-wide logical networks in scope. Always zero for an
            environment-scoped quota.

    ResourceQuotaUtilization:
      type: object
      description: Reserved amounts as a percentage of each limit.
      required: [cpuPercent, memoryPercent, storagePercent, vmPercent, sandboxPercent]
      properties:
        cpuPercent:
          type: number
          format: double
        memoryPercent:
          type: number
          format: double
        storagePercent:
          type: number
          format: double
        vmPercent:
          type: number
          format: double
        sandboxPercent:
          type: number
          format: double
        volumePercent:
          type: number
          format: double
          nullable: true
          description: Null when no volume count limit is set.

    CreateResourceQuotaRequest:
      type: object
      required: [name, maxVCPUs, maxMemoryGB, maxStorageGB, maxVMs]
      properties:
        name:
          type: string
        maxVCPUs:
          type: integer
        maxMemoryGB:
          type: number
          format: double
        maxStorageGB:
          type: number
          format: double
        maxVMs:
          type: integer
        maxSandboxes:
          type: integer
          description: Defaults to `maxVMs` when omitted.
        maxVolumes:
          type: integer
          description: >-
            Volume count limit. Omitted means **no** count limit, not a default
            borrowed from `maxVMs`.
        maxNetworks:
          type: integer
          description: >-
            Defaults to 10. Must be omitted when `environment` is set because
            logical networks are project-wide.
        environment:
          type: string
          description: >-
            Project quotas only — narrows the quota to one of the project's
            deployment environments.
        isEnabled:
          type: boolean
          description: Defaults to true.

    UpdateResourceQuotaRequest:
      type: object
      description: >-
        Every field is optional. A limit below the current reservation or count
        is rejected.
      properties:
        name:
          type: string
        maxVCPUs:
          type: integer
        maxMemoryGB:
          type: number
          format: double
        maxStorageGB:
          type: number
          format: double
        maxVMs:
          type: integer
        maxSandboxes:
          type: integer
        maxVolumes:
          type: integer
          description: >-
            The volume count limit. Omit to leave it as it is; send `0` to
            remove it.
        maxNetworks:
          type: integer
          description: >-
            Project-wide network count limit. Environment-scoped quotas reject
            this field.
        isEnabled:
          type: boolean

    QuotaUsage:
      type: object
      description: >-
        A quota's limits alongside both its bookkeeping reservations and usage
        recomputed from the VMs currently in scope.
      required: [quotaId, quotaName, limits, reserved, actual, utilization, vmsByEnvironment, vmsByStatus, isEnabled]
      properties:
        quotaId:
          type: string
          format: uuid
        quotaName:
          type: string
        limits:
          $ref: "#/components/schemas/ResourceQuotaLimits"
        reserved:
          $ref: "#/components/schemas/QuotaUsageCounts"
        actual:
          $ref: "#/components/schemas/QuotaUsageCounts"
        utilization:
          $ref: "#/components/schemas/ResourceQuotaUtilization"
        vmsByEnvironment:
          type: object
          additionalProperties:
            type: integer
        vmsByStatus:
          type: object
          additionalProperties:
            type: integer
        isEnabled:
          type: boolean
        environment:
          type: string
          nullable: true

    QuotaUsageCounts:
      type: object
      required: [vcpus, memoryGB, storageGB, vms, sandboxes, volumes, networks]
      properties:
        vcpus:
          type: integer
        memoryGB:
          type: number
          format: double
        storageGB:
          type: number
          format: double
        vms:
          type: integer
        sandboxes:
          type: integer
        volumes:
          type: integer
        networks:
          type: integer
    NodeDependencyFailureReason:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - dependency_failed
            - missing_binary
            - missing_unit
            - incompatible_version
            - inactive_unit
            - failed_unit
            - command_timed_out
            - malformed_output
            - functional_probe_failed
            - stale_observation
            - remediation_unauthorized
            - remediation_budget_exhausted
            - remediation_failed
        message:
          type: string
    NodeDependencyObservation:
      type: object
      required:
        - id
        - role
        - desiredState
        - ownership
        - supervisorState
        - compatibility
        - functionalState
        - checkedAt
        - consecutiveFailures
        - remediationCount
        - restartCount
        - affectedCapabilities
      properties:
        id:
          type: string
          enum: [spire, libvirt, ovn_ovs, frr, ceph_client, ceph_cluster]
        role:
          type: string
          enum: [identity, compute, networking, routing, storage]
        desiredState:
          type: string
          enum: [disabled, required]
        ownership:
          type: string
          enum: [observe_only, ensure_running, reconcile]
        supervisorState:
          type: string
          enum: [not_applicable, missing, inactive, activating, active, failed, unknown]
        installedVersion:
          type: string
          nullable: true
        daemonVersion:
          type: string
          nullable: true
        compatibility:
          type: string
          enum: [unknown, compatible, incompatible]
        functionalState:
          type: string
          enum: [unknown, starting, healthy, degraded, unhealthy]
        checkedAt:
          type: string
          format: date-time
        lastHealthyAt:
          type: string
          format: date-time
          nullable: true
        reason:
          $ref: "#/components/schemas/NodeDependencyFailureReason"
        consecutiveFailures:
          type: integer
          minimum: 0
        remediationCount:
          type: integer
          minimum: 0
        restartCount:
          type: integer
          minimum: 0
        affectedCapabilities:
          type: array
          items:
            type: string
            enum:
              - workload_identity
              - qemu_placement
              - overlay_networking
              - sandbox_networking
              - network_resolver
              - dynamic_routing
              - ceph_volumes
    AgentDetail:
      type: object
      description: A registered hypervisor node.
      required:
        - id
        - name
        - hostname
        - version
        - status
        - resources
        - hypervisors
        - sandboxCapable
        - sandboxNetworkingCapable
        - tpmCapable
        - resolverCapable
        - dependencyObservations
        - siteId
        - isOnline
        - updateAvailable
        - autoUpdate
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Unique agent name; also its SPIFFE identity's path segment.
        hostname:
          type: string
        version:
          type: string
          description: The agent build currently running on the node.
        status:
          $ref: "#/components/schemas/AgentStatus"
        resources:
          $ref: "#/components/schemas/AgentResources"
        architecture:
          $ref: "#/components/schemas/AgentCPUArchitecture"
        operatingSystem:
          $ref: "#/components/schemas/AgentOperatingSystem"
        hypervisors:
          type: array
          items:
            $ref: "#/components/schemas/AgentHypervisorSupport"
        networkCapability:
          $ref: "#/components/schemas/AgentNetworkCapability"
        sandboxCapable:
          type: boolean
        sandboxNetworkingCapable:
          type: boolean
          description: >-
            Whether a sandbox on this node can have a NIC: it advertised OVN
            networking, the sandbox jailer, and a guest image that configures
            the interface. Strictly stronger than `sandboxCapable` — a node with
            only that runs network-free sandboxes. Sandboxes created with a
            network only place on nodes reporting true.
        tpmCapable:
          type: boolean
          description: >-
            Whether this node can back a guest TPM 2.0 (it advertised a usable
            swtpm at its last registration). VMs requesting `tpm` only place on
            such nodes.
        resolverCapable:
          type: boolean
          description: >-
            Whether this node can run the per-network DNS resolver. Resolver
            enablement requires every node in the site to report true.
        dependencyObservations:
          type: array
          description: >-
            Latest feature-scoped software dependency health reported by the
            agent. Fresh healthy observations are authoritative for new
            placement; failures do not terminate running workloads.
          items:
            $ref: "#/components/schemas/NodeDependencyObservation"
        dependencyObservationsReceivedAt:
          type: string
          format: date-time
          description: >-
            Control-plane time when the latest dependency snapshot arrived.
            Placement freshness uses this value instead of the agent's clock.
        hostInfo:
          $ref: "#/components/schemas/AgentHostInfo"
        siteId:
          type: string
          format: uuid
          description: The site (OVN deployment) this agent belongs to.
        organizationId:
          type: string
          format: uuid
          nullable: true
        organizationalUnitId:
          type: string
          format: uuid
          nullable: true
          description: Folder scope; mutually exclusive with `organizationId`.
        lastHeartbeat:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        isOnline:
          type: boolean
        targetVersion:
          type: string
          nullable: true
          description: >-
            The version this deployment expects agents to run; null when no
            meaningful target is configured (dev builds).
        updateAvailable:
          type: boolean
        autoUpdate:
          type: boolean
          description: Whether the agent is enrolled in declarative auto-update.
        updateDesiredVersion:
          type: string
          nullable: true
          description: >-
            The version this agent has been assigned while it converges; null
            once converged or never assigned. Set by the fleet rollout and by
            an operator's update action alike.
        updateAssignmentSource:
          type: string
          nullable: true
          enum: [rollout, manual]
          description: >-
            Who assigned `updateDesiredVersion` — the fleet auto-update rollout
            or an operator's update action. Null when there is no assignment.
        updateAttemptedAt:
          type: string
          format: date-time
          nullable: true
        updateBlockedReason:
          type: string
          nullable: true
          description: The agent's self-reported reason for not converging yet.
        updateFailureReason:
          type: string
          nullable: true
          description: Terminal failure that halted the rollout at this agent.
        teardownRefusalReason:
          type: string
          nullable: true
          description: >-
            Why the agent last refused to converge a sync's workload
            teardowns, because removing that many of the host's workloads at
            once looked more like a control-plane failure than an intention.
            Null in the steady state.
        teardownRefusedAt:
          type: string
          format: date-time
          nullable: true
        manifestStatusReason:
          type: string
          nullable: true
          description: >-
            What the agent last reported about its durable workload manifest —
            its only memory of what it is running. Non-null means either that
            the manifest is unreadable (see manifestInventoryComplete) or that
            some entries in it cannot be routed by the agent build running on
            the host. Null in the steady state.
        manifestStatusAt:
          type: string
          format: date-time
          nullable: true
        manifestInventoryComplete:
          type: boolean
          nullable: true
          description: >-
            False while the agent cannot enumerate its own workloads. Such a
            host advertises no capacity, converges nothing, and its
            observed-state reports carry no inventory. Null from agents that
            predate the field.
        heldWorkloads:
          type: array
          nullable: true
          description: >-
            Workloads this agent is running that no desired-state sync
            accounts for, and whose teardown the control plane refused to
            authorize because a record still exists for them. A non-empty list
            means the control plane is describing this host incorrectly —
            most often that the node re-enrolled under a new agent record
            while its workloads stayed placed on the old one, in which case
            `placedOnAgentId` names it and they can be adopted. Returned only
            by the single-agent endpoint; null in list responses.
          items:
            $ref: "#/components/schemas/HeldWorkload"

    HeldWorkload:
      type: object
      description: One workload an agent holds that the control plane will not authorize tearing down.
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [virtual_machine, sandbox]
        id:
          type: string
          format: uuid
        status:
          type: string
          nullable: true
          description: The workload's observed status on the agent.
        reason:
          type: string
          nullable: true
          description: >-
            `row_present_here` when the record maps to this very agent (a sync
            assembly bug), or `row_on_agent:<uuid>` when it is placed on a
            different agent record.
        placedOnAgentId:
          type: string
          nullable: true
          description: The agent record the workload is currently placed on, when that differs.
        firstSeenAt:
          type: string
          format: date-time
          nullable: true

    AdoptWorkloadsRequest:
      type: object
      required: [fromAgentId]
      properties:
        fromAgentId:
          type: string
          format: uuid
          description: The agent record whose placements should move to this agent.

    AdoptWorkloadsResult:
      type: object
      required: [adoptedVMs, adoptedSandboxes, adoptedVolumes, skippedUnclaimed]
      properties:
        adoptedVMs:
          type: integer
        adoptedSandboxes:
          type: integer
        adoptedVolumes:
          type: integer
          description: >-
            Volumes re-pointed onto this agent, including detached ones —
            their data is on this host too. A volume attached to a VM that
            stayed behind is not moved.
        skippedUnclaimed:
          type: integer
          description: >-
            Workloads still placed on the source record that this agent does
            not report holding, so they were left alone. These are not
            necessarily stranded: a workload running on a genuinely different
            host counts here too.

    AgentStatus:
      type: string
      description: Connection state of an agent, derived from its last heartbeat.
      enum: [online, offline, connecting, error]

    AgentResources:
      type: object
      description: Capacity reported by the agent host.
      required:
        - totalCPU
        - availableCPU
        - totalMemory
        - availableMemory
        - totalDisk
        - availableDisk
      properties:
        totalCPU:
          type: integer
          description: Total vCPUs on the host.
        availableCPU:
          type: integer
        totalMemory:
          type: integer
          format: int64
          description: Bytes.
        availableMemory:
          type: integer
          format: int64
        totalDisk:
          type: integer
          format: int64
          description: Bytes.
        availableDisk:
          type: integer
          format: int64

    AgentCPUArchitecture:
      type: string
      description: CPU architecture of a hypervisor host.
      enum: [x86_64, arm64]

    AgentOperatingSystem:
      type: string
      description: Operating system of a hypervisor host.
      enum: [linux, macos]

    AgentNetworkCapability:
      type: string
      description: >-
        Networking capability of an agent host. `overlay` is OVN/OVS (inter-VM
        traffic, isolation, inbound); `user_mode` is SLIRP outbound NAT only.
      enum: [overlay, user_mode]

    AgentHypervisorType:
      type: string
      description: A hypervisor backend an agent can run VMs on.
      enum: [qemu, firecracker]

    AgentHypervisorSupport:
      type: object
      description: One hypervisor on an agent host, as probed at agent startup.
      required: [type, available, accelerated, capabilities]
      properties:
        type:
          $ref: "#/components/schemas/AgentHypervisorType"
        available:
          type: boolean
          description: Whether the hypervisor is usable on this host right now.
        accelerated:
          type: boolean
          description: Whether hardware acceleration (KVM/HVF) backs this hypervisor.
        unavailabilityReason:
          type: string
          nullable: true
        capabilities:
          $ref: "#/components/schemas/AgentHypervisorCapabilities"
        supportsVsock:
          type: boolean
          nullable: true
          description: >-
            Whether this host can attach a virtio-vsock device for this
            hypervisor; null for agents that predate vsock probing.
        version:
          type: string
          nullable: true
          description: >-
            The hypervisor binary's probed version; null for agents predating
            version probing or when the probe failed.

    AgentHypervisorCapabilities:
      type: object
      description: Feature support of one hypervisor backend.
      required:
        - type
        - supportsPause
        - supportsLiveMigration
        - supportsSnapshots
        - requiresDirectKernelBoot
        - maxVCPUs
        - maxMemory
      properties:
        type:
          $ref: "#/components/schemas/AgentHypervisorType"
        supportsPause:
          type: boolean
        supportsLiveMigration:
          type: boolean
        supportsSnapshots:
          type: boolean
        requiresDirectKernelBoot:
          type: boolean
          description: Whether booting requires an explicit kernel + rootfs.
        maxVCPUs:
          type: integer
        maxMemory:
          type: integer
          format: int64
          description: Bytes.

    AgentHostInfo:
      type: object
      description: >-
        Descriptive hardware/platform details for operator display. Purely
        informational, best-effort, and every field may be absent.
      properties:
        osName:
          type: string
          nullable: true
          description: OS product/distribution name including version.
        kernelVersion:
          type: string
          nullable: true
        cpuModel:
          type: string
          nullable: true
        cpuVendor:
          type: string
          nullable: true
        physicalCoreCount:
          type: integer
          nullable: true
        logicalCoreCount:
          type: integer
          nullable: true
        totalMemoryBytes:
          type: integer
          format: int64
          nullable: true
        machineModel:
          type: string
          nullable: true
        bootTime:
          type: string
          format: date-time
          nullable: true

    UpdateAgentRequest:
      type: object
      description: Mutable agent properties.
      properties:
        autoUpdate:
          type: boolean
          description: Enroll in (or withdraw from) declarative auto-update.

    AgentUpdateRequest:
      type: object
      description: >-
        Optional overrides for an operator-triggered agent self-update. With no
        body at all, the agent updates to the configured target version along
        the release path.
      properties:
        force:
          type: boolean
          description: >-
            Proceed despite the one caveat that is otherwise refused: hosted
            sandboxes, which the sandbox runtime does not yet re-adopt after an
            agent restart. An agent already at the target version is refused
            regardless — an update converges on a version, so reinstalling the
            same build is not expressible.
        artifactUrl:
          type: string
          description: >-
            Explicit artifact override for deployments the URL-convention
            resolver cannot serve. Requires `sha256`, and system admin.
        sha256:
          type: string
          description: Hex SHA-256 of the artifact at `artifactUrl`.
        artifactKind:
          $ref: "#/components/schemas/AgentUpdateArtifactKind"
        tarballMember:
          type: string
          description: >-
            Member to extract from an explicit tarball artifact. Defaults to
            `strato-agent`.
        targetVersion:
          type: string
          description: >-
            Version label for an explicit artifact; defaults to the configured
            target, and is required when the deployment has none. Load-bearing:
            convergence is "the agent re-registered at this version", so a label
            the artifact's binary does not report leaves the update stuck until
            it is recorded as failed.

    AgentUpdateArtifactKind:
      type: string
      description: >-
        Shape of an explicit update artifact. `tarball` extracts
        `tarballMember`; `binary` means the download is the agent executable.
        Ignored without `artifactUrl`.
      enum: [tarball, binary]

    AgentUpdateResult:
      type: object
      description: The update assignment the agent will converge on.
      required: [status, targetVersion, artifactUrl]
      properties:
        status:
          type: string
          description: Always `assigned`.
        targetVersion:
          type: string
        artifactUrl:
          type: string
          description: >-
            The artifact URL with query and userinfo stripped — an override may
            resolve to a presigned URL whose query string is a credential.
        message:
          type: string
          nullable: true

    CreateAgentEnrollmentRequest:
      type: object
      description: >-
        A node enrollment. Exactly one of `organizationId` or
        `organizationalUnitId` is required — that scope is the capacity the
        registering agent becomes dedicated to. A `siteId` is also required:
        every enrolled agent joins an availability zone.
      required: [agentName, siteId]
      properties:
        agentName:
          type: string
          maxLength: 100
          pattern: "^[A-Za-z0-9._-]+$"
          description: >-
            Unique agent name, restricted to characters SPIRE accepts in a
            SPIFFE ID path segment.
        expirationHours:
          type: integer
          minimum: 1
          maximum: 168
          default: 1
          description: Lifetime of the enrollment and its SPIRE join token.
        siteId:
          type: string
          format: uuid
          description: >-
            Site (availability zone) the agent joins on registration. Required.
            Must belong to a scope containing the enrollment's, and the caller
            needs `manage` on it.
        organizationId:
          type: string
          format: uuid
          nullable: true
        organizationalUnitId:
          type: string
          format: uuid
          nullable: true

    AgentEnrollmentDetail:
      type: object
      description: >-
        A newly created enrollment. Returned only from the create endpoint,
        because it carries one-time SPIRE node-attestation material.
      required: [id, agentName, spiffeId, expiresAt, spire, bootstrapCommand]
      properties:
        id:
          type: string
          format: uuid
        agentName:
          type: string
        spiffeId:
          type: string
        expiresAt:
          type: string
          format: date-time
        spire:
          $ref: "#/components/schemas/SPIREProvisioning"
        bootstrapCommand:
          type: string
          description: >-
            Copy-paste one-liner that installs strato-agent and spire-agent,
            attests the node with the join token, and points it at this control
            plane's mTLS listener.

    SPIREProvisioning:
      type: object
      description: >-
        SPIRE material handed back once, at enrollment creation. `joinToken` is
        a one-time bearer secret that is never persisted or re-exposed.
      required:
        - joinToken
        - joinTokenExpiresAt
        - spiffeId
        - nodeId
        - trustDomain
        - serverAddress
      properties:
        joinToken:
          type: string
        joinTokenExpiresAt:
          type: string
          format: date-time
        spiffeId:
          type: string
        nodeId:
          type: string
        trustDomain:
          type: string
        serverAddress:
          type: string

    AgentEnrollmentListItem:
      type: object
      description: >-
        List-safe view of an enrollment. Deliberately omits the whole `spire`
        block: the join token is shown exactly once, at creation time.
      required: [id, agentName, spiffeId, expiresAt, isUsed, isValid]
      properties:
        id:
          type: string
          format: uuid
        agentName:
          type: string
        spiffeId:
          type: string
        expiresAt:
          type: string
          format: date-time
        isUsed:
          type: boolean
          description: Whether the named agent has registered.
        isValid:
          type: boolean
          description: Unused and not yet expired.
        organizationId:
          type: string
          format: uuid
          nullable: true
        organizationalUnitId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        usedAt:
          type: string
          format: date-time
          nullable: true

    SiteDetail:
      type: object
      description: >-
        An availability zone: the agents that share one OVN deployment, so a
        logical network pinned to the site can span its nodes.
      required: [id, name, status, labels]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/SiteStatus'
        latitude:
          type: number
          format: double
          nullable: true
          description: Decimal degrees (WGS84), −90…90. Paired with longitude.
        longitude:
          type: number
          format: double
          nullable: true
          description: Decimal degrees (WGS84), −180…180. Paired with latitude.
        locationLabel:
          type: string
          nullable: true
          description: Human-readable location, e.g. "Equinix DC1, Ashburn VA".
        regionCode:
          type: string
          nullable: true
          description: Short operator-defined region/zone slug, e.g. "us-east-1".
        labels:
          type: object
          additionalProperties:
            type: string
          description: Free-form operator labels; empty object when unset.
        networkControllerAgentId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The member agent that authors this site's shared OVN northbound
            database; null when none is designated.
        networkControllerStatus:
          description: >-
            Heartbeat-derived status of the designated network controller;
            omitted when the site designates none. Reported as soon as the
            heartbeat lapses, before the API begins refusing work.
          allOf:
            - $ref: '#/components/schemas/AgentStatus'
        networkControllerIssue:
          type: string
          nullable: true
          description: >-
            Why the designated network controller cannot author this site's
            topology right now — offline past the grace window, or re-registered
            without the capabilities it was designated under. Null while it can.
            When non-null, creating networked workloads, pinning networks to this
            site, attaching floating IPs and attaching security groups here are
            refused with 409.
        organizationId:
          type: string
          format: uuid
          nullable: true
        organizationalUnitId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    SiteStatus:
      type: string
      description: Operational lifecycle of an availability zone.
      enum:
        - active
        - draining
        - maintenance
        - decommissioned

    CreateSiteRequest:
      type: object
      description: >-
        Exactly one of `organizationId` or `organizationalUnitId` is required.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
        organizationId:
          type: string
          format: uuid
          nullable: true
        organizationalUnitId:
          type: string
          format: uuid
          nullable: true
        status:
          description: Lifecycle at creation; defaults to `active` when omitted.
          allOf:
            - $ref: '#/components/schemas/SiteStatus'
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        locationLabel:
          type: string
          nullable: true
        regionCode:
          type: string
          nullable: true
        labels:
          type: object
          additionalProperties:
            type: string
          nullable: true

    UpdateSiteRequest:
      type: object
      description: >-
        Full-replace (PUT) semantics for descriptive fields: omitting one clears
        it (labels omitted → empty map). `status` is the exception — an omitted
        status leaves the current lifecycle unchanged.
      properties:
        description:
          type: string
          nullable: true
        networkControllerAgentId:
          type: string
          format: uuid
          nullable: true
        status:
          description: When omitted, the current status is left unchanged.
          allOf:
            - $ref: '#/components/schemas/SiteStatus'
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        locationLabel:
          type: string
          nullable: true
        regionCode:
          type: string
          nullable: true
        labels:
          type: object
          additionalProperties:
            type: string
          nullable: true

    WorkloadIdentityOverview:
      type: object
      description: SPIFFE/SPIRE trust-domain state as reported by the SPIRE server.
      required: [enabled, entries, nodeAttestation, federation, issuance]
      properties:
        enabled:
          type: boolean
          description: >-
            Whether SPIRE is configured on this control plane. When false every
            collection is empty and the UI renders a "not configured" state.
        trustDomain:
          type: string
          nullable: true
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SPIRERegistrationEntry"
        nodeAttestation:
          type: array
          description: Attested nodes summarized by attestation method.
          items:
            $ref: "#/components/schemas/SPIRENodeAttestationGroup"
        trustBundle:
          $ref: "#/components/schemas/SPIRETrustBundle"
        federation:
          $ref: "#/components/schemas/SPIREFederation"
        issuance:
          $ref: "#/components/schemas/SPIREIssuance"
        warning:
          type: string
          nullable: true
          description: A non-fatal problem reaching the SPIRE server, if any.

    SPIRERegistrationEntry:
      type: object
      description: One SPIRE workload registration entry.
      required:
        - id
        - spiffeID
        - path
        - parentID
        - selectors
        - svidTypes
        - x509TTLSeconds
        - jwtTTLSeconds
        - federatesWith
        - admin
        - downstream
      properties:
        id:
          type: string
        spiffeID:
          type: string
          description: Full identity, e.g. `spiffe://strato.prod/db/primary`.
        path:
          type: string
          description: Path portion after the trust domain.
        parentID:
          type: string
          description: Parent identity — the SPIRE server for node entries, or a node id.
        node:
          type: string
          nullable: true
          description: Short node name derived from `parentID`; best-effort.
        selectors:
          type: array
          description: Selectors formatted as `type:value`.
          items:
            type: string
        svidTypes:
          type: array
          description: SVID kinds this entry issues; always `x509` and `jwt`.
          items:
            type: string
        x509TTLSeconds:
          type: integer
        jwtTTLSeconds:
          type: integer
          description: 0 means the server's default JWT-SVID TTL, not "no JWT-SVID".
        federatesWith:
          type: array
          items:
            type: string
        admin:
          type: boolean
        downstream:
          type: boolean
        hint:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true

    SPIRENodeAttestationGroup:
      type: object
      description: Attested-node counts for one attestation method.
      required: [attestationType, count, banned]
      properties:
        attestationType:
          type: string
        count:
          type: integer
        banned:
          type: integer

    SPIRETrustBundle:
      type: object
      description: Trust-bundle metadata; present only once a bundle has loaded.
      required: [trustDomain, x509AuthorityCount, refreshedAt, sequenceNumber]
      properties:
        trustDomain:
          type: string
        x509AuthorityCount:
          type: integer
        refreshedAt:
          type: string
          format: date-time
        sequenceNumber:
          type: integer
          format: int64

    SPIREFederation:
      type: object
      description: >-
        Federation relationships. When `available` is true these come from
        SPIRE's trustdomain API with real sync state, supplemented by static
        `federates_with` domains at `state: unknown`. When false, `domains`
        degrades to just the domains entries federate with.
      required: [available, domains]
      properties:
        available:
          type: boolean
        domains:
          type: array
          items:
            $ref: "#/components/schemas/SPIREFederatedDomain"

    SPIREFederatedDomain:
      type: object
      required: [trustDomain, state]
      properties:
        trustDomain:
          type: string
        state:
          type: string
          enum: [synced, refresh_failed, unknown]

    SPIREIssuance:
      type: object
      description: >-
        SVID issuance counts from an external metrics store; the control plane
        is not in the signing path. Counts are null when unavailable.
      required: [available, windowHours]
      properties:
        available:
          type: boolean
        windowHours:
          type: integer
        x509SVIDs:
          type: integer
          nullable: true
        jwtSVIDs:
          type: integer
          nullable: true
    IAMPrincipalType:
      type: string
      description: The kinds of principal a role binding can name.
      enum: [user, group]

    IAMNodeType:
      type: string
      description: >-
        The tree nodes a role binding or guardrail can attach to: the org
        hierarchy plus any individual resource.
      enum:
        - organization
        - organizational_unit
        - project
        - virtual_machine
        - sandbox
        - image
        - network
        - floating_ip
        - volume
        - volume_snapshot
        - sandbox_snapshot
        - site
        - agent

    IAMNode:
      type: object
      description: A node in the org/resource tree — the `(type, id)` pair policy attaches to.
      required: [type, id]
      properties:
        type:
          $ref: "#/components/schemas/IAMNodeType"
        id:
          type: string
          format: uuid

    IAMPrincipalRef:
      type: object
      description: A reference to a principal — the subject of a binding or check.
      required: [type, id]
      properties:
        type:
          $ref: "#/components/schemas/IAMPrincipalType"
        id:
          type: string
          format: uuid

    IAMActionCheckItem:
      type: object
      description: One canonical action/node question in a batch check.
      required: [key, action, node]
      properties:
        key:
          type: string
          description: Opaque client-chosen id echoed back in the response.
        action:
          type: string
          description: A registered IAM action, e.g. `vm:start`.
        node:
          $ref: "#/components/schemas/IAMNode"

    IAMActionCheckRequest:
      type: object
      required: [checks]
      properties:
        checks:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/IAMActionCheckItem"
        principal:
          allOf:
            - $ref: "#/components/schemas/IAMPrincipalRef"
          description: >-
            When present, the checks are evaluated for this principal instead
            of the caller. Requires admin on each named node or a container
            above it.

    IAMActionCheckResponse:
      type: object
      required: [results]
      properties:
        results:
          type: object
          description: One boolean per submitted check, keyed by its `key`.
          additionalProperties:
            type: boolean

    IAMWhoCanRequest:
      type: object
      required: [action, node]
      properties:
        action:
          type: string
          description: An IAM action name, e.g. `vm:start`.
        node:
          $ref: "#/components/schemas/IAMNode"

    IAMWhoCanSource:
      type: string
      description: >-
        Why a principal can perform the action. `binding` is a row in
        `role_bindings`; `orgMembership` is bare membership, which grants a
        small set of actions with no binding behind it; `systemAdmin` bypasses
        authorization entirely (re-expressed as a platform policy at cutover).
      enum: [binding, orgMembership, systemAdmin]

    IAMWhoCanEntry:
      type: object
      description: >-
        One reason one principal can perform the queried action. A principal
        may appear more than once, because each entry explains a distinct
        grant and revoking access means revoking all of them.
      required: [principal, source, principalDisabled, principalExternalToOrg]
      properties:
        principal:
          $ref: "#/components/schemas/IAMPrincipalRef"
        source:
          $ref: "#/components/schemas/IAMWhoCanSource"
        role:
          type: string
          format: uuid
          description: The canonical role id that carries the action; absent for non-binding sources.
        grantedOn:
          allOf:
            - $ref: "#/components/schemas/IAMNode"
          description: >-
            The node the binding is attached to — the resource itself when the
            grant is direct, an ancestor when it is inherited.
        via:
          allOf:
            - $ref: "#/components/schemas/IAMPrincipalRef"
          description: >-
            The group the user inherited the binding through; absent when the
            binding names the user directly.
        expiresAt:
          type: string
          format: date-time
        principalDisabled:
          type: boolean
          description: >-
            The grant is real but its holder's account is disabled, so they
            cannot currently act on it. Marked rather than filtered out, so an
            un-revoked grant on a departed employee stays visible.
        principalExternalToOrg:
          type: boolean
          description: >-
            The principal lives outside the resource's organization — a user
            with no membership there, or a group owned by another org.
            Cross-org access is reported and marked, never filtered; it is
            exactly what most needs to be visible.
        ceilinged:
          type: boolean
          description: >-
            The grant is real but a ceiling (a guardrail or authored forbid)
            denies it, so this principal cannot actually act here and the
            enforcer agrees (#610). Marked, not filtered — a neutralised grant
            is exactly what an audit needs to see. Absent/false when no ceiling
            applies.
        ceilingPolicyIDs:
          type: array
          description: >-
            The ceiling policy ids that deny this grant (`guardrail-<id>` /
            `policy-<id>`), when `ceilinged`. May be empty even when `ceilinged`
            is true if the denial is structural — a fail-closed on an
            inconsistent/truncated ancestor chain — rather than a named ceiling.
          items:
            type: string

    IAMWhoCanCeiling:
      type: object
      description: >-
        A ceiling in force on the queried resource — a guardrail inherited down
        the tree, or an authored forbid policy scoped to it (#610). Which grants
        it neutralises is on the entries (`ceilinged`); this is the summary of
        what constrains the resource.
      required: [kind, id, name, node]
      properties:
        kind:
          type: string
          enum: [guardrail, policy]
        id:
          type: string
          format: uuid
        name:
          type: string
        node:
          allOf:
            - $ref: "#/components/schemas/IAMNode"
          description: The container a guardrail hangs on, or the owner of a policy.

    IAMWhoCanResponse:
      type: object
      required:
        [action, node, ancestors, principals, openToAllAuthenticatedUsers, authoredPolicies, authoredPolicyCaveat, ceilings]
      properties:
        action:
          type: string
        node:
          $ref: "#/components/schemas/IAMNode"
        ancestors:
          type: array
          description: The chain the answer was assembled from, resource first.
          items:
            $ref: "#/components/schemas/IAMNode"
        principals:
          type: array
          items:
            $ref: "#/components/schemas/IAMWhoCanEntry"
        openToAllAuthenticatedUsers:
          type: boolean
          description: >-
            When true, `principals` is not the whole answer: every
            authenticated user can perform this action here.
        authoredPolicies:
          type: array
          description: >-
            Authored **permit** policies (issue #606) in force on this resource
            that may bear on the action, matched best-effort on action scope and
            containment. Their principals are not in `principals`. Authored
            forbids are reflected exactly in `ceilings` instead (#610).
          items:
            $ref: "#/components/schemas/IAMWhoCanPolicyMatch"
        authoredPolicyCaveat:
          type: boolean
          description: >-
            When true, an authored permit above bears on this query and its
            principals could not be enumerated — `principals` is again partial.
        ceilings:
          type: array
          description: >-
            The ceilings in force on this resource — guardrails inherited down
            the tree plus authored forbid policies scoped to it (#610). Which
            grants each neutralises is on the entries (`ceilinged`).
          items:
            $ref: "#/components/schemas/IAMWhoCanCeiling"

    IAMWhoCanPolicyMatch:
      type: object
      description: >-
        An authored policy that may bear on the queried action and resource.
        Best-effort: which principals it permits or forbids, and any
        conditions, cannot be enumerated from a reverse lookup.
      required: [policyID, name, effect, owner, actionMatch]
      properties:
        policyID:
          type: string
          format: uuid
        name:
          type: string
        effect:
          $ref: "#/components/schemas/IAMPolicyEffect"
        owner:
          $ref: "#/components/schemas/IAMNode"
        actionMatch:
          type: string
          description: >-
            Whether the policy's action scope covers the queried action, as far
            as its text can be read. `unknown` when the scope cannot be
            enumerated (an action-group reference).
          enum: [matches, unknown]

    IAMGuardrailPrincipalMatchKind:
      type: string
      description: Which principals a guardrail constrains.
      enum: [any, user, group, external_to_organization]

    IAMGuardrailPrincipalMatch:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/IAMGuardrailPrincipalMatchKind"
        id:
          type: string
          format: uuid
          description: The user or group id; required for `user` and `group`, absent otherwise.

    IAMGuardrailResourceMatchKind:
      type: string
      description: Which resources a guardrail constrains.
      enum: [any, environment]

    IAMGuardrailResourceMatch:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/IAMGuardrailResourceMatchKind"
        value:
          type: string
          description: The environment name; required for `environment`, absent otherwise.

    IAMRoleOwnerType:
      type: string
      description: >-
        Who owns a role definition. `platform` rows are the seeded defaults,
        reconciled from the code registry and immutable through the API;
        organization- and project-owned rows are user-created and bindable at
        or below their owner.
      enum: [platform, organization, project]
    IAMRole:
      type: object
      description: >-
        A role definition: a named Cedar permit whose action scope is an
        explicit, enumerable action list. The four defaults are seeded rows,
        not a separate kind of thing.
      required: [id, name, ownerType, ownerId, cedarText, actions, managed]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        ownerType:
          $ref: "#/components/schemas/IAMRoleOwnerType"
        ownerId:
          type: string
          format: uuid
          description: >-
            The owning organization or project. Platform rows carry the
            all-zero sentinel.
        cedarText:
          type: string
          description: >-
            The role's permit, in Cedar policy language, compiled into the
            policy set verbatim. Round-trips: this value is accepted as
            `cedarText` on a later write.
        actions:
          type: array
          description: >-
            Derived from `cedarText`'s action scope on every write, never sent
            by the client.
          items:
            type: string
        managed:
          type: boolean
          description: >-
            A seeded default, reconciled from the code registry at boot and
            immutable through this API.
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IAMRoleListResponse:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/IAMRole"
    IAMBindableRolesResponse:
      type: object
      required: [node, ancestors, roles]
      properties:
        node:
          $ref: "#/components/schemas/IAMNode"
        ancestors:
          type: array
          description: >-
            The chain the answer was assembled from, resource first, so an
            inherited role is explicable without a second round trip.
          items:
            $ref: "#/components/schemas/IAMNode"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/IAMBindableRole"
    IAMBindableRole:
      type: object
      description: >-
        A role as the grant flow needs it: enough to choose one and know what
        it confers, without the policy text. This listing is gated on read of
        the node rather than on `iam:readPolicy`, and a role's `cedarText` can
        describe the organization's security posture — which environments are
        fenced off, where MFA is demanded — so reading it stays an
        `iam:readPolicy` act.
      required: [id, name, ownerType, ownerId, actions, managed]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        ownerType:
          $ref: "#/components/schemas/IAMRoleOwnerType"
        ownerId:
          type: string
          format: uuid
        actions:
          type: array
          items:
            type: string
        managed:
          type: boolean
    IAMRoleCreateRequest:
      type: object
      required: [name, ownerType, ownerId]
      properties:
        name:
          type: string
        description:
          type: string
        ownerType:
          $ref: "#/components/schemas/IAMRoleOwnerType"
        ownerId:
          type: string
          format: uuid
        actions:
          type: array
          description: >-
            Pick actions and the server writes the canonical permit. Mutually
            exclusive with `cedarText`; exactly one is required.
          items:
            type: string
        cedarText:
          type: string
          description: >-
            Write the permit yourself. Mutually exclusive with `actions`.
            Because the permit is conditioned on grants fields whose names
            embed the role id, a client supplying its own text supplies `id`
            too — `/api/iam/roles/validate` hands out one to build against.
        id:
          type: string
          format: uuid
          description: >-
            The id to create the role under. Optional; the server allocates one
            when it is omitted, in which case only the `actions` mode can be
            used.
    IAMRoleUpdateRequest:
      type: object
      description: >-
        Partial update. Sending `actions` or `cedarText` rewrites the permit;
        sending neither leaves it as it is. The two remain mutually exclusive.
      properties:
        name:
          type: string
        description:
          type: string
        actions:
          type: array
          items:
            type: string
        cedarText:
          type: string
    IAMRoleValidateRequest:
      type: object
      description: >-
        Exactly one of `actions` or `cedarText`, as on a write.
      properties:
        actions:
          type: array
          items:
            type: string
        cedarText:
          type: string
        id:
          type: string
          format: uuid
          description: >-
            The role being edited, so its own grants fields are the accepted
            ones. Omit for a role that does not exist yet and the response
            carries a freshly allocated id to build against.
    IAMRoleValidateResponse:
      type: object
      required: [id, cedarText, actions]
      properties:
        id:
          type: string
          format: uuid
          description: >-
            The id the text was checked against — the one being edited, or a
            freshly allocated one to write `cedarText` against and then send
            back as the create request's `id`.
        cedarText:
          type: string
        actions:
          type: array
          items:
            type: string
    IAMPolicyEffect:
      type: string
      description: >-
        A policy's effect, derived from its Cedar text. Unlike a role
        (permit-only) or a guardrail (forbid-only), an authored policy may be
        either.
      enum: [permit, forbid]
    IAMPolicy:
      type: object
      description: >-
        An authored Cedar policy: a permit or forbid written directly in Cedar
        policy language, owned by an organization or project and compiled into
        the policy set under the id `policy-<uuid>`.
      required: [id, name, ownerType, ownerId, cedarText, effect, enabled]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        ownerType:
          $ref: "#/components/schemas/IAMRoleOwnerType"
        ownerId:
          type: string
          format: uuid
          description: The owning organization or project.
        cedarText:
          type: string
          description: >-
            The policy in Cedar policy language, compiled verbatim.
            Round-trips: this value is accepted as `cedarText` on a later write.
        effect:
          $ref: "#/components/schemas/IAMPolicyEffect"
        enabled:
          type: boolean
          description: >-
            Disabled policies stay in the table but are left out of the
            compiled set.
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IAMPolicyListResponse:
      type: object
      required: [policies]
      properties:
        policies:
          type: array
          items:
            $ref: "#/components/schemas/IAMPolicy"
    IAMPolicyCreateRequest:
      type: object
      required: [name, ownerType, ownerId, cedarText]
      properties:
        name:
          type: string
        description:
          type: string
        ownerType:
          $ref: "#/components/schemas/IAMRoleOwnerType"
        ownerId:
          type: string
          format: uuid
        cedarText:
          type: string
          description: >-
            The Cedar permit or forbid. The effect is read off it; there is no
            action-list shorthand — an authored policy is Cedar by definition.
        enabled:
          type: boolean
          description: Defaults to true when omitted.
        id:
          type: string
          format: uuid
          description: >-
            Optional pre-allocated id (a `validate` round-trip hands one out).
            The server allocates one when it is omitted.
    IAMPolicyUpdateRequest:
      type: object
      description: >-
        Partial update. Sending `cedarText` re-derives the effect and re-checks
        containment; omitted fields are left unchanged.
      properties:
        name:
          type: string
        description:
          type: string
        cedarText:
          type: string
        enabled:
          type: boolean
    IAMPolicyValidateRequest:
      type: object
      required: [ownerType, ownerId, cedarText]
      properties:
        ownerType:
          $ref: "#/components/schemas/IAMRoleOwnerType"
        ownerId:
          type: string
          format: uuid
        cedarText:
          type: string
        id:
          type: string
          format: uuid
          description: >-
            The policy being edited, so the id its compiled form uses is
            stable. Omit for a policy that does not exist yet.
    IAMPolicyValidateResponse:
      type: object
      required: [id, cedarText, effect]
      properties:
        id:
          type: string
          format: uuid
        cedarText:
          type: string
        effect:
          $ref: "#/components/schemas/IAMPolicyEffect"
    IAMActionCatalogEntry:
      type: object
      required: [action, service, resourceTypes, roles, membershipDerived]
      properties:
        action:
          type: string
        service:
          type: string
        resourceTypes:
          type: array
          description: >-
            The tree-node types this action can be requested against. Container
            types appear because `create`/`list` checks target the container.
          items:
            $ref: "#/components/schemas/IAMNodeType"
        roles:
          type: array
          description: >-
            The seeded roles carrying this action. Empty for an action no
            default role grants — which is a fine thing for a custom role to
            grant.
          items:
            type: string
        membershipDerived:
          type: boolean
          description: >-
            Granted by bare organization membership, with no binding behind it.
            Including such an action in a custom role is legal but buys nothing
            inside the org.
    IAMActionCatalogService:
      type: object
      required: [service, actions]
      properties:
        service:
          type: string
        actions:
          type: array
          items:
            $ref: "#/components/schemas/IAMActionCatalogEntry"
    IAMActionCatalogResponse:
      type: object
      required: [services]
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/IAMActionCatalogService"
    IAMGuardrail:
      type: object
      description: >-
        A tier-2 ceiling on what grants beneath a node can reach. Guardrails
        only ever forbid; they intersect rather than override one another.
      required: [id, name, node, effect, actions, principalMatch, resourceMatch, shape, authored, enabled]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        node:
          $ref: "#/components/schemas/IAMNode"
        effect:
          type: string
          description: Always `forbid`. Stated rather than left to be inferred.
          enum: [forbid]
        actions:
          type: array
          description: >-
            Exact actions, `service:*` wildcards, or `*`. An empty list means
            every action. Placeholder (`["*"]`) on an authored guardrail.
          items:
            type: string
        principalMatch:
          $ref: "#/components/schemas/IAMGuardrailPrincipalMatch"
        resourceMatch:
          $ref: "#/components/schemas/IAMGuardrailResourceMatch"
        shape:
          type: string
          description: Which side carries the constraint; derived from the two matches.
        cedarText:
          type: string
          description: >-
            The Cedar `forbid` this guardrail compiles to — the stored source of
            truth since #610 (matcher-generated or hand-authored). Absent only
            when the row cannot be rendered (an unknown node type, or an
            external-principal ceiling whose attach node resolves to no
            organization).
        authored:
          type: boolean
          description: >-
            Whether the forbid was hand-authored (`true`) or assembled from the
            matchers (`false`, #610). On an authored row the matcher fields are
            placeholders; a builder UI reads this to choose the editor.
        enabled:
          type: boolean
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    IAMGuardrailWriteResponse:
      type: object
      description: >-
        A written guardrail, plus the grants it now narrows. The write is never
        refused over these — subtracting from existing grants is what a ceiling
        is for — but the author sees what they just took away.
      required: [guardrail, shadowedBindings]
      properties:
        guardrail:
          $ref: "#/components/schemas/IAMGuardrail"
        shadowedBindings:
          type: array
          description: >-
            Active role bindings beneath the attach node that this ceiling now
            constrains. Empty when the symbolic analysis could not run; the
            ceiling is in force either way.
          items:
            $ref: "#/components/schemas/IAMShadowedBinding"

    IAMShadowedBinding:
      type: object
      required: [principalType, principalID, role, node]
      properties:
        principalType:
          type: string
          enum: [user, group]
        principalID:
          type: string
          format: uuid
        role:
          type: string
          enum: [viewer, operator, editor, admin]
        node:
          $ref: "#/components/schemas/IAMNode"

    IAMGrantWriteResponse:
      type: object
      description: >-
        What a role grant returns: the tier-2 ceilings in force that narrow it.
        The mirror of `shadowedBindings` on a guardrail write — there the
        ceiling's author sees the grants it narrows, here the grant's author
        sees the ceilings that narrow it.
      required: [ceilings]
      properties:
        ceilings:
          type: array
          description: >-
            Empty in the ordinary case. A non-empty list is not a failure —
            the binding confers everything the listed ceilings do not take
            back. Also empty when `analysisUnavailable` is set, which is the
            only thing distinguishing "nothing narrows this grant" from
            "nobody could say".
          items:
            $ref: "#/components/schemas/IAMGrantCeiling"
        analysisUnavailable:
          type: string
          description: >-
            Present only when the symbolic analysis could not run — no solver,
            a solver failure, or the analysis exceeding its wall-clock budget —
            naming which. The grant is written and the ceilings are enforced at
            evaluation either way; what is missing is the explanation.

    IAMGrantCeiling:
      type: object
      required: [guardrail, explanation, ceilingedActions]
      properties:
        guardrail:
          type: string
          description: >-
            `organization/Acme/no-prod-for-contractors` — the attach node and
            the guardrail's name, so the reader knows where to go to change it.
        setBy:
          type: string
          description: "`alice@acme (organization admin)`, when the author is still resolvable."
        explanation:
          type: string
          description: >-
            What the grant does that the ceiling forbids, in the vocabulary the
            ceiling was written in.
        ceilingedActions:
          type: array
          description: >-
            The role's actions this ceiling takes back: covered by its action
            scope *and* able to reach a resource type it can match. Everything
            else in the role is unaffected.
          items:
            type: string
        counterexample:
          type: string
          description: >-
            A concrete request the grant allows and the ceiling forbids, as the
            solver found it.

    IAMGuardrailCreateRequest:
      type: object
      required: [name, nodeType, nodeId]
      properties:
        name:
          type: string
        description:
          type: string
        effect:
          type: string
          description: >-
            Optional, and only ever `forbid`. A request naming anything else is
            rejected rather than silently coerced.
          enum: [forbid]
        nodeType:
          $ref: "#/components/schemas/IAMNodeType"
        nodeId:
          type: string
          format: uuid
        actions:
          type: array
          description: Defaults to empty, which means every action.
          items:
            type: string
        principalMatch:
          allOf:
            - $ref: "#/components/schemas/IAMGuardrailPrincipalMatch"
          description: Defaults to `any`.
        resourceMatch:
          allOf:
            - $ref: "#/components/schemas/IAMGuardrailResourceMatch"
          description: Defaults to `any`.
        cedarText:
          type: string
          description: >-
            Advanced (#610): a hand-written Cedar `forbid`, held to the guardrail
            shape (forbid-only, contained to the attach node, not self-locking).
            Sent instead of the matchers — the two together are a `400`.
        enabled:
          type: boolean
          default: true

    IAMGuardrailUpdateRequest:
      type: object
      description: >-
        Partial update; omitted fields are left unchanged. A guardrail's input
        mode is fixed at creation: send matcher fields for a matcher-built
        guardrail, `cedarText` for an authored one — the wrong mode's fields are
        a `400`.
      properties:
        description:
          type: string
        actions:
          type: array
          items:
            type: string
        principalMatch:
          $ref: "#/components/schemas/IAMGuardrailPrincipalMatch"
        resourceMatch:
          $ref: "#/components/schemas/IAMGuardrailResourceMatch"
        cedarText:
          type: string
          description: >-
            Advanced (#610): edit an authored guardrail's Cedar text. Rejected
            on a matcher-built guardrail.
        enabled:
          type: boolean

    IAMGuardrailListResponse:
      type: object
      required: [node, guardrails]
      properties:
        node:
          $ref: "#/components/schemas/IAMNode"
        ancestors:
          type: array
          description: >-
            Present only when the effective set was requested: the chain the
            answer was assembled from, resource first.
          items:
            $ref: "#/components/schemas/IAMNode"
        guardrails:
          type: array
          items:
            $ref: "#/components/schemas/IAMGuardrail"

    IAMPolicySetVersion:
      type: object
      description: >-
        One entry in the append-only policy-set version log. `reason` and
        `changedBy` make "why did the policy set change?" answerable.
      required: [version, reason]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        reason:
          type: string
        changedBy:
          type: string
          format: uuid
          description: The user behind the change; absent for system-driven bumps.
        createdAt:
          type: string
          format: date-time

    IAMPolicySetVersionResponse:
      type: object
      required: [version, replicaVersion]
      properties:
        version:
          type: integer
          description: The version in the database — what a write would build on.
        replicaVersion:
          type: integer
          description: The version the replica serving this request has observed.
        latest:
          allOf:
            - $ref: "#/components/schemas/IAMPolicySetVersion"
          description: The newest version-log entry, absent when the log is empty.

    IAMDecisionLogEntry:
      type: object
      description: >-
        One canonical authorization decision record. `action`, `nodeType`,
        and `nodeID` identify the exact question Cedar evaluated. A node-less
        credential refusal has no action or node.
        `credentialType`/`credentialID` name the API key or CLI session the
        request arrived on, on allows as well as denies (STR-115).
      required:
        - id
        - subject
        - decision
        - determiningPolicies
      properties:
        id:
          type: string
          format: uuid
        requestID:
          type: string
        path:
          type: string
        method:
          type: string
        subject:
          type: string
          description: The principal the check was made for.
        action:
          type: string
          description: The canonical action Cedar evaluated.
        nodeType:
          type: string
        nodeID:
          type: string
          format: uuid
        credentialType:
          type: string
          description: >-
            The credential the request authenticated with — `api_key` or
            `cli_session`. Absent for a browser session or an agent JWT-SVID.
          enum: [api_key, cli_session]
        credentialID:
          type: string
          format: uuid
        organizationID:
          type: string
          format: uuid
        decision:
          type: string
          description: >-
            `allow`, `deny`, or `credential_restricted` for current rows.
            Older retained rows can contain a historical decision value.
        determiningPolicies:
          type: array
          items:
            type: string
        tier:
          type: string
          description: Which policy tier decided — platform policy, guardrail, or binding.
        cedarErrors:
          type: string
        policyVersion:
          type: integer
          description: The policy-set version in force when the decision was made.
        skippedConditionedBindings:
          type: integer
        createdAt:
          type: string
          format: date-time

    IAMDecisionSummaryBucket:
      type: object
      description: >-
        One decision bucket grouped by canonical action, verdict, and tier.
      required: [decision, count]
      properties:
        action:
          type: string
        decision:
          type: string
        tier:
          type: string
        count:
          type: integer

