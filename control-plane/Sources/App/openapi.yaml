      summary: Update a volume's metadata
      tags: [Volumes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVolumeRequest"
      responses:
        "200":
          description: The updated volume.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Volume"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteVolume
      summary: Delete a volume
      description: >-
        Accepted, not performed. The volume is marked absent and its row
        survives until its agent confirms the data is gone; a client follows the
        delete through `GET /api/operations/{operationID}` with the returned
        `mutationId`, because a volume that is deleted and one that never
        existed both answer `404`.
      tags: [Volumes]
      responses:
        "202": { $ref: "#/components/responses/AcceptedVolumeMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/volumes/{volumeId}/attach:
    parameters:
      - $ref: "#/components/parameters/VolumeID"
    post:
      operationId: attachVolume
      summary: Attach a volume to a VM
      description: >-
        Requires `attach` on the volume and `update` on the VM. Refused with
        `400` when the two belong to different projects — the status every
        cross-project refusal answers with.


        A `vmId` this caller cannot reach is answered `404`, whether no such VM
        exists or the caller merely lacks `update` on it: the two are
        deliberately indistinguishable, so the endpoint cannot be used to probe
        which VM ids exist. `403` on this endpoint therefore refers to the
        volume, never to the VM.
      tags: [Volumes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachVolumeRequest"
      responses:
        "202": { $ref: "#/components/responses/AcceptedVolumeMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/volumes/{volumeId}/detach:
    parameters:
      - $ref: "#/components/parameters/VolumeID"
    post:
      operationId: detachVolume
      summary: Detach a volume from its VM
      tags: [Volumes]
      responses:
        "202": { $ref: "#/components/responses/AcceptedVolumeMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/volumes/{volumeId}/resize:
    parameters:
      - $ref: "#/components/parameters/VolumeID"
    post:
      operationId: resizeVolume
      summary: Grow a volume
      description: >-
        Grows a volume to a new size. Grow-only: a smaller size is rejected with
        `400`, because truncating a disk image destroys whatever the guest had
        written past the new end. Accepted for **attached and detached volumes
        alike** — choosing whether to grow the image online or offline is the
        owning agent's decision, since only it knows whether a hypervisor holds
        the image open.


        Growing the block device does **not** grow the filesystem on it. Expand
        the guest filesystem yourself afterwards (`resize2fs`, `xfs_growfs`, or
        the Windows equivalent); some guests also need a device rescan before
        they notice the new capacity.


        No agent implements an online grow path yet. A volume attached to a
        *running* guest is therefore accepted here and then refused by the
        agent, surfacing as a degraded condition until the agent-side work
        lands. That refusal is deliberate rather than a gap: the offline path
        would otherwise rewrite disk metadata underneath a live guest on any
        pool whose file locking is unreliable. A volume attached to a *stopped*
        VM grows normally. Asynchronous either way: refetch the volume until its
        `conditions` converge.
      tags: [Volumes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResizeVolumeRequest"
      responses:
        "202": { $ref: "#/components/responses/AcceptedVolumeMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/volumes/{volumeId}/io-limits:
    parameters:
      - $ref: "#/components/parameters/VolumeID"
    post:
      operationId: setVolumeIOLimits
      summary: Replace a volume's I/O limits
      description: >-
        Replaces the volume's absolute I/O ceilings. This is a **full
        replacement**: a field you omit clears that cap. Zero is rejected with
        `400` rather than treated as unlimited, so a typo cannot be mistaken for
        a deliberate removal — omit the field instead.


        **`conditions` converging does not mean the caps are in effect.** For
        every other volume mutation, convergence is the outcome; for this one it
        only means the owning agent accepted the sync carrying the request. An
        agent with no throttling support plans no work, reports the new
        generation, and converges — so a client that polls `conditions` alone
        will record an unenforced cap as applied.


        The applied signal is `appliedIOLimits` on the volume. Compare it
        against `ioLimits`: equal means the ceilings are in force, and a set
        `ioLimits` with `appliedIOLimits` omitted means they are not.


        No agent enforces ceilings yet, so today `appliedIOLimits` is always
        absent and every request is a recorded intent rather than an enforced
        limit.
      tags: [Volumes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetVolumeIOLimitsRequest"
      responses:
        "202": { $ref: "#/components/responses/AcceptedVolumeMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/volumes/{volumeId}/snapshot:
    parameters:
      - $ref: "#/components/parameters/VolumeID"
    post:
      operationId: createVolumeSnapshot
      summary: Snapshot a volume
      description: >-
        Captures a point-in-time copy of the volume's data as a qcow2 overlay.
        The volume must be detached — a snapshot of a volume a guest is writing
        would not be point-in-time. Asynchronous — refetch the snapshot until
        its `conditions` converge.
      tags: [Volumes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVolumeSnapshotRequest"
      responses:
        "202": { $ref: "#/components/responses/AcceptedVolumeSnapshotMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/volumes/{volumeId}/clone:
