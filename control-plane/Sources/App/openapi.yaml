      schema:
        type: string
        default: backward
        enum: [forward, backward]
    LogStartQuery:
      name: start
      in: query
      required: false
      description: Start of the time range, as a Unix timestamp in seconds.
      schema:
        type: number
        format: double
    LogEndQuery:
      name: end
      in: query
      required: false
      description: End of the time range, as a Unix timestamp in seconds.
      schema:
        type: number
        format: double

  responses:
    NoContent:
      description: Success with no response body.
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller is authenticated but not authorized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist or is not visible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The uploaded body exceeded the size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    # `AcceptedOperation` went with the last mutation that answered in it: VM
    # restart and the two restores became generation-backed at ADR 0001 stage 9
    # (STR-151). Every accepted mutation now returns its resource plus the
    # generation to wait for; `GET /api/operations/{id}` survives as a façade
    # over the audit trail, the table behind it having been dropped in STR-152.
    AcceptedVMMutation:
      description: >-
        The mutation was accepted. Refetch the VM until its `conditions` report
        `observedGeneration >= targetGeneration` with `converged` true, or
        `degraded.sinceGeneration == targetGeneration` — the failure, with the
        agent's reason. Exactly one of the two ever holds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AcceptedVMMutation"
    AcceptedSandboxMutation:
      description: >-
        The mutation was accepted. Refetch the sandbox until its `conditions`
        report `observedGeneration >= targetGeneration` with `converged` true,
        or `degraded.sinceGeneration == targetGeneration` — the failure, with
        the agent's reason. Exactly one of the two ever holds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AcceptedSandboxMutation"
    AcceptedVolumeMutation:
      description: >-
        The mutation was accepted. Refetch the volume until its `conditions`
        report `observedGeneration >= targetGeneration` with `converged` true,
        or `degraded.sinceGeneration == targetGeneration` — the failure, with
        the agent's reason. Exactly one of the two ever holds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AcceptedVolumeMutation"
    AcceptedVMSnapshotMutation:
      description: >-
        The mutation was accepted. Refetch the checkpoint until its `conditions`
        report `observedGeneration >= targetGeneration` with `converged` true,
        or `degraded.sinceGeneration == targetGeneration` — the failure, with
        the agent's reason. Exactly one of the two ever holds.
        A delete's completion is the checkpoint's absence — poll
        `GET /api/operations/{mutationId}` for that one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AcceptedVMSnapshotMutation"
    AcceptedSandboxSnapshotMutation:
      description: >-
        The mutation was accepted. Refetch the snapshot until its `conditions`
        report `observedGeneration >= targetGeneration` with `converged` true,
        or `degraded.sinceGeneration == targetGeneration` — the failure, with
        the agent's reason. Exactly one of the two ever holds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AcceptedSandboxSnapshotMutation"
    AcceptedVolumeSnapshotMutation:
      description: >-
        The mutation was accepted. Refetch the snapshot until its `conditions`
        report `observedGeneration >= targetGeneration` with `converged` true,
        or `degraded.sinceGeneration == targetGeneration` — the failure, with
        the agent's reason. Exactly one of the two ever holds.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AcceptedVolumeSnapshotMutation"
    LogBackendUnavailable:
      description: The log backend (Loki) could not be queried.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      description: The standard error envelope.
      required: [error, reason]
      properties:
        error:
          type: boolean
          description: Always true on an error response.
        reason:
          type: string
          description: A human-readable explanation.

    HealthStatus:
      type: object
      description: A health/readiness/liveness report.
      required: [status]
      properties:
        status:
          type: string
      additionalProperties: true

    AcceptedVMMutation:
      type: object
      description: >-
        The body of a `202` from a VM lifecycle mutation. The VM as the
        mutation left it, plus the generation it now has to converge on.


        Done means the VM's `conditions` report `converged` with
        `observedGeneration >= targetGeneration`; failed means
        `conditions.degraded.sinceGeneration == targetGeneration`, with the
        agent's reason. The two are mutually exclusive, so exactly one of them
        ever answers. Both are readable from `GET /api/vms/{vmID}` — no
        operation object is involved.


        `mutationId` names the audit record of the request, and is what
        `GET /api/operations/{operationID}` answers for. Its one *necessary*
        use is `deleteVM`: a delete succeeds by the VM ceasing to exist, and a
        client polling the VM would see a `404` that means deleted,
        never-existed and not-authorized alike.
      required: [resource, targetGeneration, mutationId]
      properties:
        resource:
          $ref: "#/components/schemas/VMDetail"
        targetGeneration:
          type: integer
          format: int64
          description: The generation the VM's `observedGeneration` must reach.
        mutationId:
          type: string
          format: uuid

    AcceptedSandboxMutation:
      type: object
      description: >-
        The body of a `202` from a sandbox lifecycle mutation — the sandbox
        counterpart of `AcceptedVMMutation`, with the same contract.
      required: [resource, targetGeneration, mutationId]
      properties:
        resource:
          $ref: "#/components/schemas/SandboxDetail"
        targetGeneration:
          type: integer
          format: int64
          description: The generation the sandbox's `observedGeneration` must reach.
        mutationId:
          type: string
          format: uuid

    AcceptedVolumeMutation:
      type: object
      description: >-
        The body of a `202` from a volume lifecycle mutation — the volume
        counterpart of `AcceptedVMMutation`, with the same contract. Volumes
        joined the reconciliation loop in ADR 0001 stage 5.
      required: [resource, targetGeneration, mutationId]
      properties:
        resource:
          $ref: "#/components/schemas/Volume"
        targetGeneration:
          type: integer
          format: int64
          description: The generation the volume's `observedGeneration` must reach.
        mutationId:
          type: string
          format: uuid

    AcceptedVMSnapshotMutation:
      type: object
      description: >-
        The body of a `202` from a checkpoint mutation. Checkpoints joined the
        reconciliation loop in ADR 0001 stage 8: a capture and a delete are
        desired state the owning agent converges on, not commands it is sent.
      required: [resource, targetGeneration, mutationId]
      properties:
        resource:
          $ref: "#/components/schemas/VMSnapshot"
        targetGeneration:
          type: integer
          format: int64
        mutationId:
          type: string
          format: uuid

    AcceptedSandboxSnapshotMutation:
      type: object
      description: >-
        The body of a `202` from a sandbox-snapshot mutation, including export —
        which is a placement fact ("this snapshot should also exist in project
        storage") rather than a verb.
      required: [resource, targetGeneration, mutationId]
      properties:
        resource:
          $ref: "#/components/schemas/SandboxSnapshot"
        targetGeneration:
          type: integer
          format: int64
        mutationId:
          type: string
          format: uuid

    AcceptedVolumeSnapshotMutation:
      type: object
      description: The body of a `202` from a volume-snapshot mutation.
      required: [resource, targetGeneration, mutationId]
      properties:
        resource:
          $ref: "#/components/schemas/VolumeSnapshot"
        targetGeneration:
          type: integer
          format: int64
        mutationId:
          type: string
          format: uuid

    ResourceOperation:
      type: object
      description: >-
        The operation view of one asynchronous resource lifecycle mutation.
        Poll it until `status` is terminal.


        Synthesized on read from the mutation's audit record and the resource's
        `conditions` — there is no operations table behind it — so a client
        written against the older contract keeps working. `completedAt` is
        reported only for a completed delete, which is the one outcome recorded
        rather than derived.
      required: [vmId, resourceKind, resourceId, kind, status]
      properties:
        id:
          type: string
          format: uuid
        vmId:
          type: string
          format: uuid
          description: >-
            Legacy field equal to `resourceId`; retained for existing clients.
            New clients should read `resourceKind`/`resourceId`.
        resourceKind:
          $ref: "#/components/schemas/OperationResourceKind"
        resourceId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/OperationKind"
        status:
          $ref: "#/components/schemas/OperationStatus"
        error:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    OperationResourceKind:
      type: string
      description: Which kind of resource a mutation acts on.
      enum: [virtual_machine, sandbox]
    OperationKind:
      type: string
      description: The lifecycle mutation an operation performs.
      enum:
        - create
        - boot
        - shutdown
        - reboot
        - pause
        - resume
        - delete
        - resize
        - snapshot
        - snapshot_delete
        - restore
        - snapshot_export
        # Volume-only kinds. `attach`/`detach` arrived with STR-148 and were
        # never added here; `throttle` is STR-19.
        - attach
        - detach
        - throttle
    OperationStatus:
      type: string
      description: The state of an operation. `pending` is the only non-terminal value.
      enum: [pending, succeeded, failed]

    HypervisorType:
      type: string
      enum: [qemu, firecracker]
    MetadataSource:
      type: string
      description: Where the VM reads its first-boot guest configuration.
      enum: [iso, imds]
    CPUArchitecture:
      type: string
      enum: [x86_64, arm64]

    CreateVMRequest:
      type: object
      required: [name, projectId]
      properties:
        name:
          type: string
        hostname:
          type: string
          description: >-
            The VM's DNS label. Defaults to a slugified `name`, disambiguated
            with a numeric suffix against whatever already registers into the
            target network's primary zone. An explicit value is instead held to
            strict uniqueness and answers `409` on a collision.
        description:
          type: string
        imageId:
          type: string
          format: uuid
          description: Required in practice; the source image to boot from.
        projectId:
          type: string
          format: uuid
        environment:
          type: string
        cpu:
          type: integer
          maximum: 512
        memory:
          type: integer
          format: int64
          description: Memory in bytes.
          maximum: 70368744177664
        disk:
          type: integer
          format: int64
          description: Disk in bytes.
          maximum: 281474976710656
        maxCpu:
          type: integer
          description: >-
            Ceiling for online vCPU growth (issue #568). Defaults to `cpu` (no
            headroom); fixed for the life of a running hypervisor process.
          maximum: 512
        maxMemory:
          type: integer
          format: int64
          description: >-
            Ceiling for online memory growth in bytes. Defaults to `memory`.
          maximum: 70368744177664
        cmdline:
          type: string
        networkId:
          type: string
          format: uuid
          description: >-
            Logical network for the VM's NIC, within the VM's own project.
            Exactly one of `networkId` or `networkName` is required — there is
            no default network to fall back to.
        networkName:
          type: string
          description: Name of that network within the project. Mutually exclusive with `networkId`.
        networkInterfaces:
          type: array
          minItems: 1
          maxItems: 8
          description: >-
            Interfaces to create in stable slot order. Do not combine this with
            `networkId`, `networkName`, or scalar `securityGroupIds`. Creation
            requires either this array or the legacy scalar network form.
          items:
            $ref: "#/components/schemas/CreateVMNetworkInterfaceRequest"
        sshPublicKey:
          type: string
        userData:
          type: string
          description: cloud-init user data.
        hypervisorType:
          $ref: "#/components/schemas/HypervisorType"
        secureBoot:
          type: boolean
          default: false
          description: >-
            Boot the guest with UEFI Secure Boot. Requires a QEMU VM placed on
            an agent new enough to realize the machine profile; rejected for
            firecracker, which boots a kernel directly with no UEFI.
        tpm:
          type: boolean
          default: false
          description: >-
            Give the guest an emulated TPM 2.0. Only agents advertising
            `tpmCapable` (swtpm installed) are eligible; rejected for
            firecracker. Windows 11 and Server 2025 require this together with
            `secureBoot`.
        guestAgentEnabled:
          type: boolean
          default: false
          description: >-
            Attach Strato's fixed-CID virtio-vsock channel for the in-guest
            daemon. This is distinct from QEMU guest agent (qga), is supported
            only for QEMU VMs, and is fixed at creation because it changes the
            domain's PCI device topology.
        graphicsConsole:
          type: boolean
          default: false
          description: >-
            Give the guest a display device and a VNC server, so its
            framebuffer can be driven from the web UI — what a graphical OS
            installer needs. Requires a QEMU VM placed on an agent new enough
            to realize it; rejected for firecracker, which emulates no display
            device. Fixed at creation: the display lives in the hypervisor
            process's arguments, so an existing VM cannot gain or lose one.
        securityGroupIds:
          type: array
          items:
            type: string
            format: uuid
          description: >-
            Security groups for the VM's NIC (same project, at most 5).
            Omitted or empty means the project's default group — every NIC
            belongs to at least one group.
        metadataEnabled:
          type: boolean
          default: true
          description: >-
            Whether the instance metadata service answers this VM. Turning it
            off denies the guest `169.254.169.254` and `[fd00:ec2::254]`
            outright — the listener refuses it and an OVN ACL drops its packets
            — which is what hardening one workload against SSRF needs, and what
            the per-network `metadataEnabled` is too coarse to give. Note that
            a VM using `metadataSource: imds` also needs this service to fetch
            its cloud-init configuration. Requires an agent new enough to
            honour it; placement is constrained to such agents.
        metadataSource:
          allOf:
            - $ref: "#/components/schemas/MetadataSource"
          default: iso
          description: >-
            Where cloud-init reads the guest bootstrap. `iso` preserves the
            complete immutable NoCloud seed. `imds` keeps `network-config` and
            a `seedfrom` stub on the ISO, then fetches meta-data and user-data
            from a per-VM capability URL on `169.254.169.254`. Fixed at VM
            creation.
    CreateVMNetworkInterfaceRequest:
      type: object
      description: >-
        One VM network interface. Exactly one of `networkId` or `networkName`
        is required and is resolved inside the VM's project.
      properties:
        networkId:
          type: string
          format: uuid
        networkName:
          type: string
        securityGroupIds:
          type: array
          maxItems: 5
          items:
            type: string
            format: uuid
          description: Omitted or empty uses the project's default security group.
        mtu:
          type: integer
          minimum: 68
          maximum: 65535
          description: Must be at least 1280 when the selected network has IPv6 enabled.
    UpdateVMRequest:
      type: object
      properties:
        name:
          type: string
        hostname:
          type: string
          description: >-
            The VM's DNS label. Renaming the VM deliberately does not move its
            records, so this is the only way its name in DNS changes.
        description:
          type: string
        cpu:
          type: integer
          description: >-
            Target boot vCPU count. On a running VM with confirmed sizing it
            must be at least the current count and must not exceed `maxCpu`;
            reduce it while stopped. A smaller target may replace growth that
            has not converged yet.
          maximum: 512
        memory:
          type: integer
          format: int64
          description: >-
            Target memory in bytes. On a running VM it must not exceed `maxMemory`.
          maximum: 70368744177664
        metadataEnabled:
          type: boolean
          description: >-
            Whether the instance metadata service answers this VM. Editable on a
            running VM and applied without a restart. Switching it *off* is
            refused with `409` when the VM sits on an agent too old to honour
            it, rather than reported as applied while the guest keeps reading
            its metadata.
    VMDetail:
      type: object
      required:
        - name
        - description
        - image
        - status
        - cpu
        - maxCpu
        - memory
        - maxMemory
        - memoryFormatted
        - disk
        - diskFormatted
        - networkInterfaces
        - conditions
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hostname:
          type: string
          description: >-
            The VM's DNS label — what it registers as in the primary zone of
            each network it sits on. Distinct from `observedHostname`, which is
            whatever the guest OS calls itself.
        description:
          type: string
        image:
          type: string
        imageId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/VMStatus"
        hypervisorType:
          $ref: "#/components/schemas/HypervisorType"
        hypervisorId:
          type: string
        cpu:
          type: integer
        maxCpu:
          type: integer
        memory:
          type: integer
          format: int64
        memoryFormatted:
          type: string
          description: Display form of `memory` in binary units (e.g. `4 GiB`, `512 MiB`).
        maxMemory:
          type: integer
          format: int64
          description: Ceiling for online memory growth; equals `memory` without headroom.
        disk:
          type: integer
          format: int64
        diskFormatted:
          type: string
          description: Display form of `disk` in binary units (e.g. `40 GiB`).
        networkInterfaces:
          type: array
          items:
            $ref: "#/components/schemas/NetworkInterface"
        secureBoot:
          type: boolean
          description: Whether the guest boots with UEFI Secure Boot.
        tpmEnabled:
          type: boolean
          description: Whether the guest has an emulated TPM 2.0.
        guestAgentEnabled:
          type: boolean
          description: >-
            Whether this VM was created with Strato's virtio-vsock guest-agent
            channel. Distinct from `qgaAvailable`.
        graphicsConsole:
          type: boolean
          description: >-
            Whether the guest has a display device whose framebuffer the web UI
            can attach to. Fixed at creation.
        metadataEnabled:
          type: boolean
          description: >-
            Whether the instance metadata service answers this VM. This is the
            VM's own switch, not the effective answer: a VM on a network with
            metadata turned off still reports `true` here unless someone turned
            it off for this VM.
        metadataSource:
          allOf:
            - $ref: "#/components/schemas/MetadataSource"
          description: >-
            Where this VM reads its first-boot guest configuration. Fixed at
            creation; VMs created before STR-64 report `iso`.
        qgaAvailable:
          type: boolean
          description: >-
            Whether the guest agent is responding. Absent until the agent's slow
            poll has seen the guest once.
        observedHostname:
          type: string
          description: >-
            What the guest OS calls itself, when it reported one. Distinct from
            `hostname`, which is the DNS label Strato registers it under.
        guestMemoryTotalBytes:
          type: integer
          format: int64
          description: >-
            Total RAM the guest itself reports, via the virtio-balloon device.
            Absent until a guest with the driver reports.
        guestMemoryAvailableBytes:
          type: integer
          format: int64
          description: Free RAM the guest itself reports. Absent alongside `guestMemoryTotalBytes`.
        guestMemoryUsedBytes:
          type: integer
          format: int64
          description: >-
            Derived as `guestMemoryTotalBytes - guestMemoryAvailableBytes` — the
            committed-vs-used figure most callers want.
        guestMemoryUsedFormatted:
          type: string
          description: Display form of `guestMemoryUsedBytes` in binary units (e.g. `1.4 GiB`).
        guestMemoryStatsAt:
          type: string
          format: date-time
          description: When the guest last reported the memory figures above.
        balloonTarget:
          type: integer
          format: int64
          description: >-
            The size an operator asked the guest to be held to. Absent on a VM
            with no target set.
        balloonTargetFormatted:
          type: string
          description: Display form of `balloonTarget` in binary units (e.g. `2 GiB`).
        guestMemoryBalloonActualBytes:
          type: integer
          format: int64
          description: >-
            What the balloon has actually reached. Sits above `balloonTarget`
            while a newly set target is still being applied.
        securityGroupsEnforced:
          type: boolean
          description: >-
            Whether this VM's attached security groups are actually being
            enforced. False means a realizing agent — the host, or its site's
            network controller — registered with a protocol too old for
            security groups, or the site has no usable network controller to
            author the ACLs at all; either way the attached groups filter
            nothing until an operator fixes it. Absent means the VM is
            unplaced, so there is no realizer to judge yet.
        spiffeId:
          type: string
          description: >-
            The VM's SPIFFE instance identity —
            `spiffe://<trust-domain>/vm/<vm-id>`, the lookup key its workload
            registration is filed under. A name, never an authorization: what
            the identity may do comes from role bindings against that
            principal, and a registration with none authorizes nothing. Absent
            means either an older control plane that does not report the field,
            or a registration an administrator revoked — never that the VM is
            exempt.
        conditions:
          $ref: "#/components/schemas/ResourceConditions"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ResourceConditions:
      type: object
      description: >-
        How far a resource is from the state the API was last asked to put it
        in. Derived on read from the resource's own generation counters and the
        convergence progress its agent reports — polling this block is the
        supported alternative to polling the operation a mutation returned.
      required: [converged, targetGeneration, observedGeneration]
      properties:
        converged:
          type: boolean
          description: >-
            Whether the owning agent has confirmed converging to
            `targetGeneration`, what it observes satisfies the desired state,
            and no attempt at that same generation is on record as having
            failed. False whenever `degraded.sinceGeneration` equals
            `targetGeneration` — the two are mutually exclusive, so a client
            always has exactly one verdict. Always false once a delete is in
            flight: a terminating resource is on its way out, not converging on
            anything, and it disappears when the last finalizer clears rather
            than settling.
        targetGeneration:
          type: integer
          format: int64
          description: The generation the resource is trying to reach — what the last mutation bumped it to.
        observedGeneration:
          type: integer
          format: int64
          description: >-
            The newest generation the owning agent has confirmed converging to.
            0 means no agent has ever confirmed this resource.
        phase:
          type: string
          description: >-
            The agent's human-readable current step (e.g. "downloading image"),
            present only while it is actively working toward
            `targetGeneration`. Absent does not mean idle — an unplaced
            resource, or one whose agent is offline, reports no phase either.
        degraded:
          allOf:
            - $ref: "#/components/schemas/DegradedCondition"
          description: >-
            The last convergence attempt that failed, or absent if the most
            recent attempt succeeded. Can be present alongside a newer
            `targetGeneration` while a retry is in flight.
    DegradedCondition:
      type: object
      description: Why a resource is not converging, and since when.
      required: [reason, sinceGeneration]
      properties:
        reason:
          type: string
          description: The agent's error from the failed attempt, verbatim.
        sinceGeneration:
          type: integer
          format: int64
          description: >-
            The generation whose convergence produced `reason`. Compare with
            `targetGeneration` to tell a failure of the state currently being
            pursued from one a newer mutation has already superseded. Equal to
            `targetGeneration` means this is the current state's verdict, and
            `converged` is false alongside it.
        lastErrorAt:
          type: string
          format: date-time
          description: >-
            When this error and generation pair was first observed. Repeated
            agent heartbeats leave it unchanged; successful convergence clears
            the degraded condition. Absent for resource kinds that do not
            persist convergence-failure timestamps.
    VMStatus:
      type: string
      description: The observed VM state (tolerant decoding; unknown values map to Unknown).
      enum:
        - Created
        - Running
        - Shutdown
        - Paused
        - Starting
        - Stopping
        - Error
        - Unknown
    NetworkInterface:
      type: object
      required: [networkId, macAddress, addresses, deviceName, orderIndex, attachmentState]
      properties:
        id:
          type: string
          format: uuid
        networkId:
          type: string
          format: uuid
          description: The logical network this NIC attaches to.
        network:
          type: string
          description: >-
            Display name of the network. Present only when the response
            eager-loaded it; names are unique per project, so the id is the
            reference.
        macAddress:
          type: string
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/InterfaceAddress"
        observedAddresses:
          type: array
          description: >-
            Addresses the guest actually configured, as reported by the guest
            agent — distinct from the allocated `addresses`. Empty until a
            guest agent reports them.
          items:
            $ref: "#/components/schemas/ObservedInterfaceAddress"
        mtu:
          type: integer
        deviceName:
          type: string
          description: Stable device name (e.g. net0).
        orderIndex:
          type: integer
        attachmentState:
          type: string
          enum: [attaching, attached, detaching, attach_failed, detach_failed]
        attachmentError:
          type: string
          description: The current generation's convergence error for this interface, when failed.
        securityGroupIds:
          type: array
          description: >-
            The security groups filtering this NIC. Absent — as opposed to an
            empty array — means the server did not load membership for this
            response, never that the NIC is in no group.
          items:
            type: string
            format: uuid
    InterfaceAddress:
      type: object
      required: [family, address, prefixLength]
      properties:
        family:
          type: string
          enum: [ipv4, ipv6]
        address:
          type: string
        prefixLength:
          type: integer
        gateway:
          type: string
    ObservedInterfaceAddress:
      type: object
      description: >-
        An address the guest reported on this NIC. No gateway: the guest
        reports what it configured, not how it routes.
      required: [family, address]
      properties:
        family:
          type: string
          enum: [ipv4, ipv6]
        address:
          type: string
        prefixLength:
          type: integer

    CreateSandboxRequest:
      type: object
      required: [name, projectId]
      properties:
        name:
          type: string
        image:
          type: string
          description: OCI image reference.
        restoreFrom:
          type: string
          format: uuid
          description: >-
            Snapshot id to fork from; mutually exclusive with
            image/cpus/memory. A fork inherits the checkpoint's NIC shape: it
            takes the source sandbox's network unless `networkId`/`networkName`
            names one, and is refused if it names a network the checkpoint has
            no device for.
        projectId:
          type: string
          format: uuid
        environment:
          type: string
        cpus:
          type: integer
          maximum: 512
        memory:
          type: integer
          format: int64
          description: Guest memory in bytes.
          maximum: 70368744177664
        entrypoint:
          type: array
          items:
            type: string
        cmd:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        workingDir:
          type: string
        ttlSeconds:
          type: integer
        networkId:
          type: string
          format: uuid
          description: >-
            Logical network for the sandbox's NIC, within its own project.
            Mutually exclusive with `networkName`; omitting both attaches no
            NIC — except on a fork, which then inherits the source sandbox's
            network. The sandbox only places on a host that advertises sandbox
            networking.
        networkName:
          type: string
        securityGroupIds:
          type: array
          description: >-
            Security groups for the sandbox's NIC. Omitting them attaches the
            project's default group — never "no groups"; supplying them without
            a network is a 400, since there would be no NIC to attach them to.
            See `securityGroupsEnforced` on the sandbox for whether they filter
            anything yet.
          items:
            type: string
            format: uuid
    UpdateSandboxRequest:
      type: object
      properties:
        name:
          type: string
        ttlSeconds:
          type: integer
    SandboxDetail:
      type: object
      required:
        - name
        - environment
        - image
        - cpus
        - memory
        - env
        - status
        - conditions
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        projectId:
          type: string
          format: uuid
        environment:
          type: string
        image:
          type: string
        imageDigest:
          type: string
        cpus:
          type: integer
        memory:
          type: integer
          format: int64
        entrypoint:
          type: array
          items:
            type: string
        cmd:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        workingDir:
          type: string
        ttlSeconds:
          type: integer
        expiresAt:
          type: string
          format: date-time
        hypervisorId:
          type: string
        restoredFromSnapshotId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/SandboxStatus"
        exitCode:
          type: integer
        securityGroupIds:
          type: array
          description: >-
            The security groups attached to the sandbox's NIC (flat: a sandbox
            has at most one). Absent when the sandbox has no NIC. Kept
            alongside the per-NIC copy on `networkInterfaces` for clients that
            predate it. Whether these groups filter anything is a separate
            question — see `securityGroupsEnforced`.
          items:
            type: string
            format: uuid
        networkInterfaces:
          type: array
          description: >-
            The sandbox's NICs — at most one today, but a list for parity with
            the VM response.
          items:
            $ref: "#/components/schemas/SandboxNetworkInterface"
        securityGroupsEnforced:
          type: boolean
          description: >-
            Whether this sandbox's attached security groups are actually being
            enforced. Absent means the sandbox has no NIC, so there is nothing
            to judge — not a claim that they are unenforced. False today for
            every networked sandbox: sandbox guest networking is not yet
            enabled, so no OVN port exists to join the groups' port groups.
        conditions:
          $ref: "#/components/schemas/ResourceConditions"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SandboxNetworkInterface:
      type: object
      required: [networkId, macAddress, addresses, deviceName]
      description: >-
        A sandbox's NIC. The sandbox analogue of `NetworkInterface`, without
        `orderIndex` (sandboxes are single-NIC) or `observedAddresses` (which
        need a guest agent).
      properties:
        id:
          type: string
          format: uuid
        networkId:
          type: string
          format: uuid
          description: The logical network this NIC attaches to.
        network:
          type: string
          description: >-
            Display name of the network. Present only when the response
            eager-loaded it; names are unique per project, so the id is the
            reference.
        macAddress:
          type: string
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/InterfaceAddress"
        mtu:
          type: integer
        deviceName:
          type: string
          description: Stable device name (always net0 today).
        securityGroupIds:
          type: array
          description: >-
            The security groups attached to this NIC. Absent — as opposed to an
            empty array — means the server did not load membership for this
            response, never that the NIC is in no group.
          items:
            type: string
            format: uuid
    SandboxStatus:
      type: string
      enum: [Stopped, Running, Exited, Starting, Stopping, Error, Unknown]

    CreateSandboxSnapshotRequest:
      type: object
      properties:
        name:
          type: string
        stop:
          type: boolean
          description: When true, checkpoint and stop; defaults to false.
        ttlSeconds:
          type: integer
          description: >-
            How long to keep the snapshot. Omitted uses the fleet default
            (`SNAPSHOT_DEFAULT_TTL_SECONDS`, unset by default); `0` keeps it
            until someone deletes it, overriding that default. Resolved to an
            absolute `expiresAt` at creation.
