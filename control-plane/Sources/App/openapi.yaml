    CreateVolumeRequest:
      type: object
      required: [name, projectId, sizeGB]
      properties:
        name:
          type: string
        description:
          type: string
        projectId:
          type: string
          format: uuid
        environment:
          type: string
          description: >-
            Which of the project's environments the volume's bytes are charged
            to. Omit for the project's default, as VM and sandbox create do.
        sizeGB:
          type: integer
        format:
          $ref: "#/components/schemas/VolumeFormat"
        volumeType:
          $ref: "#/components/schemas/VolumeType"
        sourceImageId:
          type: string
          format: uuid
        iopsTotal:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Total (read + write) IOPS ceiling. Omit for uncapped; zero is
            rejected. Not enforced by any agent yet.
        bpsTotal:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Total (read + write) throughput ceiling in bytes per second. Omit
            for uncapped; zero is rejected. Not enforced by any agent yet.
    UpdateVolumeRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    AttachVolumeRequest:
      type: object
      required: [vmId]
      properties:
        vmId:
          type: string
          format: uuid
        deviceName:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$"
          description: >-
            Stable device identifier within the VM (e.g. disk1), unique per VM.
            Generated as the next free `disk<N>` when omitted. The charset is
            what a hypervisor accepts as an object id; anything else is refused
            with 400, and a name already taken on the VM with 409.
        bootOrder:
          type: integer
          minimum: 0
          description: >-
            Boot priority, lower first. Unique per VM: reusing one another
            attached volume already holds is refused with 409, since two disks
            at one priority make the order of both arbitrary.
        readonly:
          type: boolean
    ResizeVolumeRequest:
      type: object
      required: [sizeGB]
      properties:
        sizeGB:
          type: integer
    SetVolumeIOLimitsRequest:
      type: object
      description: >-
        A full replacement of a volume's I/O ceilings: any field omitted here
        clears that cap. An empty object removes both. Zero is rejected rather
        than read as unlimited, so there is exactly one way to say uncapped.
      properties:
        iopsTotal:
          type: integer
          format: int64
          minimum: 1
          description: Total (read + write) IOPS ceiling. Omit to remove the cap.
        bpsTotal:
          type: integer
          format: int64
          minimum: 1
          description: >-
            Total (read + write) throughput ceiling in bytes per second. Omit to
            remove the cap.
    VolumeIOLimits:
      type: object
      description: >-
        Absolute per-volume I/O ceilings. A null member means uncapped in that
        dimension.
      properties:
        iopsTotal:
          type: integer
          format: int64
          nullable: true
          description: Total (read + write) IOPS ceiling, or null for uncapped.
        bpsTotal:
          type: integer
          format: int64
          nullable: true
          description: >-
            Total (read + write) throughput ceiling in bytes per second, or null
            for uncapped.
    CloneVolumeRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    CreateVolumeSnapshotRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        ttlSeconds:
          type: integer
          description: >-
            How long to keep the snapshot. Omitted uses the fleet default
            (`SNAPSHOT_DEFAULT_TTL_SECONDS`, unset by default); `0` keeps it
            until someone deletes it, overriding that default. Resolved to an
            absolute `expiresAt` at creation.
    Volume:
      type: object
      required:
        - name
        - description
        - environment
        - size
        - sizeFormatted
        - format
        - volumeType
        - status
        - readonly
        - conditions
        - replicas
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        projectId:
          type: string
          format: uuid
        environment:
          type: string
          description: >-
            The project environment this volume's bytes are charged to.
        size:
          type: integer
          format: int64
          description: >-
            The size asked for by the last accepted create or resize. A resize
            answers `202` and converges, so this moves when the mutation is
            accepted, not when the bytes do.
        sizeFormatted:
          type: string
          description: Display form of `size` in binary units (e.g. `10 GiB`).
        observedSize:
          type: integer
          format: int64
          nullable: true
          description: >-
            The size the owning agent reports the image actually has. Absent
            when no agent has reported one yet. Where it disagrees with `size` a
            grow is still outstanding — `conditions` says whether it is in
            flight or degraded.
        observedSizeFormatted:
          type: string
          nullable: true
          description: Display form of `observedSize` in binary units.
        format:
          $ref: "#/components/schemas/VolumeFormat"
        volumeType:
          $ref: "#/components/schemas/VolumeType"
        status:
          $ref: "#/components/schemas/VolumeStatus"
        errorMessage:
          type: string
        poolId:
          type: string
          format: uuid
        attachedAgentId:
          type: string
        replicas:
          type: array
          description: >-
            Every physical copy of the volume. Healthy and provisioning copies
            authoritatively define placement and agent-owned storage paths;
            other states remain visible for repair and observability.
          items:
            $ref: "#/components/schemas/VolumeReplica"
        vmId:
          type: string
          format: uuid
        deviceName:
          type: string
        bootOrder:
          type: integer
        readonly:
          type: boolean
          description: Whether the attachment presents the volume read-only.
        conditions:
          $ref: "#/components/schemas/ResourceConditions"
        ioLimits:
          allOf: [{ $ref: "#/components/schemas/VolumeIOLimits" }]
          description: >-
            The I/O ceilings requested for this volume. **Omitted entirely**
            when the volume is uncapped — the key is absent, not null, so test
            for presence rather than comparing against null.
        appliedIOLimits:
          allOf: [{ $ref: "#/components/schemas/VolumeIOLimits" }]
          description: >-
            The ceilings the owning agent reports it has actually applied, and
            the only signal that a cap is in force — `conditions` converging
            says the sync was accepted, not that the ceilings took effect.
            Compare against `ioLimits`: equal means in force.


            **Omitted** (again absent, not null) means they are *not* in effect,
            either because the agent has not reported any or because it reported
            none. No agent applies ceilings yet, so this key is absent on every
            volume; a set `ioLimits` alongside an absent `appliedIOLimits` is
            the expected reading today, not a fault.
        sourceImageId:
          type: string
          format: uuid
        sourceVolumeId:
          type: string
          format: uuid
        createdById:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VolumeReplica:
      type: object
      required: [agentId, state, generation]
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
        datasetPath:
          type: string
          nullable: true
          description: >-
            The agent-owned location of this physical copy. Null while a
            provisioning replica has not reported its location yet.
        state:
          type: string
          enum: [provisioning, healthy, degraded, resyncing, faulted]
        generation:
          type: integer
          format: int64
    VolumeSnapshot:
      type: object
      required: [name, description, environment, size, sizeFormatted, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        volumeId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        environment:
          type: string
          description: >-
            The project environment this snapshot's bytes are charged to.
        size:
          type: integer
          format: int64
          description: >-
            The parent volume's size when the snapshot was taken — what a
            restore sizes its target to, and what the storage quota admits
            against.
        sizeFormatted:
          type: string
          description: Display form of `size` in binary units (e.g. `10 GiB`).
        observedSize:
          type: integer
          format: int64
          nullable: true
          description: >-
            What the overlay actually occupies, as last reported by the owning
            agent. Null means no agent has said — the bytes are not on a host
            yet, or the agent predates wire v39. The storage quota keeps `size`
            reserved either way.
        observedSizeFormatted:
          type: string
          nullable: true
          description: Display form of `observedSize` in binary units.
        status:
          $ref: "#/components/schemas/VolumeSnapshotStatus"
        errorMessage:
          type: string
        agentId:
          type: string
          description: The agent holding the snapshot's overlay.
        expiresAt:
          type: string
          format: date-time
          description: >-
            When retention will delete this snapshot; absent means it is kept
            until someone deletes it.
        conditions:
          $ref: "#/components/schemas/ResourceConditions"
        createdById:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    VolumeFormat:
      type: string
      enum: [qcow2, raw]
    VolumeType:
      type: string
      enum: [boot, data]
    VolumeStatus:
      type: string
      enum:
        - creating
        - available
        - attaching
        - attached
        - detaching
        - resizing
        - snapshotting
        - cloning
        - deleting
        - error
    VolumeSnapshotStatus:
      type: string
      enum: [creating, available, deleting, error]

    CreateNetworkRequest:
      type: object
      required: [name, projectId, subnet, siteId]
      properties:
        name:
          type: string
        subnet:
          type: string
        gateway:
          type: string
        subnet6:
          type: string
        gateway6:
          type: string
        ipv6Enabled:
          type: boolean
        projectId:
          type: string
          format: uuid
        dhcpEnabled:
          type: boolean
        dnsServers:
          type: array
          items:
            type: string
          description: >-
            The network's resolvers. With `resolverEnabled` (the default) these
            are the upstream forwarders the network's built-in resolver sends
            misses to; with it off they are advertised to guests over DHCP
            verbatim.
        domainName:
          type: string
          maxLength: 253
          description: >-
            DHCP search domain for the network's guests. A sequence of RFC 1123
            labels — `corp.example.com` or a bare `internal` — stored lowercased
            and without a trailing dot. An empty string clears it.
        leaseTime:
          type: integer
        externalAccess:
          type: boolean
        metadataEnabled:
          type: boolean
          description: >-
            Whether the network publishes the link-local instance metadata
            service to its guests. Defaults true; this is an opt-out.
        resolverEnabled:
          type: boolean
          description: >-
            Whether the network gives its guests a DNS resolver at its own
            link-local address, serving the zones attached to the network in
            full — including the CNAME, TXT and SRV records the datapath cannot
            express — and forwarding everything else to `dnsServers` through the
            hypervisor's own egress. Defaults true. Enabling it allocates the
            network a resolver address pair, which is kept if it is later
            disabled.
        resolverAddresses:
          type: array
          items:
            type: string
          description: >-
            The addresses this network's guests resolve through, IPv4 first.
            Distinct per network, and absent until the resolver is first enabled.
        siteId:
          type: string
          format: uuid
    UpdateNetworkRequest:
      type: object
      properties:
        name:
          type: string
        subnet:
          type: string
        gateway:
          type: string
        subnet6:
          type: string
        gateway6:
          type: string
        ipv6Enabled:
          type: boolean
        dhcpEnabled:
          type: boolean
        dnsServers:
          type: array
          items:
            type: string
          description: >-
            The network's resolvers. With `resolverEnabled` (the default) these
            are the upstream forwarders the network's built-in resolver sends
            misses to; with it off they are advertised to guests over DHCP
            verbatim.
        domainName:
          type: string
          maxLength: 253
          description: >-
            DHCP search domain for the network's guests. A sequence of RFC 1123
            labels — `corp.example.com` or a bare `internal` — stored lowercased
            and without a trailing dot. An empty string clears it.
        leaseTime:
          type: integer
        externalAccess:
          type: boolean
        metadataEnabled:
          type: boolean
          description: >-
            Whether the network publishes the link-local instance metadata
            service to its guests. Defaults true; this is an opt-out.
        resolverEnabled:
          type: boolean
          description: >-
            Whether the network gives its guests a DNS resolver at its own
            link-local address, serving the zones attached to the network in
            full — including the CNAME, TXT and SRV records the datapath cannot
            express — and forwarding everything else to `dnsServers` through the
            hypervisor's own egress. Defaults true. Enabling it allocates the
            network a resolver address pair, which is kept if it is later
            disabled.
        primaryDnsZoneId:
          type: string
          format: uuid
          description: >-
            The DNS zone this network's VMs auto-register into. Must already be
            attached to the network.
        clearPrimaryDnsZone:
          type: boolean
          description: >-
            Unset the primary zone. A JSON `null` is indistinguishable from an
            omitted field, so the clear is its own flag.
    Network:
      type: object
      required:
        - name
        - subnet
        - projectId
        - attachedInterfaceCount
        - dhcpEnabled
        - dnsServers
        - externalAccess
        - metadataEnabled
        - resolverEnabled
        - siteId
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Unique within the owning project, not globally.
        subnet:
          type: string
        gateway:
          type: string
        subnet6:
          type: string
        gateway6:
          type: string
        projectId:
          type: string
          format: uuid
        attachedInterfaceCount:
          type: integer
          description: VM and sandbox interfaces attached to this network.
        dhcpEnabled:
          type: boolean
        dnsServers:
          type: array
          items:
            type: string
          description: >-
            The network's resolvers. With `resolverEnabled` (the default) these
            are the upstream forwarders the network's built-in resolver sends
            misses to; with it off they are advertised to guests over DHCP
            verbatim.
        domainName:
          type: string
        leaseTime:
          type: integer
        externalAccess:
          type: boolean
        metadataEnabled:
          type: boolean
          description: >-
            Whether the network publishes the link-local instance metadata
            service to its guests. Defaults true; this is an opt-out.
        resolverEnabled:
          type: boolean
          description: >-
            Whether the network gives its guests a DNS resolver at its own
            link-local address, serving the zones attached to the network in
            full — including the CNAME, TXT and SRV records the datapath cannot
            express — and forwarding everything else to `dnsServers` through the
            hypervisor's own egress. Defaults true. Enabling it allocates the
            network a resolver address pair, which is kept if it is later
            disabled.
        siteId:
          type: string
          format: uuid
        primaryDnsZoneId:
          type: string
          format: uuid
          description: The DNS zone this network's VMs auto-register into, if any.
        zoneResolutionWarning:
          type: string
          description: >-
            Why this network's guests will not resolve the DNS zones attached to
            it, with the remedy, or absent when they will — the network's
            resolver is off, its site cannot run one, or it has no address yet.
            Absent for a network with no attached zone, which has nothing to
            fail to deliver.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateFloatingIPPoolRequest:
      type: object
      description: Exactly one of organizationId / organizationalUnitId must be present.
      required: [name, cidr, siteId]
      properties:
        name:
          type: string
        cidr:
          type: string
        gateway:
          type: string
        siteId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        organizationalUnitId:
          type: string
          format: uuid
    UpdateFloatingIPPoolRequest:
      type: object
      required: [siteId]
      properties:
        gateway:
          type: string
        siteId:
          type: string
          format: uuid
    FloatingIPPool:
      type: object
      required: [id, name, cidr, siteId, allocatedCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cidr:
          type: string
        gateway:
          type: string
        siteId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        organizationalUnitId:
          type: string
          format: uuid
        allocatedCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    CreateFloatingIPRequest:
      type: object
      required: [poolId, projectId]
      properties:
        poolId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
    AttachFloatingIPRequest:
      type: object
      required: [vmId]
      properties:
        vmId:
          type: string
          format: uuid
        interfaceId:
          type: string
          format: uuid
    FloatingIP:
      type: object
      required: [id, address, poolId, projectId]
      properties:
        id:
          type: string
          format: uuid
        address:
          type: string
        poolId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        interfaceId:
          type: string
          format: uuid
        vmId:
          type: string
          format: uuid
        fixedIP:
          type: string
        networkId:
          type: string
          format: uuid
          description: Network of the attached NIC.
        networkName:
          type: string
          description: >-
            Display name of that network, present only when the response
            eager-loaded it.
        createdAt:
          type: string
          format: date-time
    SecurityGroupRuleDirection:
      type: string
      description: Traffic direction relative to the VM.
      enum: [ingress, egress]
    SecurityGroupRuleEthertype:
      type: string
      description: Address family the rule matches.
      enum: [ipv4, ipv6]
    SecurityGroupRule:
      type: object
      required: [id, direction, ethertype]
      properties:
        id:
          type: string
          format: uuid
        direction:
          $ref: "#/components/schemas/SecurityGroupRuleDirection"
        ethertype:
          $ref: "#/components/schemas/SecurityGroupRuleEthertype"
        protocolName:
          type: string
          description: tcp, udp, or icmp; absent matches any protocol.
          enum: [tcp, udp, icmp]
        portRangeMin:
          type: integer
          description: >-
            tcp/udp: first destination port of the range. icmp: the ICMP type.
        portRangeMax:
          type: integer
          description: >-
            tcp/udp: last destination port of the range. icmp: the ICMP code.
        remoteCIDR:
          type: string
          description: CIDR peer; mutually exclusive with remoteGroupId.
        remoteGroupId:
          type: string
          format: uuid
          description: >-
            Security-group peer — matches the referenced group's current
            member addresses.
        log:
          type: boolean
          description: >-
            Whether the realized OVN ACL logs the packets it matches. Off by
            default; set at rule creation and changed by delete + recreate,
            like every other field of a rule.
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    SecurityGroup:
      type: object
      required: [id, name, projectId, isDefault, rules, attachmentCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        projectId:
          type: string
          format: uuid
        isDefault:
          type: boolean
          description: >-
            The project's auto-created fallback group: undeletable and
            un-renamable, though its rules are editable.
        rules:
          type: array
          items:
            $ref: "#/components/schemas/SecurityGroupRule"
        attachmentCount:
          type: integer
          description: How many VM NICs currently attach this group.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateSecurityGroupRequest:
      type: object
      required: [name, projectId]
      properties:
        name:
          type: string
        description:
          type: string
        projectId:
          type: string
          format: uuid
          description: The project the resource belongs to. Required; there is no default project.
    UpdateSecurityGroupRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    CreateSecurityGroupRuleRequest:
      type: object
      required: [direction, ethertype]
      properties:
        direction:
          $ref: "#/components/schemas/SecurityGroupRuleDirection"
        ethertype:
          $ref: "#/components/schemas/SecurityGroupRuleEthertype"
        protocolName:
          type: string
          enum: [tcp, udp, icmp]
        portRangeMin:
          type: integer
        portRangeMax:
          type: integer
        remoteCIDR:
          type: string
        remoteGroupId:
          type: string
          format: uuid
        log:
          type: boolean
          description: Log the packets this rule matches. Defaults to false.
        description:
          type: string
    AttachSecurityGroupRequest:
      type: object
      description: >-
        Names exactly one workload — `vmId` or `sandboxId` — optionally
        narrowed to one of its NICs. Naming neither or both is a 400.
      properties:
        vmId:
          type: string
          format: uuid
        sandboxId:
          type: string
          format: uuid
          description: >-
            Attaching to a sandbox realizes the group's port group and ACLs,
            but not yet the membership: sandbox guest networking is not enabled,
            so the sandbox has no OVN port to make a member. See
            `securityGroupsEnforced` on the sandbox.
        interfaceId:
          type: string
          format: uuid
          description: The NIC; defaults to the workload's first interface.
    DNSRecordType:
      type: string
      description: >-
        Deliberately wider than any realization driver: the OVN `DNS` table
        answers A/AAAA/PTR only, and the per-network resolver is what makes
        the rest resolvable. Drivers reject what they cannot do with a clear
        error rather than the model pretending those records don't exist.
      enum: [A, AAAA, CNAME, TXT, SRV, PTR]
    DNSRecordView:
      type: string
      description: >-
        Which side of a split horizon the record belongs to. Carried so
        split-horizon is not a retrofit; nothing consumes it yet, so every
        record is served internally regardless of its value.
      enum: [internal, external, both]
      default: both
    DNSZoneNetworkAttachment:
      type: object
      required: [networkId, networkName, isPrimary]
      properties:
        networkId:
          type: string
          format: uuid
        networkName:
          type: string
        isPrimary:
          type: boolean
          description: >-
            Whether this zone is the network's primary — i.e. whether the
            network's VMs auto-register their derived records here.
        zoneResolutionWarning:
          type: string
          description: >-
            Why this network's guests will not resolve the DNS zones attached to
            it, with the remedy, or absent when they will. A property of the
            network rather than of this zone, so every entry for one network
            repeats it.
    DNSZone:
      type: object
      required: [id, name, projectId, networks, recordCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: >-
            The zone's fully-qualified name, lowercased and without a trailing
            dot. Not constrained to `.internal`: a tenant may serve
            `corp.example.com` internally. Unique per project, never globally.
        description:
          type: string
        projectId:
          type: string
          format: uuid
        networks:
          type: array
          description: The logical networks that can resolve this zone.
          items:
            $ref: "#/components/schemas/DNSZoneNetworkAttachment"
        recordCount:
          type: integer
          description: >-
            Authored records only. Derived records are assembled on demand and
            never stored — fetch the record set for the effective view.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateDNSZoneRequest:
      type: object
      required: [name, projectId]
      properties:
        name:
          type: string
          maxLength: 253
          description: Fully-qualified zone name, e.g. `acme.internal`.
        description:
          type: string
          maxLength: 4096
        projectId:
          type: string
          format: uuid
          description: The project the resource belongs to. Required; there is no default project.
    UpdateDNSZoneRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 253
        description:
          type: string
          maxLength: 4096
    AttachDNSZoneRequest:
      type: object
      required: [networkId]
      properties:
        networkId:
          type: string
          format: uuid
        primary:
          type: boolean
          default: false
          description: >-
            Also make this zone the network's primary — the zone its VMs
            auto-register into. Attaching alone only grants resolution.
    DNSRecord:
      type: object
      required: [id, zoneId, name, fqdn, type, value, ttl, view]
      properties:
        id:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        name:
          type: string
          description: Owner name relative to the zone; `@` is the apex.
        fqdn:
          type: string
          description: The same name fully qualified.
        type:
          $ref: "#/components/schemas/DNSRecordType"
        value:
          type: string
          description: >-
            RDATA in zone-file text form: an address for A/AAAA, a target name
            for CNAME/PTR, the string contents for TXT, and
            `priority weight port target` for SRV.
        ttl:
          type: integer
        view:
          $ref: "#/components/schemas/DNSRecordView"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateDNSRecordRequest:
      type: object
      required: [type, value]
      properties:
        name:
          type: string
          maxLength: 253
          description: >-
            Owner name relative to the zone; omitted means the apex (`@`). A
            leftmost `*` label is a wildcard, including a bare `*` for the
            zone-apex wildcard.
        type:
          $ref: "#/components/schemas/DNSRecordType"
        value:
          type: string
          maxLength: 4096
          description: >-
            Bounded far above what any record type accepts — each type's real
            ceiling comes from its own grammar (255 bytes for TXT, a domain
            name for CNAME/PTR/SRV, an address for A/AAAA).
        ttl:
          type: integer
          default: 300
        view:
          $ref: "#/components/schemas/DNSRecordView"
    UpdateDNSRecordRequest:
      type: object
      description: >-
        Name and type are the record's identity; change those by deleting and
        recreating, so the rename is conflict-checked as the create it is.
        `ttl` and `view` belong to the whole RRset (RFC 2181 §5.2), so changing
        either applies to every record sharing this one's name and type.
      properties:
        value:
          type: string
          maxLength: 4096
        ttl:
          type: integer
        view:
          $ref: "#/components/schemas/DNSRecordView"
    AssembledDNSRecord:
      type: object
      required: [name, type, values, ttl, view, origin]
      properties:
        name:
          type: string
          description: Fully-qualified owner name.
        type:
          $ref: "#/components/schemas/DNSRecordType"
        values:
          type: array
          description: >-
            The RRset's values, deduplicated and sorted. A list because an
            RRset is one: a dual-stack VM yields an A entry and an AAAA entry,
            and a round-robin name yields several values.
          items:
            type: string
        ttl:
          type: integer
        view:
          $ref: "#/components/schemas/DNSRecordView"
        origin:
          type: string
          description: >-
            `derived` entries are generated from VM hostnames and their IPAM
            allocations and are never stored; `authored` entries are record
            rows.
          enum: [derived, authored]
    AssembledDNSZone:
      type: object
      required: [zoneId, zoneName, records]
      properties:
        zoneId:
          type: string
          format: uuid
        zoneName:
          type: string
        records:
          type: array
          description: Sorted by name then type, so two assemblies diff cleanly.
          items:
            $ref: "#/components/schemas/AssembledDNSRecord"
    UserPublic:
      type: object
      description: The publicly readable projection of a user account.
      required: [username, email, displayName, isSystemAdmin, source]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
        currentOrganizationId:
          type: string
          format: uuid
          description: The organization the user is currently acting in, if any.
        isSystemAdmin:
          type: boolean
        source:
          $ref: "#/components/schemas/UserSource"

    UserSource:
      type: string
      description: >-
        How the account came into existence: created in Strato, provisioned by
        SCIM, or just-in-time provisioned on first OIDC login.
      enum: [local, scim, oidc]

    SelfRegisterUserRequest:
      type: object
      description: Self-registration payload for `POST /api/users/register`.
      required: [username, email, displayName]
      properties:
        username:
          type: string
        email:
          type: string
        displayName:
          type: string

    AdminCreateUserRequest:
      type: object
      description: Admin invitation payload. `role` only applies when `organizationId` is set.
      required: [username, email, displayName]
      properties:
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        isSystemAdmin:
          type: boolean
          default: false
        organizationId:
          type: string
          format: uuid
          description: Optional organization to provision the invitee into up front.
        role:
          type: string
          format: uuid
          nullable: true
          description: >-
            Canonical organization role id for `organizationId`. Omit or use
            null to create bare organization membership without a role grant.

    AdminCreateUserResponse:
      type: object
      description: >-
        The created account plus its one-time claim invitation. The token is
        shown exactly once so the admin can hand the link to the invitee.
      required: [user, claimToken, claimUrl]
      properties:
        user:
          $ref: "#/components/schemas/UserPublic"
        claimToken:
          type: string
        claimUrl:
          type: string
        claimExpiresAt:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      description: Partial update; omitted fields are left unchanged.
      properties:
        username:
          type: string
        displayName:
          type: string
        email:
          type: string

    SessionResponse:
      type: object
      description: The user behind the current session.
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/UserPublic"

    LogoutResponse:
      type: object
      description: >-
        Logout result. `sloUrl` is the IdP's RP-initiated logout URL when the
        session was OIDC-established and the provider supports it.
      properties:
        sloUrl:
          type: string

    ClaimInfoResponse:
      type: object
      description: Describes a passkey-claim invitation without revealing an error for unusable tokens.
      required: [username, displayName, valid, alreadyClaimed, expired]
      properties:
        username:
          type: string
        displayName:
          type: string
        valid:
          type: boolean
        alreadyClaimed:
          type: boolean
        expired:
          type: boolean

    ClaimBeginRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The one-time claim token from the invitation link.

    ClaimFinishRequest:
      type: object
      required: [token, challenge, response]
      properties:
        token:
          type: string
        challenge:
          type: string
          description: The base64url challenge returned by `/auth/claim/begin`.
        response:
          $ref: "#/components/schemas/WebAuthnRegistrationCredential"
        transports:
          type: array
          description: >-
            The authenticator's `getTransports()` values, stored and echoed back
            in later `allowCredentials`/`excludeCredentials` lists. Unrecognized
            values are discarded.
          items:
            type: string

    PasskeyRegistrationBeginRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string

    PasskeyRegistrationBeginResponse:
      type: object
      description: Wraps the WebAuthn `PublicKeyCredentialCreationOptions` for `navigator.credentials.create()`.
      required: [options]
      properties:
        options:
          $ref: "#/components/schemas/WebAuthnCredentialCreationOptions"

    PasskeyRegistrationFinishRequest:
      type: object
      required: [challenge, response]
      properties:
        challenge:
          type: string
          description: The base64url challenge returned by the matching begin call.
        response:
          $ref: "#/components/schemas/WebAuthnRegistrationCredential"
        transports:
          type: array
          description: >-
            The authenticator's `getTransports()` values, stored and echoed back
            in later `allowCredentials`/`excludeCredentials` lists. Unrecognized
            values are discarded.
          items:
            type: string

    PasskeyRegistrationFinishResponse:
      type: object
      description: The enrolled credential; a session cookie is set alongside it.
      required: [credentialID, success]
      properties:
        credentialID:
          type: string
          description: Base64-encoded credential id.
        success:
          type: boolean
        user:
          $ref: "#/components/schemas/UserPublic"

    PasskeyAuthenticationBeginRequest:
      type: object
      description: Omit `username` for a discoverable-credential (usernameless) ceremony.
      properties:
        username:
          type: string

    PasskeyAuthenticationBeginResponse:
      type: object
      description: Wraps the WebAuthn `PublicKeyCredentialRequestOptions` for `navigator.credentials.get()`.
      required: [options]
      properties:
        options:
          $ref: "#/components/schemas/WebAuthnCredentialRequestOptions"

    PasskeyAuthenticationFinishRequest:
      type: object
      required: [challenge, response]
      properties:
        challenge:
          type: string
        response:
          $ref: "#/components/schemas/WebAuthnAuthenticationCredential"

    PasskeyAuthenticationFinishResponse:
      type: object
      required: [user, success]
      properties:
        user:
          $ref: "#/components/schemas/UserPublic"
        success:
          type: boolean

    WebAuthnCredentialCreationOptions:
      type: object
      description: >-
        A WebAuthn `PublicKeyCredentialCreationOptions` structure (relying party,
        user entity, challenge, algorithms, `excludeCredentials`), passed through
        to the browser verbatim.
      additionalProperties: true

    WebAuthnCredentialRequestOptions:
      type: object
      description: >-
        A WebAuthn `PublicKeyCredentialRequestOptions` structure (challenge,
        relying-party id, allow-list), passed through to the browser verbatim.
      additionalProperties: true

    WebAuthnRegistrationCredential:
      type: object
      description: >-
        The authenticator's registration response — the browser's
        `PublicKeyCredential` from `navigator.credentials.create()`, serialized
        with base64url fields.
      additionalProperties: true

    WebAuthnAuthenticationCredential:
      type: object
      description: >-
        The authenticator's assertion — the browser's `PublicKeyCredential` from
        `navigator.credentials.get()`, serialized with base64url fields.
      additionalProperties: true

    PasskeySummary:
      type: object
      description: An enrolled passkey credential, as shown in account settings.
      required: [deviceType, transports, backedUp]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: User-supplied label; null when the client renders a default.
        deviceType:
          type: string
          description: >-
            `multi_device` for a syncable passkey, `single_device` for one bound
            to the authenticator that created it. Refreshed on every sign-in.
        transports:
          type: array
          items:
            type: string
        backedUp:
          type: boolean
          description: >-
            True when the credential is currently backed up to a cloud keychain.
            Refreshed from the authenticator on every sign-in.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time

    AddPasskeyFinishRequest:
      type: object
      description: Finish payload for the authenticated add-a-passkey ceremony.
      required: [challenge, response]
      properties:
        challenge:
          type: string
        response:
          $ref: "#/components/schemas/WebAuthnRegistrationCredential"
        name:
          type: string
          description: Optional label for the new passkey (max 64 characters).
        transports:
          type: array
          description: >-
            The authenticator's `getTransports()` values, stored and echoed back
            in later `allowCredentials`/`excludeCredentials` lists. Unrecognized
            values are discarded.
          items:
            type: string

    RenamePasskeyRequest:
      type: object
      description: An empty or omitted name clears the label.
      properties:
        name:
          type: string

    APIKeySummary:
      type: object
      description: An API key without its secret.
      required: [name, keyPrefix, restriction, isActive]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        keyPrefix:
          type: string
          description: The first 12 characters of the key followed by an ellipsis.
        restriction:
          $ref: "#/components/schemas/CredentialRestriction"
        isActive:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    CredentialRestriction:
      type: object
      description: >-
        What a credential may do, in the ordinary IAM action and node
        vocabulary. A restriction only ever *subtracts*: the effective
        permission is the principal's role bindings intersected with it, and it
        is enforced by the Cedar evaluator like every other authorization
        decision, so a refusal appears in `iam_decision_logs` under the
        `credential` tier. An absent restriction means "everything this
        credential's owner can do".


        On a response this is the credential's canonical restriction. On a
        device-authorization request it is what the client is asking for — a
        request, not a grant: the approving user sees it and may narrow it
        further.
      properties:
        role:
          type: string
          format: uuid
          description: >-
            Request only. Sugar for the role's action list, expanded at write
            time so a later edit to the role cannot widen an issued credential.
            Mutually exclusive with `actions`.
        actions:
          type: array
          description: >-
            Action patterns — an exact action (`vm:read`), a service wildcard
            (`vm:*`, which covers actions shipped after the credential was
            minted), `read` (every action whose name says it reads, resolved on
            every check so it stays current), or `*` for every action. An empty
            list is rejected; write `["*"]` for an unrestricted credential.
          items:
            type: string
        nodeType:
          type: string
          description: >-
            The subtree the credential may act in. Both `nodeType` and `nodeId`
            or neither. Identity-plane actions (`user:read` and friends) are
            exempt, since a user record is parentless and would otherwise be
            unreachable from any scoped credential.
        nodeId:
          type: string
          format: uuid


    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        restriction:
          $ref: "#/components/schemas/CredentialRestriction"
        expiresInDays:
          type: integer
          description: Optional lifetime in days (1–365). Omit for a non-expiring key.
          minimum: 1
          maximum: 365

    CreateAPIKeyResponse:
      type: object
      description: The created key. `key` is the full secret and is returned only here.
      required: [name, key, keyPrefix, restriction]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key:
          type: string
          description: The full API key — shown once and never retrievable again.
        keyPrefix:
          type: string
        restriction:
          $ref: "#/components/schemas/CredentialRestriction"
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    UpdateAPIKeyRequest:
      type: object
      description: Partial update; omitted fields are left unchanged.
      properties:
        name:
          type: string
        restriction:
          $ref: "#/components/schemas/CredentialRestriction"
        isActive:
          type: boolean

    DeviceAuthorizationRequest:
      type: object
      description: RFC 8628 §3.1 device authorization request.
      properties:
        client_name:
          type: string
          description: Human-readable client label shown on the approval page. Defaults to "Strato CLI".
        restriction:
          $ref: "#/components/schemas/CredentialRestriction"

    DeviceAuthorizationResponse:
      type: object
      description: RFC 8628 §3.2 device authorization response (OAuth snake_case field names).
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
      properties:
        device_code:
          type: string
        user_code:
          type: string
        verification_uri:
          type: string
        verification_uri_complete:
          type: string
        expires_in:
          type: integer
        interval:
          type: integer
          description: Minimum seconds between polls of `/oauth/token`.

    OAuthTokenRequest:
      type: object
      description: RFC 6749 §4 / RFC 8628 §3.4 token request.
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: ["urn:ietf:params:oauth:grant-type:device_code", refresh_token]
        device_code:
          type: string
          description: Required for the device-code grant.
        refresh_token:
          type: string
          description: Required for the refresh-token grant.

    OAuthTokenResponse:
      type: object
      description: RFC 6749 §5.1 token response.
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string

    OAuthRevokeRequest:
      type: object
      description: RFC 7009 revocation request.
      required: [token]
      properties:
        token:
          type: string
          description: An access or refresh token.

    OAuthErrorResponse:
      type: object
      description: >-
        RFC 6749 §5.2 / RFC 8628 §3.5 error body. Distinct from the platform
        `Error` envelope: the `/oauth/*` endpoints return this shape so the
        polling CLI can dispatch on the machine-readable `error` code.
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_grant
            - invalid_scope
            - unsupported_grant_type
            - authorization_pending
            - slow_down
            - access_denied
            - expired_token
        error_description:
          type: string

    ApproveDeviceAuthorizationRequest:
