        defaultCpu:
          type: integer
        defaultMemory:
          type: integer
          format: int64
        defaultDisk:
          type: integer
          format: int64
        defaultCmdline:
          type: string
    UpdateImageRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        architecture:
          $ref: "#/components/schemas/CPUArchitecture"
        defaultCpu:
          type: integer
        defaultMemory:
          type: integer
