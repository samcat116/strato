        schema: { type: string, format: uuid }
    get:
      operationId: listSSFStreams
      summary: List an organization's Shared Signals streams
      description: Requires organization membership.
      tags: [Shared Signals]
      responses:
        "200":
          description: The organization's SSF streams.
          content:
            application/json:
              schema:
                type: array
