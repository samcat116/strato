      required: [providers]
      properties:
        organizationID:
          type: string
          format: uuid
          nullable: true
        providers:
          type: array
          items:
            $ref: "#/components/schemas/OIDCProviderPublicSummary"

    RegistrationPolicy:
      type: object
      description: >-
        Whether the sign-in screen should offer account creation.
      required: [selfRegistrationEnabled, bootstrapRequired]
      properties:
        selfRegistrationEnabled:
          type: boolean
          description: >-
            Whether `POST /api/users/register` will accept an account right now.
            False when the operator disabled self-registration, unless the
            deployment has no users yet.
        bootstrapRequired:
          type: boolean
          description: >-
            True when no users exist, so the next account created is the first
            one and becomes the system admin.

