    SCIMUserResource:
      type: object
      description: >-
        An RFC 7643 User. Strato populates id, externalId, meta, userName,
        name.formatted, displayName, active and a single primary work email;
        other core attributes are accepted on write but not echoed back. The
        `groups` attribute is deliberately omitted — group membership is served
        from the Groups endpoint.
      required: [schemas, userName]
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:schemas:core:2.0:User"]
        id:
          type: string
        externalId:
          type: string
        meta:
          $ref: "#/components/schemas/SCIMResourceMeta"
        userName:
          type: string
        name:
          type: object
          properties:
            formatted:
              type: string
            familyName:
              type: string
            givenName:
              type: string
            middleName:
              type: string
            honorificPrefix:
              type: string
            honorificSuffix:
              type: string
        displayName:
          type: string
        nickName:
          type: string
        title:
          type: string
        userType:
          type: string
        preferredLanguage:
          type: string
        locale:
          type: string
        timezone:
          type: string
        active:
          type: boolean
          description: >-
            Deactivating a user prevents them from establishing a session at
            login.
        emails:
          type: array
          items:
            $ref: "#/components/schemas/SCIMMultiValuedAttribute"
        phoneNumbers:
          type: array
          items:
