        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/sandboxes/{sandboxID}/snapshots:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
    get:
      operationId: listSandboxSnapshots
      summary: List a sandbox's snapshots
      tags: [Sandbox Snapshots]
      parameters:
        - $ref: "#/components/parameters/ListLimitQuery"
        - $ref: "#/components/parameters/ListOffsetQuery"
      responses:
        "200":
          description: A page of the sandbox's snapshots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxSnapshotListPage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createSandboxSnapshot
      summary: Create a sandbox snapshot
      description: >-
        The request body is optional; an empty body snapshots without stopping.
        Asynchronous — refetch the snapshot until its `conditions` converge.
      tags: [Sandbox Snapshots]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxSnapshotRequest"
      responses:
        "202": { $ref: "#/components/responses/AcceptedSandboxSnapshotMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/sandboxes/{sandboxID}/snapshots/{snapshotID}:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/SandboxSnapshotID"
    delete:
      operationId: deleteSandboxSnapshot
      summary: Delete a sandbox snapshot
      description: >-
        Asynchronous. The record survives until the owning agent confirms the
        artifacts are gone, so poll `GET /api/operations/{mutationId}`.
      tags: [Sandbox Snapshots]
      responses:
        "202": { $ref: "#/components/responses/AcceptedSandboxSnapshotMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/sandboxes/{sandboxID}/snapshots/{snapshotID}/restore:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/SandboxSnapshotID"
    post:
      operationId: restoreSandboxSnapshot
      summary: Restore a sandbox from a snapshot
      description: >-
        Rewinds the sandbox in place to the snapshot — same id, same addresses.
        Asynchronous — refetch the sandbox and read its `conditions`.
      tags: [Sandbox Snapshots]
      responses:
        "202": { $ref: "#/components/responses/AcceptedSandboxMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/sandboxes/{sandboxID}/snapshots/{snapshotID}/export:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/SandboxSnapshotID"
    post:
      operationId: exportSandboxSnapshot
      summary: Export a sandbox snapshot to project storage
      description: >-
        Records that the snapshot's artifacts should also exist in durable
        project storage, so it can be moved between agents (snapshot mobility).
        A placement fact, not a command: the owning agent converges by streaming
        each artifact through the control plane, and the snapshot's `conditions`
        stay unconverged until every artifact has an integrity record the
        control plane computed itself. Asynchronous — refetch the snapshot.
      tags: [Sandbox Snapshots]
      responses:
        "202": { $ref: "#/components/responses/AcceptedSandboxSnapshotMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/sandboxes/{sandboxID}/snapshots/{snapshotID}/artifacts/{artifactKind}:
    parameters:
      - $ref: "#/components/parameters/SandboxID"
      - $ref: "#/components/parameters/SandboxSnapshotID"
      - name: artifactKind
        in: path
        required: true
        description: Which snapshot artifact to transfer.
        schema:
          $ref: "#/components/schemas/SandboxSnapshotArtifactKind"
    get:
      operationId: downloadSnapshotArtifact
      summary: Download a snapshot artifact
      description: >-
        Streams the raw artifact bytes for an exported snapshot. Used by agents
        importing a snapshot onto another host; authenticated by a forwarded
        SPIFFE SVID client certificate over mTLS (the handler verifies the cert
        before serving bytes).
      tags: [Sandbox Snapshots]
      responses:
        "200":
          description: The artifact bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: uploadSnapshotArtifact
      summary: Upload a snapshot artifact
      description: >-
        Streams the raw artifact bytes for an exported snapshot (used by agents
        exporting a snapshot); authenticated by a forwarded SPIFFE SVID client
        certificate over mTLS.
      tags: [Sandbox Snapshots]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The artifact was stored.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

